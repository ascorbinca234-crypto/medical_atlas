.lc:not(.flip) .lc-b{max-height:280px;overflow:hidden}
.lc.flip .lc-f{pointer-events:none}
.lc-lec{font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0}
.lc-n{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.08;margin:6px 0 4px;overflow-wrap:anywhere}
.lc-n2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0 0 8px}
.lc-ask{color:var(--ink-3);font-size:14px;margin:8px 0 10px}
.lc-q{font-family:var(--f-display);font-size:20px;line-height:1.35;max-width:52ch;margin:8px 0 0;color:var(--ink)}
.lc-show{margin-top:6px}
.lc-show kbd{border-color:var(--sheet)}
.lb-s{margin-top:12px}
.lb-s h4{margin:0 0 4px;font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.lb-s ul{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-2)}
.lb-s li{padding:1px 0}
.lb-s p{margin:2px 0;font-size:14.5px;color:var(--ink-2)}
.lb-s.pok h4{color:var(--hema)} .lb-s.pe h4{color:var(--eosin)}
.lb-s.fm{padding:8px 12px 10px;border:1.5px solid var(--k-fm);border-radius:8px}
.lb-mark{padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--hl-y) 55%,var(--sheet))}
.lb-l{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.l-rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.l-rate button{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px 8px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.l-rate button:active{transform:scale(.97)}
.l-rate .r0{color:var(--eosin);border-color:var(--eosin)} .l-rate .r0:hover{background:var(--eosin-soft)}
.l-rate .r1{color:var(--iodine);border-color:var(--iodine)} .l-rate .r1:hover{background:var(--iodine-soft)}
.l-rate .r2{color:var(--hema);border-color:var(--hema)} .l-rate .r2:hover{background:var(--hema-soft)}
.l-rate:not([hidden]){animation:fxup .3s ease-out}
.l-empty{text-align:center;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:32px 20px}
.l-empty h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 6px}
.l-empty p{color:var(--ink-2);margin:0 auto;max-width:52ch}
.l-more{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.l-q{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 22px}
.l-q > p{font-size:18px;line-height:1.45;margin:0 0 14px}
.l-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.l-opts button{display:flex;align-items:baseline;gap:10px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:11px 13px;font-size:15px;cursor:pointer;min-width:0;overflow-wrap:anywhere;transition:border-color .15s,background .2s}
.l-opts button kbd{margin:0;flex:none;color:var(--ink-3)}
.l-opts button:hover:not(:disabled){border-color:var(--hema)}
.l-opts button:disabled{cursor:default}
.l-opts .ok{background:var(--hl-g);border-color:#2E9E5B;color:var(--hl-ink);animation:pop .35s ease-out}
.l-opts .no{background:var(--eosin-soft);border-color:var(--eosin);animation:shake .4s ease-in-out}
.l-fb{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.l-fb p{margin:0;font-size:14.5px;color:var(--ink-2);flex:1;min-width:220px}
.l-fb p.ok b{color:#2E9E5B} .l-fb p.no b{color:var(--eosin)}
.l-fb .btn kbd{border-color:var(--sheet)}
.l-res{display:flex;align-items:center;gap:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:18px 22px}
.l-ring{width:110px;height:110px;flex:none}
.rg-bg{fill:none;stroke:var(--rule-2);stroke-width:10}
.rg-fg{fill:none;stroke:var(--hema);stroke-width:10;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:calc(326.73 - 326.73 * var(--p) / 100);transform:rotate(-90deg);transform-origin:60px 60px;animation:ringfill 1.2s cubic-bezier(.3,.7,.3,1) both}
.l-res-t b{display:block;font:600 34px/1.1 var(--f-display)}
.l-res-t span{color:var(--ink-2)}
.l-wrong{list-style:none;margin:0;padding:0}
.l-wrong li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:8px 0;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2)}
.l-wrong li:first-child{border-top:0}
.l-wrong b{color:var(--ink)}
.l-bars{display:flex;flex-direction:column;gap:2px}
.l-bar{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(90px,200px) 52px;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px}
.l-bar:hover{background:var(--paper)}
.l-bl{font:600 14px var(--f-display);color:var(--hema)}
.l-bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-bb{display:flex;height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.l-bb i{display:block;height:100%;transition:width .8s ease}
.l-bb .k,.l-leg .k{background:var(--hema)} .l-bb .l,.l-leg .l{background:color-mix(in srgb,var(--hema) 35%,var(--rule-2))}
.l-bn{font:500 12.5px var(--f-mono);text-align:right;color:var(--ink-3)}
.l-leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink-3);margin:12px 0 0}
.l-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.l-leg i:first-child{margin-left:0}
.l-leg .n{background:var(--rule-2)}
.l-heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.l-heat i{border-radius:3px;background:color-mix(in srgb,var(--hema) calc(var(--a) * 100%),var(--rule-2))}
.l-confirm{margin:14px auto 0;max-width:420px;text-align:center;padding:14px;border:1px solid var(--eosin);border-radius:12px;background:var(--eosin-soft)}
.l-confirm p{margin:0 0 10px;color:var(--ink)}
.confetti{position:absolute;inset:-40px 0 0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:0;width:8px;height:12px;border-radius:2px;opacity:0;animation:confetti 2.2s cubic-bezier(.2,.6,.4,1) forwards}
@media (max-width:640px){
  .l-stats{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .l-opts{grid-template-columns:minmax(0,1fr)}
  .lc-f,.lc-b{padding:18px 16px}
  .l-bar{grid-template-columns:40px minmax(0,1fr) 46px}
  .l-bb{grid-column:1 / -1;grid-row:2}
  .l-res{flex-direction:column;text-align:center}
  .l-rate button{font-size:13.5px;padding:12px 4px}
  .l-rate kbd{display:none}
}

/* =====================================================================
   Анимации: схемы, прокрутка, страница
   ===================================================================== */
.fx-enter{animation:fxup .32s ease-out both}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
.fx-cf > *{opacity:0;transform:translateX(-6px)}
.fx-cf.in > *{animation:fxchain .38s ease-out calc(var(--i,0) * 70ms) both}
.fx-gctl{display:inline-flex;align-items:center;gap:10px;margin-left:auto}
.fx-step{font:500 12px var(--f-mono);color:var(--ink-3)}
.fx-gbtn{border:1px solid var(--hema);background:var(--sheet);color:var(--hema);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.fx-gbtn:hover{background:var(--hema-soft)}
.fx-gbtn[aria-pressed="true"]{background:var(--hema);color:var(--sheet)}
.fx-gbtn:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.fx-hint{font-size:12.5px;color:var(--ink-3);padding:2px 20px 10px;margin:0}
.fx-hint .fx-dn{color:var(--hema);font-weight:600} .fx-hint .fx-up{color:var(--iodine);font-weight:600}
@media (hover:none){.fx-hint{display:none}}
.gn-w,.ge-w{transition:opacity .25s}
.gn-w{transform-box:fill-box;transform-origin:center}
.fx-hide .gn-w,.fx-hide .ge-w{opacity:0;transition:none}
.fx-hide .ge-w.on{opacity:1;transition:opacity .2s}
.fx-hide .gn-w.on{opacity:1;animation:fxpop .42s cubic-bezier(.3,1.5,.5,1) both}
.fx-playing .gn-w.on:not(.cur){opacity:.82}
.gn-w.cur .gn{stroke:var(--hema);stroke-width:2.6}
.fx-playing .gn-w.cur{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--hema) 55%,transparent))}
.fx-trace .gn-w:not(.tr),.fx-trace .ge-w:not(.tr){opacity:.16}
.fx-trace .ge-w.tr .ge,.fx-trace .ge-w.tr .ge-i,.fx-trace .ge-w.tr .ge-d{stroke-width:2.2;stroke-dasharray:7 5;animation:fxdash .7s linear infinite}
.fx-trace .ge-w.tr-dn .ge,.fx-trace .ge-w.tr-dn .ge-d{stroke:var(--hema)}
.fx-trace .ge-w.tr-up .ge,.fx-trace .ge-w.tr-up .ge-d{stroke:var(--iodine)}
.fx-trace .gn-w.tr-me .gn{stroke:var(--hema);stroke-width:2.8}
.fx-trace .gn-w.tr-me{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hema) 50%,transparent))}
.kgraph .gn-w:not(:has(.gdrug)){cursor:pointer}
/* синапс: медиатор в щели «дышит» */
.fig-scroll svg circle.s-nt[opacity]{transform-box:fill-box;animation:ntd 2.6s ease-in-out infinite alternate}
.fig-scroll svg circle.s-nt[opacity]:nth-of-type(2n){animation-duration:3.3s;animation-delay:-1.1s}
.fig-scroll svg circle.s-nt[opacity]:nth-of-type(3n){animation-duration:2.1s;animation-delay:-.6s}
/* прогресс чтения */
.fx-prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
.fx-prog.on{opacity:1}
.fx-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin));transform-origin:0 50%;transform:scaleX(0)}
.flash{animation:flash 1.6s ease-out}

@keyframes fxup{from{opacity:0;transform:translateY(10px)}}
@keyframes fxchain{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fxpop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes fxdash{to{stroke-dashoffset:-12}}
@keyframes ntd{to{transform:translate(4px,6px)}}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--hema)}100%{box-shadow:0 0 0 3px transparent}}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@keyframes pulse-line{from{stroke-dashoffset:60}to{stroke-dashoffset:-60}}
@keyframes cardflip{0%,30%{transform:rotate(12deg)}50%,80%{transform:rotate(12deg) rotateY(180deg)}100%{transform:rotate(12deg) rotateY(360deg)}}
@keyframes orghit{0%{filter:drop-shadow(0 0 0 transparent)}40%{filter:drop-shadow(0 0 6px var(--hema))}100%{filter:drop-shadow(0 0 0 transparent)}}
@keyframes artflow{to{stroke-dashoffset:-30}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
@keyframes spark{0%{opacity:1}100%{opacity:.2}}
@keyframes drip{0%{opacity:0;transform:translateY(-2px)}20%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes pulse-o{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes heat{0%{opacity:0;transform:translateY(4px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes breathe{0%,100%{transform:scale(1)}45%{transform:scale(var(--bd-bamp))}}
@keyframes mucus{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(var(--bd-beat))}28%{transform:scale(1)}40%{transform:scale(calc((var(--bd-beat) - 1) * .45 + 1))}52%,100%{transform:scale(1)}}
@keyframes beat-irr{0%{transform:scale(1)}10%{transform:scale(var(--bd-beat))}20%{transform:scale(1)}48%{transform:scale(1)}55%{transform:scale(var(--bd-beat))}62%,100%{transform:scale(1)}}
@keyframes warn{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes urL{0%{opacity:0;transform:translate(132px,394px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(172px,442px)}}
@keyframes urR{0%{opacity:0;transform:translate(228px,394px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(188px,442px)}}
@keyframes void{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(.2)}}
@keyframes peri{to{stroke-dashoffset:-38}}
@keyframes tremor{0%{transform:translate(0,0)}25%{transform:translate(.8px,-.5px)}50%{transform:translate(-.6px,.6px)}75%{transform:translate(.5px,.4px)}100%{transform:translate(0,0)}}
@keyframes bleed{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(18px)}}
@keyframes ecgrun{to{transform:translateX(var(--w))}}
@keyframes rbc{to{transform:translate(3px,-3px)}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes ringfill{from{stroke-dashoffset:326.73}}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),420px) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  .fx-enter,.rv,.fx-cf > *,.org.hit,.bd-org.pop,.l-rate,.l-opts .ok,.l-opts .no,.flash,.cta-b,.pcard{animation:none!important;transition:none!important}
  .rv,.fx-cf > *{opacity:1!important;transform:none!important}
  .bd-svg *,.ecg-run,.rbc circle,.cta-ic *,.ico-hb,.fig-scroll svg circle.s-nt,.rg-fg{animation:none!important}
  .bd-urine circle{opacity:0!important}
  .lc-in{transition:none}
  .lc.flip .lc-in{transform:none}
  .lc.flip .lc-f{display:none}
  .lc .lc-b{transform:none;display:none}
  .lc.flip .lc-b{display:block}
  .fx-trace .ge-w.tr .ge,.fx-trace .ge-w.tr .ge-i,.fx-trace .ge-w.tr .ge-d{animation:none}
}
.l-rate{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;padding:8px;margin-left:-8px;margin-right:-8px;border-radius:14px;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* =====================================================================
   Единая карточка препарата
   ===================================================================== */
.u-hl{margin:10px 0 0;font-size:13px}
.u-grp{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.u-grp li{font:500 13px/1.45 var(--f-mono);color:var(--hema)}
.u-grp .roman{display:inline-block;min-width:34px;margin-right:6px;font:600 12px/1.45 var(--f-display);color:var(--ink-3)}
.u-sec > h3{display:flex;align-items:center;gap:8px}
.u-sec.u-dose > h3,.u-sec.u-ind > h3,.u-sec.u-ae > h3{font-size:12px;color:var(--ink)}
.u-sec.u-dose > h3::before,.u-sec.u-ind > h3::before,.u-sec.u-ae > h3::before{content:"";width:10px;height:10px;border-radius:3px;flex:none}
.u-sec.u-dose > h3::before{background:var(--iodine)}
.u-sec.u-ind > h3::before{background:var(--hema)}
.u-sec.u-ae > h3::before{background:var(--eosin)}
.u-dose{background:color-mix(in srgb,var(--iodine-soft) 45%,var(--sheet));border:1px solid color-mix(in srgb,var(--iodine) 35%,var(--rule));border-radius:12px;padding:12px 14px 14px;margin-top:20px}
.u-src{margin:10px 0 4px;font:600 10.5px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.u-src:first-child{margin-top:0}
.u-rx{padding:8px 0;border-top:1px dashed var(--rule)}
.u-rx:first-child{border-top:0;padding-top:0}
.u-rx.mk{background:color-mix(in srgb,var(--hl-y) 40%,transparent);border-radius:8px;padding:8px 10px;border-top:0;margin:4px 0}
.u-rx dl,.u-dl{margin:0;display:flex;flex-direction:column;gap:6px}
.u-rx dl > div,.u-dl > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:2px 12px}
.u-rx dt,.u-dl dt{font-size:12.5px;color:var(--ink-3)}
.u-rx dd,.u-dl dd{margin:0;font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
.u-dl{padding-top:6px}
.u-dl dd{font-weight:500}
.u-note{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.u-x{margin:10px 0 0}
.u-rp{margin-top:8px}
.u-rp .kc-rp{margin-top:2px}
.u-l{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-2)}
.u-l li{padding:2px 0}
.u-more{margin-top:10px;border:1px solid var(--rule);border-radius:10px;padding:0 12px;background:var(--sheet)}
.u-more > summary{cursor:pointer;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--hema)}
.u-more > summary:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.u-more[open] > summary{border-bottom:1px solid var(--rule-2);margin-bottom:8px}
.u-more .dl2{margin-bottom:10px}
.u-mech{margin-top:24px}
.u-g{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.u-g span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule)}
.u-g span.up{border-color:var(--eosin);background:color-mix(in srgb,var(--eosin-soft) 60%,transparent)}
.u-g span.dn{border-color:var(--hema);background:color-mix(in srgb,var(--hema-soft) 60%,transparent)}
.u-g b{font-variant-numeric:tabular-nums}
.u-eff li{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:6px 0}
.u-act{margin:8px 0 0}
.u-wh{display:flex;flex-wrap:wrap;gap:8px}
.u-fm .kc-fm{margin-top:0}
@media (max-width:600px){
  .u-rx dl > div,.u-dl > div{grid-template-columns:minmax(0,1fr)}
  .u-eff li{grid-template-columns:minmax(0,1fr) auto}
  .u-eff .bd-o{grid-column:1 / -1}
}
/* доза в карточках конспекта */
.kc-dose{margin-top:12px;padding:8px 12px 10px;border-radius:8px;background:color-mix(in srgb,var(--iodine-soft) 50%,transparent);border:1px solid color-mix(in srgb,var(--iodine) 30%,var(--rule))}
.kc-dose > h5{margin:0 0 4px;font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--iodine)}
.kc-dose .u-src{display:none}
.kc-dose .u-rx dl > div,.kc-dose .u-dl > div{grid-template-columns:minmax(0,1fr)}
.kc-dose .u-rx dt,.kc-dose .u-dl dt{font-size:11.5px}
.kc-dose .u-rx dd,.kc-dose .u-dl dd{font-size:13.5px}
.kc-dose .u-note{font-size:11.5px}
.kc-open{margin-top:2px}
/* в «Учить» */
.lb-s.u-dose{background:color-mix(in srgb,var(--iodine-soft) 45%,transparent);border-radius:10px;padding:8px 12px 10px}
.lb-s.u-dose > h4{color:var(--iodine)}
.lb-s .u-l{font-size:14px}
.lb-s .dl2 li{font-size:14px}
/* список «Все препараты» */
.dbset{margin:2px 0 6px}
.dbrow.hl-y b{background:var(--hl-y);color:var(--hl-ink);padding:0 4px;border-radius:4px}
.dbrow.hl-g b{background:var(--hl-g);color:var(--hl-ink);padding:0 4px;border-radius:4px}
.results b i{font-style:normal;font-weight:400;color:var(--ink-3)}

/* =====================================================================
   Конспект: подсказка и панель «Раздел / Препараты»
   ===================================================================== */
.khint{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--hema-soft);font-size:14px;color:var(--ink-2);max-width:78ch}
.khint b{color:var(--ink)}
.kbar{position:sticky;top:0;z-index:12;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin:20px -6px 0;padding:8px 6px;background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid transparent;transition:border-color .2s}
.kbar.stuck{border-bottom-color:var(--rule)}
.kb-b{display:inline-flex;align-items:center;gap:6px;min-width:0;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.kb-b:hover{border-color:var(--hema)}
.kb-b[aria-expanded="true"]{border-color:var(--hema);box-shadow:inset 0 0 0 1px var(--hema)}
.kb-b:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.kb-sec{flex:1 1 auto;max-width:520px}
.kb-l{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kb-cur{overflow:hidden;text-overflow:ellipsis;font-weight:500}
.kb-n{font:500 12px var(--f-mono);color:var(--hema)}
.kb-ar{color:var(--ink-3);font-size:11px}
.kb-up{margin-left:auto;width:36px;justify-content:center;padding:7px 0}
.kpop{position:absolute;left:6px;top:calc(100% + 4px);z-index:13;width:min(520px,calc(100vw - 32px));max-height:min(62vh,520px);overflow:auto;background:var(--sheet);border-radius:12px;box-shadow:0 0 0 1px var(--rule),0 18px 40px -20px #0b0e1c80;padding:6px;overscroll-behavior:contain}
.kpop ol{list-style:none;margin:0;padding:0;counter-reset:ks}
.kpop li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.kpop li{counter-increment:ks}
.kpop li button::before{content:counter(ks);font:600 12px/1.6 var(--f-mono);color:var(--ink-3);min-width:18px}
.kpop li button:hover,.kpop li button:focus-visible{background:var(--hema-soft);outline:none}
.kpop-d input{width:100%;font:inherit;font-size:14.5px;padding:9px 11px;margin:2px 0 6px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.kpop-d input:focus{outline:2px solid var(--hema);outline-offset:0;border-color:transparent}
.kp-l{display:flex;flex-direction:column}
.kp-l button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.kp-l button:hover,.kp-l button:focus-visible{background:var(--hema-soft);outline:none}
.kp-l b{font-weight:600;font-size:14.5px;padding:0 3px;border-radius:3px;text-decoration:none;color:var(--ink)}
.kp-l b.hl-y,.kp-l b.hl-g{color:var(--hl-ink)}
.kp-l small{font-size:12px;color:var(--ink-3)}
@media (max-width:920px){
  .kbar{top:56px}
  .kpop{position:fixed;left:16px;right:16px;top:auto;width:auto;max-height:calc(100vh - 140px)}
  .kbar .kpop{top:116px}
}
@media (max-width:520px){
  .kb-sec .kb-l{display:none}
  .kb-b{padding:7px 10px}
}
h2.sec[id]{scroll-margin-top:72px}
.dbrow b,.dbrow span,.dbrow small,.dz-h h2,.kp-l b,.results b,.kc h4,.u-grp li,.dday h3,.bd-h h2,.lc-n2,.l-opts button,.dz-al{overflow-wrap:anywhere}
.dbrow.hl-y b,.dbrow.hl-g b{justify-self:start}


/* =====================================================================
   Учебная версия: навигатор конспекта, рецепты, прогон, повторение
   ===================================================================== */
:root{--mask:#DCE0EC;--ok:#2E9E5B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mask:#2C3254;--ok:#5BC98A}}
:root[data-theme="dark"]{--mask:#2C3254;--ok:#5BC98A}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- бланк рецепта ---------- */
.rp-list{display:grid;gap:10px}
.rp{position:relative;margin:0;padding:10px 14px 11px;border:1px solid color-mix(in srgb,var(--k-rp) 60%,var(--rule));border-left:3px solid var(--k-rp);border-radius:4px 10px 10px 4px;background:var(--sheet);min-width:0}
.rp figcaption{font:600 10.5px/1.35 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 92px 6px 0}
.rp-b{display:grid;gap:1px}
.rp-l{display:grid;grid-template-columns:50px minmax(0,1fr);gap:0 8px;align-items:baseline}
.rp-k{font:500 12.5px/1.6 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.rp-t{font:500 16px/1.45 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.rp-rp .rp-k{color:var(--hema);font-weight:600}
.rp-rp .rp-t{font-weight:600}
.rp-s .rp-t{font:400 14.5px/1.45 var(--f-body);color:var(--ink-2)}
.rp-n{margin:6px 0 0;font-size:12px;color:var(--eosin)}
.rp mark{background:var(--hl-y);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.rp-c{position:absolute;top:7px;right:8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;font-size:11.5px;line-height:1.3;padding:3px 8px;cursor:pointer;color:var(--ink-2)}
.rp-c:hover{border-color:var(--hema);color:var(--hema)}
.rp-c:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.rp:not(:has(figcaption)) .rp-b{padding-right:84px}
.kc .rp{margin-top:12px}
.kc-rpx{margin-top:10px;border:1px solid var(--rule);border-radius:9px;padding:0 10px}
.kc-rpx > summary{cursor:pointer;padding:7px 0;font-size:13px;font-weight:600;color:var(--hema)}
.kc-rpx[open] > summary{margin-bottom:6px}
.kc-rpx .rp-list{padding-bottom:10px}
.u-rps .rp-list{margin-top:6px}

/* ---------- учебная таблица «для выписывания» ---------- */
.rxt{--rxc:minmax(150px,1fr) minmax(0,1.15fr) minmax(0,1.9fr) 74px;margin:26px 0;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.rxt.rxt-i{--rxc:minmax(140px,.9fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.6fr) 74px}
.rxt.rxt-nd{--rxc:minmax(150px,1fr) minmax(0,2fr) 74px}
.rxt-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px}
.rxt-tt{min-width:0;flex:1 1 280px}
.rxt-sub{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.rxt-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:0 18px 12px;border-bottom:1px solid var(--rule)}
.rxt-hd{display:grid;grid-template-columns:var(--rxc);gap:14px;padding:9px 18px;background:var(--paper);border-bottom:1px solid var(--rule);font:600 10.5px/1.3 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.rxr{display:grid;grid-template-columns:var(--rxc);gap:6px 14px;padding:12px 18px;border-bottom:1px solid var(--rule-2);align-items:start;font-size:14px}
.rxr:last-child{border-bottom:0}
.rxr.mk{background:color-mix(in srgb,var(--hl-y) 28%,var(--sheet))}
.rxr-n{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.rxr-n .tlink,.rxr-n > b{font-weight:600;font-size:15px;line-height:1.3;color:var(--ink);text-decoration-color:var(--hema)}
.rxr.mk .rxr-n .tlink,.rxr.mk .rxr-n > b{background:var(--hl-y);color:var(--hl-ink);padding:0 4px;border-radius:4px;margin-left:-4px}
.rxr-n i{font-family:var(--f-display);font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.rxr-n small{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.rxr-c{min-width:0}
.rxr-lab{display:none}
.rxr-v{color:var(--ink-2);overflow-wrap:anywhere;line-height:1.45}
.rxr-d .rxr-v{color:var(--ink)}
.rxr-a{display:flex;justify-content:flex-end}
.rxr-rb{border:1.5px solid var(--k-rp);background:var(--sheet);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12.5px/1.3 var(--f-mono);cursor:pointer;white-space:nowrap}
.rxr-rb:hover{background:color-mix(in srgb,var(--k-rp) 25%,var(--sheet))}
.rxr-rb[aria-expanded="true"]{background:var(--k-rp);color:var(--hl-ink)}
.rxr-rb:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.rxr-rps{grid-column:1 / -1;padding:4px 0 2px}
.rxt[data-f="y"] .rxr:not(.mk){display:none}
@media (max-width:760px){
  .rxt-hd{display:none}
  .rxr,.rxt.rxt-i .rxr,.rxt.rxt-nd .rxr{grid-template-columns:minmax(0,1fr) auto;padding:12px 16px}
  .rxr-n{grid-column:1;grid-row:1}
  .rxr-a{grid-column:2;grid-row:1}
  .rxr-c{grid-column:1 / -1}
  .rxr-lab{display:block;font:600 10.5px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
  .rxt-h,.rxt-bar{padding-left:16px;padding-right:16px}
}
/* таблицы: «Проверить себя» */
.rx-head.tq-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.tq-b{border:1px solid var(--hema);background:var(--sheet);color:var(--hema);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.tq-b[aria-pressed="true"]{background:var(--hema);color:var(--sheet)}
.tq-b:focus-visible{outline:2px solid var(--hema);outline-offset:2px}

/* ---------- самопроверка: закрытые ответы ---------- */
.tblw.tq td:not(:first-child):not(.rev),
.rxt.h-f .rxr-f .rxr-v:not(.rev),.rxt.h-d .rxr-d .rxr-v:not(.rev),
.kv-t .tdl > li:not(.rev),.kv-t .tblw td:not(:first-child):not(.rev),.kv-t .rxr-v:not(.rev),
.kv-t .kc :is(.kc-l,.kc-kl,.kc-fm,.rp,.kc-dose):not(.rev),
.kv-t .kcol > ol:not(.tdl) > li:not(.rev),.kv-t .kcol > ul > li:not(.rev){position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.tblw.tq td:not(:first-child):not(.rev)::after,
.rxt.h-f .rxr-f .rxr-v:not(.rev)::after,.rxt.h-d .rxr-d .rxr-v:not(.rev)::after,
.kv-t .tdl > li:not(.rev)::after,.kv-t .tblw td:not(:first-child):not(.rev)::after,.kv-t .rxr-v:not(.rev)::after,
.kv-t .kc :is(.kc-l,.kc-kl,.kc-fm,.rp,.kc-dose):not(.rev)::after,
.kv-t .kcol > ol:not(.tdl) > li:not(.rev)::after,.kv-t .kcol > ul > li:not(.rev)::after{content:"";position:absolute;inset:0;background:var(--mask);border-radius:6px;transition:opacity .15s}
.tblw.tq td:not(:first-child):not(.rev)::after,.kv-t .tblw td:not(:first-child):not(.rev)::after{inset:5px 6px}
.kv-t .kc :is(.kc-l,.kc-kl,.kc-fm,.rp,.kc-dose):not(.rev)::after{content:"нажмите, чтобы открыть";display:flex;align-items:center;justify-content:center;font:500 12px var(--f-body);color:var(--ink-3);min-height:28px}
.kv-t .kc :is(.kc-l,.kc-kl,.kc-fm,.rp,.kc-dose):not(.rev){min-height:30px}
.kv-t .tdl > li:not(.rev):hover::after,.tblw.tq td:not(.rev):hover::after,.rxt .rxr-v:not(.rev):hover::after,.kv-t :is(.rxr-v,td,li,.kc-l,.kc-kl,.kc-fm,.rp,.kc-dose):not(.rev):hover::after{opacity:.75}
.rev{animation:revealx .3s ease-out}
@keyframes revealx{from{background:color-mix(in srgb,var(--hl-g) 60%,transparent)}}
/* «Схемы и таблицы»: без сплошного текста */
.kv-s .kblk:is([data-t="p"],[data-t="list"],[data-t="warn"],[data-t="src"],[data-t="fx"]){display:none}

/* ---------- навигатор конспекта ---------- */
.kb-t{font-weight:500}
.kbar > .kb-b:not(.kb-sec){flex:none}
.kbar > .kb-sec{flex:1 1 0;min-width:0}
.kb-run{border-color:var(--hema);color:var(--hema);font-weight:600}

.kpop-toc,.kpop-s,.kpop-d{width:min(600px,calc(100vw - 32px))}
.kpop-v,.kpop-r{width:min(460px,calc(100vw - 32px));padding:12px 14px}
.kp-h{margin:4px 0 6px;font:600 10.5px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kp-note{margin:8px 0 4px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.kt-part{padding:6px 4px 8px}
.kt-part + .kt-part{border-top:1px solid var(--rule-2)}
.kt-ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px}

.kt-f{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.kt-f:hover{border-color:var(--hema);color:var(--hema)}
.kt-l{list-style:none;margin:0;padding:0}
.kt-s{display:flex;align-items:center;gap:8px}
.kpop .kt-sb{flex:1;min-width:0;display:flex;gap:10px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.kpop .kt-sb::before{content:none}
.kt-n{font:600 12px/1.6 var(--f-mono);color:var(--ink-3);min-width:18px}
.kt-c{font:500 11.5px var(--f-mono);color:var(--hema);background:var(--hema-soft);border-radius:999px;padding:1px 7px;white-space:nowrap}
.kt-b{list-style:none;margin:0 0 4px;padding:0 0 0 36px}
.kpop .kt-b button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:6px;font-size:13.5px;line-height:1.35;cursor:pointer;color:var(--ink-2)}
.kpop .kt-b button::before{content:none}
.kt-b i,.ks-i i{font:500 10.5px/1.5 var(--f-mono);font-style:normal;color:var(--iodine);white-space:nowrap;flex:none;min-width:84px}
.kpop .kt-sb:hover,.kpop .kt-b button:hover,.kpop .kt-sb:focus-visible,.kpop .kt-b button:focus-visible{background:var(--hema-soft);outline:none}
.kpop li{counter-increment:none}
.ks-g{padding:4px 4px 8px}
.ks-g + .ks-g{border-top:1px solid var(--rule-2);padding-top:8px}
.ks-g .kp-h{padding:0 6px}
.ks-i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--ink)}
.ks-i b{font-weight:600;font-size:14px;line-height:1.35}
.ks-i small{grid-column:2;font-size:12px;color:var(--ink-3)}
.ks-i:hover,.ks-i:focus-visible{background:var(--hema-soft);outline:none}
.kp-g{padding:6px 2px 8px}
.kp-g + .kp-g{border-top:1px solid var(--rule-2)}
.kp-gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 8px 4px}
.kp-l .kp-gh b{font:600 12.5px/1.35 var(--f-mono);color:var(--hema)}
.kp-l .kp-run{border:1px solid var(--hema);background:var(--sheet);color:var(--hema);border-radius:999px;padding:2px 9px;font:500 12px var(--f-mono);cursor:pointer;white-space:nowrap}
.kp-l .kp-run:hover{background:var(--hema);color:var(--sheet)}
.kp-gl{display:flex;flex-wrap:wrap;gap:2px 4px;padding:0 4px}
.kp-l .kp-gl button{display:inline-flex;width:auto;padding:4px 6px;border-radius:6px}
.kv-seg{margin-bottom:2px}
.kv-parts{display:flex;flex-wrap:wrap;gap:4px}
.kv-parts button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.kv-parts button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.kr-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:9px 2px;border-bottom:1px solid var(--rule-2)}
.kr-row > span:first-child{display:flex;flex-direction:column;min-width:0}
.kr-row b{font-size:14.5px}
.kr-row small{font-size:12.5px;color:var(--ink-3)}
.kr-a{display:flex;flex-wrap:wrap;gap:6px}
.kr-a .btn{padding:6px 11px}
.kr-l{display:inline-block;margin-top:10px;font-size:13.5px}
.kfocus{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;padding:10px 14px;border-radius:10px;border:1px dashed var(--hema);background:var(--hema-soft);font-size:14px;color:var(--ink-2)}
.kf-r{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.kf-r b{color:var(--ink)}
.kf-a{display:flex;flex-wrap:wrap;gap:6px}
.kfocus .btn{background:var(--sheet);padding:6px 11px}
.ksec[hidden]{display:none!important}
.kblk[id]{scroll-margin-top:72px}
@media (max-width:640px){
  .kbar{flex-wrap:wrap;row-gap:6px}
  .kbar > .kb-sec{flex:1 1 calc(100% - 52px);order:0;max-width:none}
  .kbar > .kb-up{order:1}
  .kbar > .kb-b:not(.kb-sec):not(.kb-up){order:2;flex:1 1 auto;justify-content:center;padding:6px 6px;font-size:13px}
  .kb-b[data-pop="view"] .kb-ar{display:none}
  .kbar .kpop{top:calc(100% + 4px);max-height:calc(100vh - 220px)}
  .kfocus{top:152px}
}
/* ---------- полоса «прогнать раздел» и итог занятия ---------- */
.krun{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:30px 0 10px;padding:12px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--hema) 35%,var(--rule));background:linear-gradient(100deg,var(--hema-soft),var(--sheet) 70%)}
.krun-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 240px}
.krun-t b{font-size:14.5px;color:var(--ink)}
.krun-t span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.krun-a{display:flex;flex-wrap:wrap;gap:6px}
.kfin{margin:56px 0 0;padding:22px 22px 24px;border-radius:14px;border:1.5px solid var(--hema);background:var(--sheet)}
.kfin h2{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3.2vw,30px);line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.kfin-s{margin:0;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.kfin-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- окно прогона ---------- */
html.run-open{overflow:hidden}
.run{position:fixed;inset:0;z-index:55}
.run-scrim{position:absolute;inset:0;background:#0b0e1c8c}
.run-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 32px));max-height:min(880px,calc(100% - 40px));min-height:min(600px,calc(100% - 40px));display:flex;flex-direction:column;background:var(--paper);border-radius:16px;box-shadow:0 30px 80px -30px #0b0e1ccc,0 0 0 1px var(--rule);outline:none;overflow:hidden}
.run-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.run-tt{flex:1 1 200px;min-width:0}
.run-tt h2{font:600 20px/1.2 var(--f-display);margin:2px 0 0;overflow-wrap:anywhere}
.run-m button{padding:5px 10px}
.run-body{flex:1;overflow-y:auto;padding:16px 18px 20px;overscroll-behavior:contain}
.run-body.l-main{max-width:none;min-height:0}
.run .lc-f,.run .lc-b{min-height:240px}
@media (max-width:640px){
  .run-panel{left:0;top:0;transform:none;width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .run-top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .run-m{order:3;width:100%}
  .run-body{padding:14px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
}

/* ---------- карточки: 4 оценки, ввод ответа ---------- */
.l-rate4{grid-template-columns:repeat(4,minmax(0,1fr))}
.l-rate2{grid-template-columns:repeat(2,minmax(0,1fr))}
.l-rate button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.l-rate button small{font:500 11.5px var(--f-mono);opacity:.8}
.l-rate button kbd{margin:3px 0 0}
.l-rate .r1{color:var(--eosin);border-color:var(--eosin)} .l-rate .r1:hover{background:var(--eosin-soft)}
.l-rate .r2{color:var(--iodine);border-color:var(--iodine)} .l-rate .r2:hover{background:var(--iodine-soft)}
.l-rate .r3{color:var(--hema);border-color:var(--hema)} .l-rate .r3:hover{background:var(--hema-soft)}
.l-rate .r4{color:var(--ok);border-color:var(--ok)} .l-rate .r4:hover{background:color-mix(in srgb,var(--ok) 14%,var(--sheet))}
.l-rate .sug{box-shadow:inset 0 0 0 2px currentColor}
.lc-type{display:flex;gap:6px;width:min(420px,100%);margin:10px 0 2px}
.lc-type input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.lc-type input:focus{outline:2px solid var(--hema);outline-offset:0;border-color:transparent}
.lc-res{margin:0 0 10px;padding:7px 11px;border-radius:8px;font-size:14px}
.lc-res.ok{background:color-mix(in srgb,var(--ok) 16%,var(--sheet));color:var(--ink)} .lc-res.ok b{color:var(--ok)}
.lc-res.no{background:var(--eosin-soft);color:var(--ink)} .lc-res.no b{color:var(--eosin)}
.l-undo{border:0;background:none;padding:0 0 0 8px;font:inherit;color:var(--hema);text-decoration:underline;cursor:pointer}
.l-sess{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin:0 0 10px}
.l-sess p{margin:0;font-size:14px;color:var(--ink-2)}
.l-set2{font-size:13.5px}
.l-set2 > summary{cursor:pointer;color:var(--hema);font-weight:600}
.l-set2[open]{width:100%}
.l-set2-b{display:grid;gap:10px;margin-top:10px;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.l-set2-b > div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.l-set2-b > div > span{min-width:110px;color:var(--ink-2)}
.l-chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2);line-height:1.4}
.l-chk input{margin-top:3px;accent-color:var(--hema)}
.l-stats{grid-template-columns:repeat(5,minmax(0,auto))}
.l-goal.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--sheet))}
.l-goal b small{font-size:15px;color:var(--ink-3);font-weight:500}
.lb-rp .rp-list{margin-top:4px}
.l-qq{font-size:18px;line-height:1.45;margin:0 0 14px}
.l-qq .rp{margin-top:10px;font-size:15px}
@media (max-width:640px){
  .l-stats{display:flex;flex-wrap:wrap}
  .l-stats > div{flex:1 1 calc(33% - 8px);min-width:0;padding:8px 10px}
  .l-rate4 button{padding:10px 2px}
  .l-rate4 button span{font-size:13px}
}

/* ---------- вкладка «Прогон» ---------- */
.lr-p{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.lr-p button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 11px;font:600 13px var(--f-display);cursor:pointer;color:var(--ink)}
.lr-p button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.lr-card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.lr-card h2{font:600 24px/1.15 var(--f-display);margin:4px 0 4px;text-wrap:balance}
.lr-card h3{font:600 17px/1.2 var(--f-body);margin:0 0 4px;display:inline}
.lr-st{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.lr-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:10px 0;border-top:1px solid var(--rule-2)}
.lr-t{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.lr-t b{font-size:15px;line-height:1.3}
.lr-t b i{font:500 12px var(--f-mono);font-style:normal;color:var(--ink-3);margin-right:4px}
.lr-t small{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.lr-a{display:flex;flex-wrap:wrap;gap:6px}
.lr-a .btn{padding:6px 11px}
.lr-main{border-top:0}
.lr-g > summary{cursor:pointer;list-style:none;padding:2px 0 6px}
.lr-g > summary::-webkit-details-marker{display:none}
.lr-g > summary::before{content:"▸ ";color:var(--hema)}
.lr-g[open] > summary::before{content:"▾ "}

/* ---------- вкладка «Рецепты» ---------- */
.lrp-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.lrp-top p{margin:0;font-size:14px;color:var(--ink-2);flex:1 1 260px}
.lrp-a{display:flex;flex-wrap:wrap;gap:8px}
.lrp-a input{font:inherit;font-size:14.5px;padding:8px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:0;width:200px}
.lrp-sec{margin-top:16px}
.lrp-sec h3{font:600 18px/1.25 var(--f-display);margin:0 0 6px}
.lrp-sec h3 .roman{color:var(--hema);margin-right:4px}
.lrp-it{border-top:1px solid var(--rule-2)}
.lrp-it > summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:9px 2px;list-style:none}
.lrp-it > summary::-webkit-details-marker{display:none}
.lrp-it > summary b{font-weight:600;font-size:15px;padding:0 3px;border-radius:4px}
.lrp-it > summary small{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.lrp-it[open] > summary{padding-bottom:6px}
.lrp-it .rp-list{padding:0 0 12px}

/* прогноз */
.l-fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px;margin-top:8px}
.l-fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.l-fc b{font:500 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.l-fc span{display:block;width:100%;max-width:38px;height:var(--h);min-height:2px;border-radius:4px 4px 1px 1px;background:var(--hema)}
.l-fc div:first-child span{background:var(--eosin)}
.l-fc small{font-size:11.5px;color:var(--ink-3)}

/* ---------- главная: «Сегодня» ---------- */
.today{margin:24px 0 8px;padding:18px 20px 14px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);box-shadow:0 18px 40px -34px var(--hema)}
.td-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.td-top > div:first-child{min-width:0}
.today h2{font:600 clamp(22px,3vw,29px)/1.15 var(--f-display);margin:4px 0 0;text-wrap:balance}
.td-st{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.td-st b{font:600 18px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.td-st span:first-child b{color:var(--eosin)}
.td-ring{position:relative;flex:none;width:64px;height:64px;display:grid;place-items:center;align-content:center;text-align:center}
.td-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--rule-2);stroke-width:5}
.tr-fg{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.td-ring b{position:relative;font:600 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.td-ring small{position:relative;font-size:10.5px;color:var(--ink-3)}
.td-a{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.td-lh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-top:14px}
.td-leg{font-size:12px;color:var(--ink-3)}
.td-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:0}
.td-leg .k,.td-lb .k{background:var(--hema)} .td-leg .l,.td-lb .l{background:color-mix(in srgb,var(--hema) 35%,var(--rule-2))}
.td-ll{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));column-gap:24px}
.td-l{display:grid;grid-template-columns:minmax(0,1fr) 72px 38px auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--rule-2);font-size:14px}
.td-lt{display:flex;gap:8px;align-items:baseline;min-width:0;text-decoration:none;color:var(--ink-2)}
.td-lt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-lt:hover span:last-child{color:var(--hema);text-decoration:underline}
.td-lt .roman{flex:none;min-width:38px;font:600 13.5px var(--f-display);color:var(--hema)}
.td-lb{display:flex;height:7px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.td-lb i{display:block;height:100%}
.td-ln{font:500 12px var(--f-mono);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.td-run{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.td-run:hover{border-color:var(--hema);color:var(--hema)}
.td-run:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
@media (max-width:520px){
  .td-l{grid-template-columns:minmax(0,1fr) 34px auto}
  .td-lb{grid-column:1 / -1;grid-row:2}
  .today{padding:16px 16px 12px}
}
@media (prefers-reduced-motion:reduce){.rev{animation:none}.tr-fg{transition:none}}
.kp-note + .kp-h{margin-top:12px}
.kfocus{position:sticky;top:54px;z-index:11;box-shadow:0 10px 20px -18px #0b0e1c80}
@media (max-width:920px){.kfocus{top:110px}}

/* ===== тренажёры, сравнение, поиск, шпаргалки, план ===== */

header .eyebrow a{color:inherit}
.tr-hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;margin-top:22px}
.tr-tile{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.tr-tile:hover{border-color:var(--hema);transform:translateY(-1px)}

.tr-tile small{margin-top:auto;padding-top:6px;font:500 12px/1.4 var(--f-mono);color:var(--hema)}
.tr-mix{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--hema-soft)}

.tr-f,.fd-f,.cm-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px;position:relative}
.tr-q{flex:1 1 260px;min-width:0}
.tr-q input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink)}
.tr-q input:focus{outline:2px solid var(--hema);outline-offset:1px;border-color:var(--hema)}
.tr-none{font-size:14px;color:var(--ink-3);margin:10px 0}

/* ===== польза и вред по органам ===== */

.fx-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--rule-2);gap:2px}

.fx-grid{display:grid;grid-template-columns:168px minmax(0,1fr);gap:16px;align-items:start}

.fx-hs:focus-visible .fx-halo{stroke:var(--hema)}
.fx-bg{fill:var(--sheet);stroke:var(--rule);stroke-width:1}

.fx-hs text{font:700 10px var(--f-body);fill:var(--ink);text-anchor:middle;pointer-events:none}
.fx-n0 .fx-bg{stroke:var(--ink-3);stroke-dasharray:2 2}
.fx-list{min-width:0}
.fx-r{border-top:1px solid var(--rule-2);padding:9px 6px 10px;border-radius:8px;transition:background .25s}

.fx-ct i.b{color:var(--fxb);background:color-mix(in srgb,var(--fxb) 13%,transparent)}

KP.push({"id":"k-gen","roman":"ОФ","mod":"kon","lec":"Лекция","title":"Общая фармакология","sum":"Фармакодинамика (рецепторы, доза-эффект, агонисты и антагонисты, мишени) и фармакокинетика (F, Vd, Kel, T½, клиренс, Css) — формулировки и формулы лекции","lead":"Лекарственное вещество (ЛВ) — соединение определённой химической структуры, которое при введении в организм в определённой дозе предупреждает, устраняет или уменьшает проявления заболевания.","src":"лекция «Общая фармакология» (Word, 10 стр.); схемы перерисованы, формулировки сохранены","rel":["pk","pd"],"blocks":[{"t":"cols","title":"Фармакокинетика и фармакодинамика","min":260,"cols":[{"h":"Фармакокинетика","s":"Что организм делает с лекарством?","u":1,"items":["Всасывание → транспорт → распределение → биотрансформация → выделение","как организмом всасывается препарат?","как препарат транспортируется?","как и где распределяется?","как биотрансформируется?","как выводится организмом?"]},{"h":"Фармакодинамика","s":"Что лекарство делает с организмом?","u":1,"items":["Фармакологические эффекты, их механизм (зависит от уровня действия препарата)","Обоснование эффективного и безопасного применения"]}]},{"t":"h","text":"Фармакодинамика: зависимость эффекта от дозы"},{"t":"list","items":["В подавляющем большинстве случаев лекарство действует на специфические структуры — лекарственные рецепторы (рецепторная теория)","\u003cb>Мишень\u003c/b> — биологический субстрат (рецептор, транспортер, ионный канал, фермент, цитокин), с которым связывается ЛВ","\u003cb>Сайт связывания\u003c/b> — определённые участки молекулярного рельефа мишени, с которым связывается лиганд (ЛВ), если применимо к данной мишени","\u003cb>Внутренняя активность\u003c/b> — способность ЛВ при взаимодействии с мишенью вызывать эффект","\u003cb>Терапевтический эффект\u003c/b> — целевое состояние организма при назначении ЛВ","Лекарственные рецепторы — это не специфические рецепторы конкретно к определённому ЛВ, это любые рецепторы нашего организма","Биохимические рецепторы ≠ анатомические рецепторы"]},{"t":"flow","title":"Пример: нитроглицерин как противоангинальное ЛВ","rows":[{"s":["нитроглицерин — донатор NO","рецепторы сосудистой стенки вен","вазодилатация","↓ гемодинамическая нагрузка сердца"]}]},{"t":"graph","title":"Кривая доза-эффект: «терапевтическое окно»","w":760,"mw":560,"nodes":[["let",380,40,"летальная","n",300],["tox",380,90,"токсическая","n",300],["max",490,140,"Максимальная терапевтическая концентрация","t",260],["ther",380,200,"Терапевтическая: минимальная, средняя, максимальная — «терапевтическое окно»","g",300],["min",490,260,"Минимальная терапевтическая концентрация","t",260],["thr",380,310,"пороговая","",300],["ax",380,370,"Доза (логарифмическая шкала) →","t",300]],"edges":[["thr","ther",">"],["ther","tox",">"],["tox","let",">"]],"cap":"Эффект = ответ — количественный выход реакции взаимодействия клетки, органа, системы или организма в целом с ЛВ. При увеличении дозы сначала достигается порог эффекта, затем терапевтические дозы и токсические (вплоть до летальной) — рассматривается диапазон концентрации препарата в ПЛАЗМЕ. Зависимость доза-эффект — логарифмическая!"},{"t":"list","items":["В зависимости от дозы лекарства могут меняться скорость развития эффекта, его продолжительность, выраженность, а иногда и характер действия","\u003cb>Дозы:\u003c/b> разовые, суточные, курсовые; начальные («нагрузочные») и поддерживающие","Эффект лекарства обеспечивается достижением/поддержанием целевой терапевтической концентрации как при однократном, так и при курсовом назначении — т.е. мы должны попасть в «терапевтическое окно» (при этом оно может быть «узким» => опасное ЛВ, сложно подобрать дозу, т.к. легко создаётся токсическая концентрация => картина отравления, в т.ч. возможный летальный исход)","Соотношение токсической и терапевтической концентраций/доз характеризует безопасность лекарства (\u003cb>терапевтический индекс\u003c/b>)","Для расчёта концентрации следует знать объём, в котором распределится введённая доза: Vd — «объём распределения» (volume of distribution)"]},{"t":"cols","title":"Активность (потентность) и эффективность лекарственного вещества","min":260,"cols":[{"h":"Активность (молярная активность, потентность)","u":1,"items":["мера чувствительности к ЛВ по оси концентрации => характеристика аффинности ЛВ => какая доза ЛВ способна вызвать развитие стандартного эффекта, равного 50% от максимально возможного эффекта","чем выше активность, тем меньше требуется доза для терапевтического эффекта","\u003cb>Среднеэффективная доза (ED50)\u003c/b> — проекция в точке 50%: в этой дозе препарат даст эффект у половины пациентов; при других измерениях — половину данного эффекта","Пример: один анестетик даёт эффект 10 мг/доза, другой 100 мг/доза"]},{"h":"Эффективность","u":1,"items":["мера реакции по оси эффекта — величина отклика биологической системы на фармакологическое воздействие","способность ЛВ оказывать максимально возможное для него действие (Emax)","Лекарство А активнее, чем лекарство Б, но максимальная эффективность А и Б одинакова","Лекарство В — менее активно и менее эффективно, чем А и Б"]}]},{"t":"h","text":"Взаимодействие лекарственного вещества и рецептора"},{"t":"fx","items":[{"f":"Л + Р ⇌ ЛР","d":"лекарство, рецептор, лекарственно-рецепторный комплекс"},{"f":"ЛР = Pобщ × C / (C + Kд)","d":"Pобщ — общее количество рецепторов; Kд — константа диссоциации; EC50 — концентрация, при которой связаны 50% рецепторов. Кривая — гиперболическая => при небольшом изменении дозы сильно увеличивается связывание с рецептором. Чем выше Kд, тем меньше степень сродства ЛВ к мишени (= ниже аффинитет)"},{"f":"Л + Р ⇌ ЛР → Р*","d":"активированный рецептор"},{"f":"Э = αЛР;  Эмакс = αPобщ","d":"Э — фармакологический эффект, α — внутренняя активность (полный агонист α = 1, парциальный агонист α ≈ 0,7, антагонист α = 0)"}]},{"t":"list","items":["\u003cb>Аффинитет\u003c/b> — степень сродства ЛВ к мишени","\u003cb>Внутренняя активность\u003c/b> — способность ЛВ при взаимодействии с мишенью вызвать эффект","\u003cb>Механизм действия ЛВ\u003c/b> — совокупность биологических процессов, обеспечивающих реализацию терапевтического эффекта ЛВ на молекулярном, клеточном, органном и системном уровнях","\u003ci>Пример:\u003c/i> нитроглицерин — антиангинальное средство, его механизм действия — «гемодинамическая разгрузка сердца» за счёт вазодилатирующего действия на вены и венулы — с помощью NO"]},{"t":"cols","title":"Типы лекарств — рецепторных лигандов","min":180,"cols":[{"h":"Полный агонист","u":1,"items":["активирует все рецепторы"]},{"h":"Парциальный (частичный) агонист","u":1,"items":["связывание идёт полностью, но препарат не может активировать все рецепторы / слабая активация => меньший эффект (ответ)"]},{"h":"Антагонист","u":1,"items":["связывается с рецепторами, но не имеет внутренней активности"]},{"h":"Обратный (инверсный) агонист","u":1,"items":["некоторые рецепторные молекулы могут быть в 2-х конформациях (подобно маятнику): в одной конформации вещество может отклонять эффект в одну сторону, в другой — действует по-другому (эффект, свойственный инверсному агонисту)","\u003ci>Пример:\u003c/i> в мозге есть рецепторы — тревожность. С ними взаимодействуют противотревожные препараты; они могут работать как антагонисты (анксиолитическое действие), а есть те же препараты, но в «конформации 2» — стали анксиогенными"]}]},{"t":"p","html":"\u003cb>Биоэквивалентность\u003c/b> — фармакокинетическая эквивалентность => взаимозаменяемость лекарств. Отражает степень подобия фармацевтически эквивалентного ЛВ по отношению к оригинальному (референтному) препарату — определяется экспериментально, in vivo (на рисунке: оригинальное лекарственное средство (бренд) и воспроизведённое (генерик) с разной скоростью всасывания — «в этом примере не биоэквивалентны»)."},{"t":"h","text":"Виды действия: основные мишени"},{"t":"cols","title":"Основные мишени","min":150,"cols":[{"h":"Специфические рецепторы","u":1,"items":["белковые молекулы, которые могут быть мембранными, цитоплазматическими, ядерными","ЛВ, взаимодействующие с рецепторами, обладают определённым аффинитетом = сродством к ним"]},{"h":"Гены","u":1,"items":[]},{"h":"Транспортные системы","u":1,"items":["Антипорт — транспорт веществ в разных направлениях","Симпорт — транспорт нескольких веществ в одном направлении","Унипорт — транспорт одного вещества в одном направлении"]},{"h":"Ферменты","u":1,"items":["Препарат взаимодействует с активным центром фермента (каталитический сайт ± сайт связывания) или с его аллостерическим центром"]},{"h":"Ионные каналы","u":1,"items":["Потенциал-зависимые каналы или рецептор-зависимые"]}]},{"t":"table","title":"Варианты реализации эффекта при взаимодействии ЛВ с разными типами рецепторов","head":["Тип рецептора","Механизм","Время","Пример"],"rows":[["1. Лиганд-зависимые ионные каналы (ионотропные)","Ионы → гиперполяризация или деполяризация → клеточные эффекты","Миллисекунды","Никотиновый ACh-рецептор"],["2. Рецепторы, сопряжённые с G-белком (метаботропные)","G-белок → изменение возбудимости, ↑Ca²⁺, вторичные посредники → фосфорилирование белков → клеточные эффекты","Секунды","Мускариновый ACh-рецептор"],["3. Киназа-связанные рецепторы","Фосфорилирование белков → транскрипция генов → синтез белка → клеточные эффекты","Часы","Рецепторы цитокинов"],["4. Ядерные рецепторы","Ядро → транскрипция генов → синтез белка → клеточные эффекты","Часы","Рецептор эстрогенов"]]},{"t":"list","title":"Рецепторы мембран: трансмембранные сигнальные механизмы","ord":true,"items":["Липофильная сигнальная молекула проникает через плазматическую мембрану и действует на внутриклеточный рецептор (энзим или транскрипционный фактор)","Сигнальная молекула связывается с внеклеточным доменом трансмембранного рецептора и активирует энзиматические функции цитоплазматического домена","Сигнальная молекула связывается с внеклеточным доменом трансмембранного рецептора и активирует энзиматические функции цитоплазматического домена, связанного с протеинкиназой, которую он активирует","Сигнальная молекула непосредственно регулирует проницаемость ионного канала","Сигнальная молекула связывается с рецептором, который соединён с эффекторным энзимом посредством G-белка"]},{"t":"h","text":"Эффекты повторного и совместного введения лекарственных средств"},{"t":"tree","title":"Особенности действия лекарств при повторном применении","n":"Повторное применение","k":[{"n":"Нарастание эффекта: кумуляция","c":"a","l":["нарастание специфического фармакологического действия при повторных введениях одного и того же ЛВ"],"k":[{"n":"Материальная кумуляция","l":["за счёт нарастания концентрации в крови при медленном метаболизме и выведении ЛВ"]},{"n":"Функциональная кумуляция","l":["ЛВ вызвало эффект => повторное применение ЛВ, нет нарастания концентрации ЛВ => усиление эффекта"]}]},{"n":"Сенсибилизация","c":"b","l":["аллергические реакции (гиперчувствительность)"]},{"n":"Снижение специфического эффекта","c":"c","l":["понижение чувствительности к лекарству"],"k":[{"n":"Тахифилаксия","l":["истощение субстрата, необходимого для реализации эффекта"]},{"n":"Привыкание или толерантность"}]},{"n":"Лекарственная зависимость","c":"a","l":["при применении ЛВ, действующих на ЦНС и вызывающих чувство эйфории","отмена препарата => абстинентный синдром","характерно для опиоидных анальгетиков, снотворных, транквилизаторов"],"k":[{"n":"Психическая зависимость","l":["отмена препарата вызывает эмоциональный дискомфорт, желание принять препарат становится самоцелью"]},{"n":"Физическая зависимость","l":["психические изменения + нарушение функций организма (осложнения)"]}]}]},{"t":"list","title":"Особенности действия лекарств при комбинировании","items":["У каждого рецептора может быть несколько разных сайтов действия: ортостерический (агонист, антагонист) и аллостерические","Аллостерический активатор будет улучшать связывание агониста/антагониста с сайтом","Аллостерический антагонист полностью может подавлять действие агониста/антагониста","+ Физико-химическое взаимодействие (например, поглощение ЛВ сорбентами)","+ Химические реакции между лекарственными препаратами (образование нерастворимых комплексов и т.д.)"]},{"t":"h","text":"Фармакокинетика"},{"t":"table","title":"Вопросы и параметры фармакокинетики","head":["Вопрос","Параметр ФК","Обозначение"],"rows":[["С какой дозы начать лечение?","Целевая терапевтическая концентрация в плазме","Cпл тер"],["","Объём распределения","Vd (volume of distribution)"],["","Начальная («нагрузочная») доза","LD (loading dose)"],["","Биодоступность","F (fraction)"],["Когда дать следующую дозу лекарства? Какова кратность введения?","Константа элиминации","Kel"],["","Период полуэлиминации","T50"],["Какова поддерживающая доза?","Клиренс","Cl (clearance)"],["","Скорость элиминации","RE (rate of elimination)"],["","Поддерживающая доза","MD (maintaining dose)"]]},{"t":"cols","title":"Пути введения: энтеральные — через ЖКТ","min":240,"cols":[{"h":"Общее","u":1,"items":["удобно, не требует стерильности, не нужен персонал","при этом время действия медленное"]},{"h":"Пероральный приём","u":1,"items":["проходит через агрессивные среды (пищеварительные соки — необходимы защитные оболочки)","то, что всасывается через ЖКТ в кровь, проходит систему воротной вены печени => ЛВ подвергается трансформации в ней, может связываться и «обезвреживаться» — фармакологический эффект ослаблен"]},{"h":"Сублингвальный приём","u":1,"items":["быстрое всасывание (слизистая оболочка в этой области обильно васкуляризирована + есть слюна, растворяющая субстрат => жидкая форма)"]}]},{"t":"list","title":"Фармакокинетическая кривая при введении в/м, перорально","items":["\u003cb>Площадь под кривой — ППК (AUC)\u003c/b> — мг·ч/л","\u003cb>Cmax\u003c/b> — максимальная концентрация ЛВ в крови","\u003cb>tmax\u003c/b> — момент достижения максимальной концентрации ЛВ в крови","ППК слева от tmax — процесс абсорбции; ППК справа от tmax — процесс экскреции","При введении в/в — Cmax в момент введения, затем экспоненциальное снижение"]},{"t":"fx","items":[{"f":"F = AUC(данный путь) / AUC(в/в) × 100%","d":"\u003cb>Биодоступность\u003c/b> — сколько неизменённого ЛВ попало в кровоток из общего числа вещества, то есть доля неизменённого ЛВ от назначенной дозы, определяемая в системном кровотоке. F = 0,8 при приёме внутрь означает, что в кровоток попадает 80% от введённой дозы"},{"f":"Vd = D / Cпл","d":"\u003cb>Объём распределения\u003c/b> — отношение общего количества ЛВ в организме к его плазменной концентрации; условная расчётная величина. Пример: доза 100 мг, концентрация в плазме 1 мг/л → Vd = 100 л"},{"f":"LD = Vd × Cпл цел","d":"\u003cb>Нагрузочная доза\u003c/b>: Vd используют для расчёта начальной дозы"},{"f":"Ct = C0 × e^(−Kel·t)","d":"\u003cb>Константа скорости элиминации (Kel)\u003c/b> — доля лекарства, которая выводится (элиминируется) из организма в единицу времени всеми путями, включая метаболизм и экскрецию. Пример: Kel = 0,05/мин означает, что за 1 мин элиминируется 5% введённого вещества"},{"f":"Kel = 0,693 / T½   или   T½ = 0,693 / Kel","d":"\u003cb>Период полувыведения\u003c/b> (T½, T50) — время, требуемое для снижения концентрации вещества в плазме на 50%"},{"f":"Cl = Vd × Kel;   Cl_T = Cl_почк + Cl_печ + Cl_др","d":"\u003cb>Клиренс\u003c/b> — объём плазмы крови, «очищенный» от ЛВ в единицу времени (мл/мин, л/ч). Выведение через печень, почки, для некоторых лекарств — лёгкие, кожа, ЖКТ; индекс T — тотальный клиренс через все органы выведения"},{"f":"RE = Cl × Cпл","d":"\u003cb>Скорость элиминации\u003c/b>"},{"f":"Скорость поступления = Cl × Css = MD","d":"\u003cb>Поддерживающая доза\u003c/b>: для поддержания равновесной стационарной концентрации препарата (Css) скорость поступления должна быть равна скорости выведения"}]},{"t":"list","title":"Объём распределения: как читать","items":["Организм на 60% состоит из воды => в 70 кг примерно 42 л воды","Vd = 42 л — лекарство распределилось равномерно по всему организму","Vd = 5 л — лекарство не вышло из циркуляции (за пределы объёма крови); например, низким распределением должны обладать плазмозамещающие или противошоковые лекарства","Высокие значения: Vd = 600 л — лекарство в каком-то депо (например, жировом) — неравномерное распределение; например, йодсодержащее ЛВ — в щитовидную железу","Если лекарство малотоксичное — можно дать сразу большую дозу; в большинстве случаев больному дают лекарство постепенно для достижения терапевтической дозы"]},{"t":"cols","title":"Кинетика выведения и накопления","min":240,"cols":[{"h":"После прекращения приёма","items":["После курсового лечения прекратили приём препарата => закончилась лекарственная нагрузка","Через 1 период полувыведения выведется половина введённой дозы и т.д.: 1,0 → 0,5 → 0,25 → 0,125 → 0,0625","Очищение происходит примерно через 4–5 периодов полувыведения (менее 10% от равновесной концентрации)","После однократного приёма и после прекращения курсового приёма лекарства время его выведения из организма зависит от T50"]},{"h":"При повторном приёме (Css в %)","items":["1-й T½ — 50","2-й — 75 (50 + 25)","3-й — 87,5 (50 + 25 + 12,5)","4-й — 93,7 (50 + 25 + 12,5 + 6,25)","5-й — 96,9 (50 + 25 + 12,5 + 6,25 + 3,125)","При повторном приёме лекарства время достижения Css зависит от T50"]},{"h":"Равновесная концентрация","u":1,"items":["Css устанавливается в плазме крови в условиях, когда количество попадающего в кровь ЛВ равно количеству выводимого","При курсовой терапии равновесная концентрация в плазме (Cпл ss) является целевой терапевтической концентрацией","При равновесной концентрации в плазме скорость поступления = скорость выведения","\u003cb>Скорость выведения = Cl × Cпл ss = Скорость поступления = Поддерживающая доза\u003c/b>"]}]},{"t":"p","html":"Подробные интерактивные схемы — на листах \u003ca href=\"#pk\">I «Фармакокинетика»\u003c/a> (кривая концентрации при повторном введении с регуляторами T½, τ и F) и \u003ca href=\"#pd\">II «Фармакодинамика»\u003c/a>."}]});

KP.push({"id":"k-aff","roman":"Л1","mod":"kon","lec":"Лекция 1","title":"Вещества, влияющие на афферентную иннервацию","sum":"Местные анестетики, вяжущие, обволакивающие, адсорбирующие и раздражающие средства — схемы и формулировки конспекта","lead":"Средства, влияющие на афферентную (центростремительную) часть рефлекторной дуги: угнетающие и стимулирующие.","src":"конспект «Вещества, влияющие на афферентную иннервацию» (23 стр.); схемы перерисованы, формулировки сохранены","rel":["la"],"blocks":[{"t":"list","title":"Сокращения конспекта","items":["СО — слизистая оболочка; ЦПМ — цитоплазматическая мембрана; ч/з — через; пр-е — производное","ПАБК — парааминобензойная кислота; МА — местные анестетики; R — рецептор","кл — классификация; пок — показания; п.э — побочные эффекты; ЗКР — заключительная контрольная работа","Для всех препаратов из таблицы в конце УМП написать рецепт; после рецепта — три пункта: классификация, показания, побочные эффекты","«Возможные формулировки» — так препараты могут быть описаны на микроконтрольных и в ЗКР (а могут и по-другому)"]},{"t":"h","text":"Средства, влияющие на афферентную часть рефлекторной дуги"},{"t":"cols","title":"Средства, влияющие на афферентную часть рефлекторной дуги","n":"Средства, влияющие на афферентную часть рефлекторной дуги","min":260,"cols":[{"h":"Угнетающие","u":1,"items":["средства, подавляющие возбудимость рецепторов и нервных проводников — \u003cb>местные анестетики\u003c/b>","средства, создающие механическую защиту рецепторов — \u003cb>обволакивающие\u003c/b>, \u003cb>адсорбирующие\u003c/b>, \u003cb>вяжущие\u003c/b>"]},{"h":"Стимулирующие","u":1,"items":["средства, вызывающие возбуждение рецепторов — \u003cb>раздражающие средства\u003c/b>"]}]},{"t":"table","title":"Средства, действующие на чувствительные окончания афферентных нервов","head":["Раздел","Вещества угнетающего действия","Вещества стимулирующего действия"],"rows":[["Определение","Лекарственные средства, влияющие на афферентную (центростремительную) часть рефлекторной дуги","—"],["Направленность действия","защищают окончания чувствительных нервов кожи и слизистых оболочек от действия раздражителей; препятствуют деполяризации мембран и возбуждению чувствительных окончаний афферентных нервов; уменьшают или блокируют проведение возбуждения по афферентным нервным волокнам в ЦНС, ограничивают патологические рефлексы","возбуждают окончания чувствительных нервов; вызывают деполяризацию мембран чувствительных нервных окончаний (местный раздражающий эффект); стимулируют афферентную импульсацию в ЦНС и рефлекторные реакции (улучшение кровоснабжения и трофики тканей, ослабление боли)"],["Классификация","Местные анестетики; обволакивающие; вяжущие; адсорбирующие; мягчительные средства; противокашлевые средства периферического действия*","Средства, раздражающие рецепторы кожи и слизистой оболочки; отхаркивающие средства*; горечи**; желчегонные средства**; слабительные средства**; рвотные средства рефлекторного действия**"]]},{"t":"h","text":"Местные анестетики (МА)"},{"t":"p","html":"\u003cb>Местные анестетики\u003c/b> — это лекарственные средства, которые вызывают обратимую потерю всех видов чувствительности в ограниченной области тела."},{"t":"list","items":["механизм действия: блок потенциалзависимых (управляемых) Na-каналов => это препятствует возникновению и проведению потенциала действия (ПД)","действуют \u003cu>не\u003c/u> избирательно на любые Na-каналы (NaV1-1 — NaV1-10)","исключение: плохо действуют на каналы NaV1-9 (а их много в очагах воспаления)","исходная форма МА — основание, плохо растворимое в воде","добавление HCl переводит анестетик в форму растворимой в воде соли","диссоциирует и становятся катионами: MA·HCl → MA⁺ + Cl⁻","в кислой среде слабее диссоциация → менее активны","в кислой среде больше заряженных форм, а через (ч/з) мембраны клеток проникают только незаряженные формы"]},{"t":"graph","title":"Проникновение местных анестетиков к рецептору","w":760,"mw":620,"zones":[[14,30,282,300,"Снаружи · ткань",
