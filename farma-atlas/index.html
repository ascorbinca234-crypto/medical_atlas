ация задерживается)."},{"t":"graph","title":"Схема натриевого канала в клетках нервного волокна (рис. 6.1)","w":760,"mw":620,"zones":[[14,8,732,128,"Без анестетика","cell"],[14,160,732,170,"В присутствии местного анестетика","cell2","br"]],"nodes":[["A",130,72,"A · Закрытый Na⁺-канал (покой)\nm-ворота закрыты, h-ворота открыты","",226],["B",380,72,"B · Открытый Na⁺-канал\nm- и h-ворота открыты → вход Na⁺","",210],["C",630,72,"C · Закрытый Na⁺-канал (инактивация)\nh-ворота закрыты","",210],["D",130,226,"D · Закрытый Na⁺-канал (покой)","",210],["E",380,226,"E · Открытый Na⁺-канал: МА входит в пору и связывается с рецептором","g",210],["F",630,226,"F · Закрытый Na⁺-канал (инактивация), МА на рецепторе","g",210],["ma",380,300,"Местный анестетик","d"]],"edges":[["A","B",">"],["B","C",">"],["D","E",">"],["E","F",">"],["ma","E",">"]],"cap":"Рецептор местного анестетика расположен внутри поры канала со стороны аксоплазмы; доступ к нему открывается, когда канал открыт."},{"t":"list","title":"Требования к анестетикам","ord":true,"items":["Высокая избирательность действия","Короткий латентный период","Высокая эффективность при разных видах анестезии","Должны \u003cu>не\u003c/u> расширять сосуды (а лучше суживать) => используются в комбинации с эпинефрином (усиливает анестезию, уменьшает кровотечение, задерживает всасывание анестетика за счёт активации α-адренорецепторов)","Низкая токсичность","Минимальные побочные эффекты","Должны хорошо растворяться в воде"]},{"t":"cols","title":"Эффекты МА зависят от","min":170,"cols":[{"h":"1. Типа нервного волокна","u":1,"items":["толстое","тонкое (выключаются легче) — боль проводится тонкими волокнами"]},{"h":"2. Наличия миелиновой оболочки","u":1,"items":["миелинизированные","немиелинизированные (выключаются легче)"]},{"h":"3. Частоты проведения нервных импульсов (НИ)","u":1,"items":[]},{"h":"4. Типа рецепторов","u":1,"items":["защищённые","«голые»"]}]},{"t":"list","title":"Дифференциальная чувствительность (блокада) нервных волокон и окончаний","items":["\u003cb>Последовательность выключения:\u003c/b> боль, холод, тепло, давление, моторные функции","Диффузия внутрь толстых миелинизированных волокон затруднена, и моторные волокна расположены в глубине нерва","Физиологические отличия проведения в тонких немиелинизированных и толстых миелинизированных волокнах (скачкообразное и непрерывное проведение, разный «гарантийный фактор», постоянная длины)","В сенсорных волокнах по сравнению с моторными больше продолжительность потенциала действия (до 5 мсек и менее 0,5 мсек соответственно) и выше частота импульсов","При терминальной анестезии играет роль строение нервных окончаний («оголённые» ноцицепторы, «защищённые» рецепторы специфических видов чувствительности — колбы Краузе, тельца Фатер-Пачини)"]},{"t":"flow","title":"Зачем МА комбинируют с вазоконстрикторами","rows":[{"s":["У МА нет избирательности","действуют на все рецепторы (R)","надо сделать так, чтобы МА остался там, где его ввели","необходимо уменьшить попадание МА в кровь — резорбтивный эффект","для этого нужно сузить сосуды","используются комбинации МА с вазоконстрикторами"]}]},{"t":"h","text":"Классификация МА"},{"t":"cols","title":"Классификация МА","n":"Классификация МА","min":260,"cols":[{"h":"По применению","s":"для разных видов местной анестезии","items":["\u003cb>Поверхностная = терминальная = аппликационная\u003c/b> — наносится на поверхность слизистой оболочки (СО), на раневую/язвенную поверхность; используются кремы, мази, растворы, аэрозоли, гели. Тетракаин, Бензокаин — используются \u003cu>только\u003c/u> для терминальной анестезии","\u003cb>Инфильтрационная = послойная\u003c/b> — послойное пропитывание тканей раствором анестетика; МА действует на нервные окончания и проводники","\u003cb>Регионарная = проводниковая\u003c/b> — введение анестетика в ткань, окружающую нервные стволы и сплетения: плексусная — блокада нервных сплетений; стволовая — блокада нервного ствола; паравертебральная — блокада нервных узлов"]},{"h":"По химической структуре","items":["Эфиры","Амиды"],"s":"см. схему ниже"}],"foot":["Нейроаксиальная анестезия: эпидуральная анестезия — анестетик действует на корешки при выходе из dura mater"]},{"t":"list","title":"Классификация по применению (УМП)","ord":true,"items":["\u003ci>Средства, применяемые только для поверхностной анестезии:\u003c/i> тетракаин (дикаин), бензокаин (анестезин)","\u003ci>Средства, применяемые преимущественно для инфильтрационной и проводниковой анестезии:\u003c/i> прокаин (новокаин), артикаин (ультракаин), бупивакаин (маркаин), мепивакаин (скандинибса), ропивакаин (наропин), оксибупрокаин (инокаин)","\u003ci>Средства, применяемые для всех видов анестезии:\u003c/i> лидокаин (ксикаин) разной концентрации"]},{"t":"warn","title":"Уточнение к списку","text":"Оксибупрокаин (инокаин) применяют для поверхностной анестезии в офтальмологии — так сказано и в самом конспекте («применяются в офтальмологии»). В группу инфильтрационной и проводниковой анестезии он попал из скана пособия."},{"t":"cols","title":"По химической структуре: эфиры и амиды","min":280,"cols":[{"h":"Эфиры","s":"ароматическая часть — эфирная связь (COO) — аминогруппа","items":["Эфир (ароматическое кольцо) — \u003cb>липофильность\u003c/b> => растворимы в жирах => проникают через ЦПМ","COO — \u003cb>устойчивость к расщеплению\u003c/b> => расщепляются эстеразами => действуют коротко","Аминогруппа — \u003cb>гидрофильность\u003c/b> => взаимодействие с рецептором"]},{"h":"Амиды","s":"ароматическая часть — промежуточная группа (NH–CO) — аминогруппа","u":1,"items":["действуют более длительно","разрушаются в печени цитохромом P450"]}]},{"t":"tree","title":"Местные анестетики","n":"Местные анестетики","k":[{"n":"Сложные эфиры аминобензойных кислот","c":"a","d":["Прокаин|y","Тетракаин","Бензокаин|g","Оксибупрокаин","Проксиметакаин"],"l":["оксибупрокаин и проксиметакаин имеют утяжелённую липофильную группу","применяются в офтальмологии"]},{"n":"Замещённые амиды кислот","c":"b","k":[{"n":"Амиды уксусной и пропионовой кислот","d":["Лидокаин|y","Тримекаин","Прилокаин"],"l":["лидокаин и тримекаин — пр-е уксусной кислоты"]},{"n":"Амиды пиперидинкарбоновых кислот","d":["Мепивакаин","Ропивакаин","Бупивакаин|g","Левобупивакаин"]},{"n":"Амиды хинолинкарбоновой кислоты","d":["Цинхокаин"]},{"n":"Пр-е тиофенкарбоновой кислоты","d":["Артикаин|g"]},{"n":"Местные анестетики в сочетании с эпинефрином","d":["Артикаин + Эпинефрин","Бупивакаин + Эпинефрин","Мепивакаин + Эпинефрин"],"l":["Эпинефрин ч/з активацию α-адренорецепторов суживает сосуды => реабсорбция МА в кровь идёт медленнее => препарат действует лучше"]}]}]},{"t":"table","title":"Местные анестетики: эфирные и амидные соединения","head":["Раздел","Эфирные соединения","Амидные соединения"],"rows":[["Особенности фармакокинетики","Очень быстро гидролизуются в крови псевдохолинэстеразой (бутирилхолинэстеразой). Прокаин (новокаин): T½ \u003c 1 мин. Длительность действия — 30 мин. В процессе гидролиза прокаин превращается в ПАБК → конкурентный антагонизм с СА препаратами (ПАБК — фактор роста ряда микроорганизмов; СА — конкурентные антагонисты ПАБК)","Медленнее гидролизуются микросомальными ферментами печени, эстеразами крови и тканевых жидкостей. Бупивакаин: T½ = 1,5–5 ч. Длительность действия от 3–4 до 7–14 ч. При поражениях печени T½ увеличивается (лидокаин: T½ увеличивается с 1,8 ч до 6 ч). Ингибиторы микросомальных ферментов печени (пропранолол, метопролол, пиндолол, тимолол) увеличивают T½ МА"]]},{"t":"table","title":"Побочные эффекты местных анестетиков","head":["Эффект","Механизм и проявления"],"rows":[["\u003cb>Местные:\u003c/b> тахифилаксия","Частое повторное введение растворов гидрохлоридов МА понижает pH тканей → ацидоз, повышение содержания ионизированных (заряженных) катионных форм МА → уменьшение проникновения МА в аксон"],["\u003cb>Местные:\u003c/b> раздражение тканей","Вызывает ЭДТА (добавляют к растворам МА для защиты от инактивации ионами Al или Pb, содержащимися в стекле флаконов и ампул) → токсическое действие на ткань нерва"],["\u003cb>Местные:\u003c/b> аллергические реакции","Вызывают сульфиты (добавляют к растворам МА, содержащим эпинефрин (адреналин), для защиты вазоконстрикторов от инактивации кислородом) и парабены (метилпарабен добавляют к растворам МА для защиты от бактерий, грибов и от окисления)"],["\u003cb>Системные:\u003c/b> влияние на ССС","МА вызывают снижение возбудимости, проводимости, сократимости миокарда (блокада Na⁺-каналов проводящей системы, сократительного миокарда и вегетативных ганглиев). Снижение АД (блокада Na⁺-каналов гладкой мускулатуры сосудов и симпатических ганглиев). \u003cb>Кокаин\u003c/b> повышает АД и вызывает сердечные аритмии (симпатомиметическое действие)"],["\u003cb>Системные:\u003c/b> влияние на ЦНС","МА вызывают судороги, так как подавляют активность тормозных нейронов. \u003cb>Кокаин\u003c/b> уменьшает обратный нейрональный захват катехоламинов → эйфория, галлюцинации, повышение работоспособности, психомоторное возбуждение приводят к развитию психической зависимости и толерантности. В высоких дозах: спутанность сознания, психоз, рвота, учащение дыхания, нистагм, тремор, судороги. Паралич ДЦ"],["\u003cb>Системные:\u003c/b> анафилаксия","Особенно эфирные соединения (прокаин), метаболизируются до производных ПАБК → высокая аллергизирующая активность"]]},{"t":"h","text":"Препараты: местные анестетики"},{"t":"cards","items":[{"n":"Прокаин","al":["Новокаин"],"hl":"y","f":["производное парааминобензойной кислоты (ПАБК)","низкая липофильность => плохо всасывается ч/з СО","умеренная анестезирующая активность","при введении в кровь оказывает общее влияние на организм: уменьшает образование ацетилхолина; понижает чувствительность периферических холинорецепторов; оказывает блокирующее влияние на вегетативные ганглии; уменьшает спазмы гладкой мускулатуры; понижает возбудимость мышцы сердца и моторных зон коры ГМ","\u003cb>ПАБК:\u003c/b> метаболиты ПАБК часто вызывают аллергические реакции; является аналогом витамина В10 (нужен для нормального развития микрофлоры); сходна по строению с частью молекулы сульфаниламидов => вступают в конкурентные отношения => прокаин как производное ПАБК снижает эффективность сульфаниламидных антимикробных средств"],"rp":"Rp.: Sol. Procaini \u003cmark>0,5% - 5 ml\u003c/mark>\n     D.t.d. N 10 in amp.\n     S. Содержимым ампулы последовательно пропитывать\n     ткани в анестезируемой области","kl":"местный анестетик, эфир аминобензойной кислоты","pok":["инфильтрационная, проводниковая, эпидуральная анестезия","вагосимпатическая блокада","болевой синдром","геморрой","тошнота"],"pe":["аллергические реакции","головокружение","слабость"],"fm":["Производное ПАБК для МА при тяжёлых травмах","Анестетик производное ПАБК для инфильтрационной анестезии"]},{"n":"Бензокаин","al":["Анестезин"],"hl":"g","f":["короткого действия (15–20 минут)","только терминальная анестезия","в составе молекулы нет аминогруппы => не гидрофилен, не растворим => используется только в форме порошков, мазей, суппозиториев, паст","может работать в желудке, т.к. pK = 3"],"rp":"Rp.: Ung. Benzocaini 20% - 28,4\n     D.S. Наносить на поражённую область 3 раза в\n     сутки по 1 горошине мази","kl":"местный анестетик, эфир аминобензойной кислоты","pok":["терминальная анестезия","гастралгия","зудящие дерматиты","эзофагит","невралгии"],"pe":["запор (если применяется в rectum — т.к. перистальтика — это рефлекс, начинающийся с раздражения рецепторов, а МА блокирует возникновение НИ => нет запуска рефлекса => нет перистальтики => запор)","гиперемия","реакции гиперчувствительности"],"fm":["МА для терминальной анестезии","Средство анестезии при трещинах прямой кишки"]},{"n":"Бупивакаин","al":["Маркаин"],"hl":"g","f":["длительное действие — до 7–14 часов","токсичен","активный","высокое сродство к белкам крови","связывается с простагландиновыми E2 рецепторами, тормозит продукцию PG (простагландинов) => уменьшает лихорадку, воспаление, устраняет гипералгезию","не используется в акушерской практике из-за частых случаев развития остановки сердца и дыхания пациенток"],"rp":"Rp.: Sol. Bupivacaini 0,5% - 5 ml\n     D.t.d. N 5 in amp.\n     S. Ввести 5 мл при эпидуральной анестезии между L2 и L3","kl":"местный анестетик, амид пиперидинкарбоновой кислоты","pok":["инфильтрационная, эпидуральная, каудальная анестезия","ретробульбарная блокада","блокада периферических нервов"],"pe":["беспокойство, тремор, судороги, паралич дыхательных мышц, задержка мочеиспускания","угнетение сердечной деятельности — гипотензия, брадикардия вплоть до остановки сердца, аритмии"],"fm":["МА для спинномозговой анестезии длительностью до 7 часов"]},{"n":"Артикаин","al":["Ультракаин"],"hl":"g","f":["быстрое и относительно длительное местноанестезирующее действие при инфильтрационной, проводниковой, спинномозговой и люмбальной анестезии","вызывает слабую поверхностную анестезию","по химической структуре является и эфиром (эфир тиофенкарбоновой кислоты и метанола), и амидом (амид пропионовой кислоты)"],"rp":"Rp.: Sol. Articaini 4% - 2 ml\n     D.t.d. N 10 in amp.\n     S. Ввести в десну по 4 мл на зуб при анестезии","kl":"местный анестетик, амид тиофенкарбоновой кислоты","pok":["инфильтрационная, проводниковая анестезия","обработка кариозных полостей"],"pe":["головная боль","головокружение","нарушение сознания","мышечный тремор","снижение АД"],"fm":["МА из группы амидов (производное тиофена)","Аналог лидокаина, амид, применяемый в стоматологии"]},{"n":"Лидокаин","hl":"y","f":["действует быстрее, сильнее и продолжительнее (примерно в 2 раза) новокаина","есть ещё выраженные антиаритмические свойства","на 90% метаболизируется в печени с образованием фармакологически активных метаболитов","для всех видов местной анестезии","при быстром внутривенном введении может произойти резкое снижение АД и развиться коллапс (помощь: фенилэфрин)"],"rp":"Rp.: Sol. Lidocaini 2% - 2 ml\n     D.t.d. N 10 in amp.\n     S. Последовательно пропитывать 2 мл мягкие\n     ткани при инфильтрационной анестезии","kl":"местный анестетик, амид уксусной кислоты","pok":["аппендэктомия","грыжесечение","проводниковая анестезия в стоматологии","блокада нервных сплетений","терминальная анестезия СО в урологии","бронхоскопия"],"pe":["нервозность","мелькание мушек перед глазами","шум в ушах","диплопия, тремор, судороги"],"fm":["При отравлении дигоксином (показание для антиаритмика)","Препарат, применяемый для анестезии гортани при интубационном наркозе","Местный анестетик для всех видов анестезии"]}]},{"t":"table","idx":true,"title":"NB! Сравнительная характеристика местных анестетиков — это обязательно нужно знать","head":["Препарат","Способность проникать через мембраны","Активность (усреднённая)","Токсичность","Продолжительность действия"],"rows":[["Бензокаин","Плохая","0,5","0,5","—"],["Прокаин","Плохая","1","1","Короткая"],["Тримекаин","Средняя","2","1,5","Средняя"],["Лидокаин","Средняя","4","2","Средняя"],["Мепивакаин","Средняя","4","2","Средняя"],["Артикаин","Хорошая","5","1,5","Короткая"],["Тетракаин","Хорошая","8","10","Средняя"],["Бупивакаин","Хорошая","8–16","7–10","Длительная"],["Ропивакаин","Хорошая","8–16","7","Длительная"]],"note":"Активность и токсичность — относительно прокаина (= 1)."},{"t":"h","text":"Вяжущие, обволакивающие, адсорбирующие и мягчительные средства"},{"t":"cols","title":"Сравнительная таблица (УМП)","min":220,"cols":[{"h":"Вяжущие средства","u":1,"items":["\u003cb>Препараты.\u003c/b> Неорганические: \u003ci>препараты Bi\u003c/i> — висмута субнитрат основной («викаир», «викалин»), висмута трикалия дицитрат («де-нол»); \u003ci>препараты Pb\u003c/i> — ацетат свинца; \u003ci>препараты Al\u003c/i> — «алмагель», сукральфат (вентер). Органические: танин; настои, отвары — лист шалфея, цветки ромашки, трава зверобоя, плоды черники, календула, корневища змеевика и лапчатки, кора дуба, корневище с корнями кровохлёбки","\u003cb>Механизм.\u003c/b> Коагулируют белки поверхностного слоя клеток кожи и слизистых оболочек с образованием плотной альбуминатной плёнки, которая защищает от раздражений ЧНО. Катион вытесняет водород из S–H-гр. — изменение структуры белка (глобулярная форма белка переходит в фибриллярную). Сдавление плотным альбуминатом поверхностных сосудов. Соли тяжёлых металлов в низких дозах блокируют S–H-гр. ферментов бактерий — цитостатическое действие, в высоких дозах прижигающее действие","\u003cb>Эффекты.\u003c/b> Обезболивающее, противовоспалительное, ранозаживляющее, антибактериальное, кровоостанавливающее действие, антидотное действие (танин связывает алкалоиды и соли тяжёлых металлов), уменьшение всасывания отравляющих веществ","\u003cb>Применение\u003c/b> (общее с обволакивающими). При воспалении кожи (дерматит) и слизистых оболочек (гингивит, стоматит, тонзиллит, ларингит, фарингит, гастрит, энтерит, колит), при ожогах, эрозиях, язвах. Метеоризм, диспепсия. Слизи вместе с раздражающими веществами. При острых отравлениях"]},{"h":"Обволакивающие средства","u":1,"items":["\u003cb>Препараты.\u003c/b> Слизь крахмала, слизь семян льна, слизистые отвары (овсяный, рисовый), настой корня алтея, алюминия гидроокись","\u003cb>Механизм.\u003c/b> Покрывают ткань коллоидной плёнкой, защищающей ЧНО от действия раздражающего агента. Уменьшают всасывание токсинов","\u003cb>Эффекты.\u003c/b> Обезболивающее, противовоспалительное, противопоносное действие"]},{"h":"Адсорбирующие средства","u":1,"items":["\u003cb>Препараты.\u003c/b> Уголь активированный, смектит диоктаэдрический «Смекта», крахмал (пшеничный, картофельный, кукурузный), тальк, лигнин гидролизный, полифепан, целлюлоза микрокристаллическая","\u003cb>Механизм.\u003c/b> Мелко измельчённые дисперсные порошки активно сорбируют (поглощают) яды, химические агенты, токсины, газы, аллергены, алкалоиды, соли тяжёлых металлов","\u003cb>Эффекты.\u003c/b> Уменьшение всасывания ядов с поверхности кожи и слизистых оболочек ЖКТ","\u003cb>Применение.\u003c/b> При острых отравлениях, диспепсии, метеоризме"]},{"h":"Мягчительные средства","u":1,"items":["\u003cb>Препараты.\u003c/b> Жиры и жироподобные вещества: очищенное свиное сало, вазелин, ланолин, жидкий парафин, глицерин, воск, масло какао, подсолнечное, вазелиновое, оливковое, персиковое","\u003cb>Механизм.\u003c/b> Образуют защитную плёнку и защищают от раздражения нервные окончания повреждённых участков кожи и слизистых оболочек","\u003cb>Эффекты.\u003c/b> Смягчающее действие на ткани. Обезболивающее действие","\u003cb>Применение.\u003c/b> При опрелостях, трещинах, ожогах, воспалениях"]}]},{"t":"h","text":"Адсорбирующие средства"},{"t":"p","html":"\u003cb>Адсорбирующие средства\u003c/b> — тончайшие измельчённые нерастворимые индифферентные порошки с большой адсорбционной способностью, связывающие на своей поверхности различные вещества, уменьшая всасывание последних, механически защищая слизистую оболочку и находящиеся в ней окончания чувствительных нервов."},{"t":"list","items":["большая поверхностно-сорбционная активность","плохая растворимость в воде","на их поверхности адсорбируются ядовитые, токсичные, раздражающие вещества","покрывают тонким слоем поверхность кишечника и защищают от механического раздражения и повреждения","способствуют уменьшению всасывания токсинов в кишечнике и ускоренному их выведению с фекалиями","при длительном применении могут адсорбировать питательные вещества"]},{"t":"flow","title":"Почему адсорбенты вызывают запор","rows":[{"s":["в кишечнике постоянно образуются газы, которые вызывают рефлекс увеличения перистальтики","эти ЛС могут адсорбировать газы","уменьшение перистальтики","запор"]}]},{"t":"tree","title":"Адсорбирующие средства","n":"Адсорбирующие средства","k":[{"n":"Адсорбенты для внутреннего применения","s":"энтеросорбенты","c":"a","d":["Уголь активированный|y","Лигнин гидролизный","Кремния диоксид коллоидный","Повидон","Смектит диоктаэдрический|g"]},{"n":"Адсорбенты для наружного применения","c":"b","d":["Тальк"]},{"n":"Адсорбирующие средства в составе комбинированных препаратов","c":"c","d":["Лактулоза + Лигнин гидролизный","Уголь активированный + алюминия оксид"]}]},{"t":"cards","items":[{"n":"Уголь активированный","al":["Активированный уголь"],"hl":"y","rp":"Rp.: Tabl. Carbonis activati 250 mg N 20\n     D.S. Промыть желудок взвесью активированного угля,\n     затем принять внутрь 80 таблеток, запивая\n     кипячёной водой","kl":"энтеросорбент","pok":["отравление, диарея","диспепсия","метеоризм","пищевые токсикоинфекции"],"pe":["запор"],"fm":["Препарат при отравлении солями тяжёлых металлов","Адсорбент для лечения острых отравлений","Средство высокой адсорбирующей способности для лечения острых отравлений"]},{"n":"Смектит диоктаэдрический","al":["Смекта"],"hl":"g","f":["адсорбирующее вещество с обволакивающими и гастропротективными свойствами","образует поливалентные связи с гликопротеинами слизи, увеличивает продолжительность функционирования слизи","потенцирует защиту СО ЖКТ от действия соляной кислоты, желчных кислот, кишечных микроорганизмов и их токсинов"],"rp":"Rp.: Smectiti dioctaedrici 3,0\n     D.t.d. N 30\n     S. Принимать внутрь 3 раза в день между приёмами\n     пищи по 3 пакетика, растворяя содержимое каждого\n     пакетика в 1/2 стакана кипячёной воды","kl":"энтеросорбент; средство, ослабляющее моторику ЖКТ","pok":["диарея","боли при заболеваниях ЖКТ","язвенная болезнь желудка"],"pe":["запор"]}]},{"t":"h","text":"Обволакивающие средства"},{"t":"p","html":"\u003cb>Обволакивающие средства\u003c/b> — это вещества, образующие с водой коллоидные растворы и не обладающие раздражающими и токсическими свойствами."},{"t":"list","items":["мало используются","создают плёнку за счёт собственных свойств","образуют коллоидную плёнку","уменьшают всасывание токсинов","недостаток: основной компонент плёнки — вода, а вода растекается и испаряется => толщина плёнки уменьшается => защита хуже","используются ректально, особенно у детей, которым вводятся лекарства per rectum"]},{"t":"flow","title":"Используются ректально","rows":[{"h":"Плёнка","s":["плёнка уменьшает раздражение стенки кишки свечей","уменьшение рефлекса (а главный рефлекс в rectum — акт дефекации)","уменьшение дефекации","лекарства, введённые в прямую кишку, лучше действуют"]}]},{"t":"list","title":"Это делается, т.к.:","ord":true,"items":["дети не могут глотать таблетки","по скорости наступления эффекта приближается к внутривенному","нет первого прохода ч/з печень => нет обезвреживания"]},{"t":"cols","title":"Обволакивающие средства","min":240,"cols":[{"h":"Препараты","d":["Льна семена","Льна посевного семена","Крахмальная слизь"]},{"h":"Действие обволакивающих средств","items":["Обезболивающее","Противовоспалительное","Противопоносное"]}]},{"t":"p","html":"\u003ci>Из учебника.\u003c/i> Растворы обволакивающих веществ на поверхности тканей, воспалённых участках, язвах образуют защитное мягкое покрытие, предохраняющее ткани и находящиеся в них окончания чувствительных нервов от раздражения. Поэтому обволакивающие средства оказывают местное противовоспалительное и болеутоляющее действие. Они находят применение при воспалительных и язвенных поражениях слизистой оболочки желудка (гастрите, язвенной болезни) и кишечника (энтероколите). Защищая слизистую оболочку ЖКТ от раздражения пищеварительными соками и составными частями пищи, они оказывают противоязвенное и антидиарейное действие. Обволакивающие средства (крахмальную слизь) назначают совместно или непосредственно перед приёмом различных лекарственных препаратов, обладающих раздражающим свойством. Обволакивающие средства назначают часто и продолжительное время (2–3 недели) при отравлениях кислотами, щелочами и едкими жидкостями с целью покрытия воспалённой и изъязвлённой поверхности коллоидной плёнкой. Крахмал (\u003ci>Amylum\u003c/i>) в холодной воде нерастворим, в горячей образует коллоидный раствор (\u003ci>Mucilago Amyli\u003c/i>). В медицинской практике, кроме крахмальной слизи, используют слизь из семян льна посевного (\u003ci>Semen Lini\u003c/i>). Применяют внутрь в виде слизи из льняного семени (\u003ci>Mucilago seminis Lini\u003c/i>), которую готовят из 1 части цельного льняного семени и 30 частей горячей воды."},{"t":"h","text":"Вяжущие средства"},{"t":"list","items":["вызывают частичную денатурацию белков слизи или раневого экссудата с образованием альбуминатов","плёнка формируется из собственных белков организма","за счёт коагуляции белков"]},{"t":"cols","title":"Плёнка вяжущих","n":"Плёнка","min":200,"cols":[{"h":"Плотная","u":1,"items":["только она обладает всеми свойствами вяжущей","её образуют дубящие вещества","могут образовывать и неорганические вещества"]},{"h":"Рыхлая","u":1,"items":["хуже защищает","образуют неорганические вещества","особо не защищает => не используем"]},{"h":"Почему плёнка из собственных белков","items":["Хорошая плёнка будет там, где много белков => белков много в слизи => вяжущие работают над слизистыми","Образующаяся плёнка не изменяет структуру => хорошая защита"]}]},{"t":"tree","title":"Вяжущие средства","n":"Вяжущие средства","k":[{"n":"Органические","c":"a","l":["образуют плотную плёнку","ничем не отличаются друг от друга"],"d":["Танин","Дуба кора|g","Ольхи соплодия","Шалфея листья|g","Ромашки цветки","Зверобоя продырявленного трава","Календулы лекарственной цветки","Лапчатки прямостоячей корневища","Тысячелистника обыкновенного трава","Черёмухи плоды","Череды трёхраздельной трава"],"k":[{"n":"Органические вяжущие в составе комбинированных препаратов","d":["«Стоматофит»","Брусники листья + Зверобоя продырявленного трава + Череды трёхраздельной трава + Шиповника плоды","Шалфея лекарственного листьев экстракт + Шалфея лекарственного листьев масло"]}]},{"n":"Неорганические","c":"b","l":["образуют и плотную, и рыхлую плёнку","описаны в ряде Шмидеберга: катионы Ме делятся на 3 группы в зависимости от характера образуемой плёнки"],"k":[{"n":"Ряд Шмидеберга","l":["1. Bi, Al, Pb (их соли) — всегда плотная плёнка","2. Ag, Hg — всегда рыхлая плёнка","3. Fe, Cu, Zn — в зависимости от концентрации: в низких — плотная, в высоких — рыхлая"]},{"n":"Препараты","d":["Свинца ацетат","Цинка сульфат","Цинка оксид","Висмута субнитрат","Висмута субгаллат","Трибромфенолята висмута и висмута оксида комплекс","Висмута трикалия дицитрат|g"]}]}]},{"t":"list","title":"Местный противовоспалительный эффект вяжущих — за счёт того, что:","ord":true,"items":["образуется плёнка => уменьшается раздражение => уменьшается повреждение, а уменьшая повреждение, уменьшаем воспаление","воспаление — это включение определённых химических реакций, а для них нужны ферменты (белки) => денатурация белков => реакции не идут => воспаление уменьшается","под любой коркой заживление идёт быстрее","плёнка сдавливает => суживает сосуды в области воспаления => уменьшение проницаемости => уменьшение отёка","денатурация микробных белков => гибель"]},{"t":"cols","title":"Действие и применение вяжущих","min":220,"cols":[{"h":"Действие вяжущих","items":["Обезболивающее","Противовоспалительное","Ранозаживляющее","Кровоостанавливающее","Антидотное (танин связывает алкалоиды и соли тяжёлых Ме)"]},{"h":"Применение","u":1,"items":["при дерматите и воспалении СО","ожоги, эрозии, язвы","метеоризм, диспепсия","острые отравления"]},{"h":"Почему вяжущие уменьшают диарею","u":1,"items":["Диарея — очень активная перистальтика из-за ускоренного рефлекса, вызванного раздражением","Плёнка уменьшает раздражение => уменьшение диареи"]}]},{"t":"flow","title":"Танин — органическое вяжущее: антидотное действие","rows":[{"s":["образует труднодиссоциирующую соль с алкалоидами и солями фосфорам","применяется при отравлениях морфием и атропином","его соль не всасывается","если в организм поступает алкалоид, то, если принять танин, он образует нерастворимую соль","алкалоид не всасывается и выводится из кишечника"]}]},{"t":"warn","title":"Опечатка в конспекте","text":"«Солями фосфорам» — опечатка: танин осаждает алкалоиды и соли тяжёлых металлов (так и написано выше в конспекте, в списке действия вяжущих)."},{"t":"cards","items":[{"n":"«Стоматофит»","f":["комбинированный растительный препарат","основной компонент — ромашка"],"rp":"Rp.: Extr. «Stomatophyt» 120 ml\n     D.S. 7,5 мл препарата развести в 50 мл кипячёной\n     воды. Раствором полоскать полость рта 3 раза\n     в день после еды.","kl":"вяжущее средство органического происхождения","pok":["пародонтит","пародонтоз","воспалительный процесс"],"pe":["нарушение вкусового восприятия"],"fm":["Препарат для купирования воспаления СО","Противовоспалительное, вяжущее, септическое, растительного происхождения"]},{"n":"Висмута трикалия дицитрат","al":["Де-Нол"],"hl":"g","f":["антихеликобактерный препарат с гастропротективными свойствами","увеличивает синтез PG E2","местное бактерицидное действие на хеликобактер","способен растворяться в слизи => проникает под слой желудочной или дуоденальной слизи — где находится максимальное число хеликобактера"],"rp":"Rp.: Tabl. Bismuthi trikalii dicitratis 120 mg\n     D.t.d. N 112\n     S. Принимать внутрь по 1 таблетке 4 раза в сутки\n     за 30 минут до еды.","kl":"вяжущее средство неорганического происхождения","pok":["язвенная болезнь желудка","язва ДПК","функциональная диспепсия","диарея при синдроме раздражённого кишечника"],"pe":["окрашивание кала в чёрный цвет","при длительном приёме может всасываться, возникает висмутовая энцефалопатия"],"fm":["Вяжущее средство для лечения язвенной болезни","Неорганический вяжущий препарат","Гастропротектор для комбинированной терапии язвенной болезни","Гастропротектор для эрадикации хеликобактер пилори"]},{"n":"Дуба кора","hl":"g","rp":"Rp.: Pulv. corticis Quercus 2,0\n     D.t.d. N 25\n     S. Полоскать настоем полость рта в течение 15 минут\n     6 раз в сутки после еды. Содержимое 2 фильтр-пакетов\n     залить 100 мл кипятка и настаивать 15 минут.","kl":"вяжущее средство органического происхождения","pok":["воспалительные заболевания полости рта"],"pe":["нарушение вкусовой чувствительности"],"fm":["Органическое вяжущее средство для приготовления полосканий","Средство для приготовления настоя для местного применения при воспалении"]}]},{"t":"h","text":"Раздражающие средства"},{"t":"p","html":"\u003cb>Раздражающие средства\u003c/b> — возбуждают нервные окончания. \u003ci>Из учебника:\u003c/i> раздражающие средства прямо стимулируют окончания чувствительных нервов кожи и слизистых оболочек, в результате чего рефлекторно возникает терапевтический эффект в органах и тканях. При непосредственном возбуждении рецепторов кожи и слизистых оболочек возникают импульсы с рецепторов, которые поступают в ЦНС и вызывают реакцию со стороны органов, имеющих иннервацию, сопряжённую в ЦНС с участками, подвергшимися воздействию раздражающих средств. В результате их действия улучшается кровоснабжение органа, его трофика. Основные эффекты раздражающих средств используют для профилактики и лечения различных воспалительных процессов. \u003ci>Местное раздражение\u003c/i> проявляется болевыми ощущениями, гиперемией, отёком на месте нанесения препаратов. \u003ci>Рефлекторное действие\u003c/i> характеризуется тонизированием дыхательного и сосудодвигательного центров продолговатого мозга."},{"t":"tree","title":"Раздражающие средства","n":"Раздражающие средства","k":[{"n":"Синтетические","c":"a","d":["Муравьиная кислота","Аммиак"]},{"n":"Растительные","c":"b","d":["Горчица","Мяты перечной листья","Плоды перца стручкового","Эвкалипта прутовидного листья"]},{"n":"Раздражающие средства в составе комбинированных препаратов","c":"c","d":["Апизартрон|g","Капсикам|g"]}]},{"t":"h","text":"Аммиак"},{"t":"flow","title":"Аммиак","rows":[{"h":"1. Вдыхание резкого неприятного запаха","s":["остановка дыхания","гиперкапния","раздражение (возбуждение) нейронов ДЦ","рефлекторная стимуляция дыхания","вдох"]},{"h":"2. Прямое возбуждение ЦНС","s":["т.к. любой запах возбуждает"]}]},{"t":"p","html":"\u003ci>Из учебника.\u003c/i> \u003cb>Аммиака раствор 10%\u003c/b> (нашатырный спирт) при вдыхании раздражает окончания тройничного нерва в полости носа, афферентные импульсы достигают центра этого нерва, а затем переключаются на дыхательный центр. Раствор аммиака используют при обмороках (надо поднести вату, смоченную раствором аммиака, к носу больного; вдохнув пары аммиака, больной обычно приходит в сознание). При этом следует учитывать, что большие количества паров аммиака могут вызвать и нежелательные рефлексы, например резкое урежение сердечных сокращений, остановку дыхания."},{"t":"h","text":"Мята и горчица"},{"t":"flow","title":"Мята (Доктор Мом, Пиносол)","rows":[{"s":["мята вызывает чувство холода, т.к. действует на холодовые рецепторы","стимуляция центра терморегуляции — окружающая температура воспринимается низкой","терморегуляция — уменьшение теплоотдачи и увеличение теплопродукции","сужение сосудов","уменьшение отёка","дыхание свободное"]}]},{"t":"fx","items":[{"f":"C₁₀H₁₆O₉NS₂K + H₂O = C₃H₅NCS + C₆H₁₂O₆ + KHSO₄","d":"синигрин + вода = горчичное масло + виноградный сахар + кислый сернокислый калий"}]},{"t":"flow","title":"Горчица","rows":[{"s":["горчичники нагревают до 38 градусов в тёплой воде, чтобы активировать фермент мирозин","мирозин расщепляет действующее начало порошка семян горчицы — гликозид синигрин","освобождается активное раздражающее вещество — эфирное горчичное масло (аллилизотиоцианат)","эфирное горчичное масло раздражает рецепторы того места, куда оно нанесено","дегрануляция тучных клеток","выход гистамина","расширение сосудов"]},{"h":"и параллельно","s":["выход гистамина","увеличение чувствительности рецепторов","лучше чувствуется боль"]}]},{"t":"p","html":"\u003ci>Из учебника.\u003c/i> \u003cb>Нейрогуморальное влияние\u003c/b> обусловлено резорбтивными эффектами биологически активных веществ, образующихся в зоне раздражения кожи, а также воздействием на головной и спинной мозг потока восходящих афферентных импульсов. При этом изменяется обмен медиаторов головного мозга — освобождаются антиноцицептивные факторы (β-эндорфин, энкефалины), уменьшается выделение медиаторов боли (субстанции P, соматостатина, холецистокинина), возрастает секреция рилизинг-гормонов гипоталамуса, адренокортикотропного и тиреотропного гормонов гипофиза. К веществам этой группы относятся \u003ci>масло камфорное\u003c/i>, камфорный спирт (действующее вещество камфора), настойка перца стручкового и другие раздражающие вещества (масла гвоздичное и эвкалиптовое, ментол), входящие в состав «разогревающих» мазей и растираний (бальзам «Золотая звезда», Эфкамон, Меновазин, Никофлекс)."},{"t":"cols","title":"Раздражающие средства: классификация и препараты (УМП)","min":220,"cols":[{"h":"Препараты растительного происхождения","u":1,"items":["\u003cb>Мята перечная:\u003c/b> листья, масло, вода; \u003cb>левоментол:\u003c/b> таблетки «Валидол», «Пектуссин», мазь «Эвкамон», аэрозоль «Камфомен»","\u003cb>горчичники\u003c/b>","\u003cb>плоды стручкового перца:\u003c/b> мазь «Эспол», крем «Никофлекс», пластырь перцовый","\u003cb>масло терпентинное очищенное:\u003c/b> скипидар","\u003cb>эвкалипт:\u003c/b> листья, масло","\u003cb>камфора:\u003c/b> спирт 10%"]},{"h":"Препараты синтетического происхождения","u":1,"items":["\u003cb>«Финалгон»\u003c/b> — мазь","\u003cb>хлоробутанол\u003c/b> — спрей «Каметон»","\u003cb>аммиак\u003c/b> 10% раствор","\u003cb>метилсалицилат:\u003c/b> мази «Рекерволь», «Бом-Бенге» («Бен-Гей»), «Доктор Мом Инхайлер»"]},{"h":"Препараты, содержащие яды пчёл и змей","u":1,"items":["мази \u003cb>«Апизартрон»\u003c/b> (яд пчелы)","\u003cb>«Наятокс»\u003c/b> (яд кобры)","\u003cb>«Випросал В»\u003c/b> (яд гюрзы)"]}]},{"t":"list","title":"Механизм действия и основные эффекты раздражающих средств","items":["\u003cb>1. Местное действие.\u003c/b> Например, при смачивании тёплой водой горчичника фермент горчицы мирозин расщепляет гликозид горчицы синигрин с образованием горчичного эфирного масла, которое оказывает выраженное раздражающее действие. Боль, гиперемия, отёк (увеличение высвобождения гистамина, серотонина, брадикинина, простагландинов, которые, в свою очередь, раздражают нервные окончания и расширяют сосуды). Аксон-рефлекс: возбуждение от ЧНО кожи распространяется по афферентным волокнам к органам и по коллатералям, минуя ЦНС, поступает к сосудам кожи → гиперемия, в том числе прилегающей к области раздражения зоны","\u003cb>2. Рефлекторное действие. 2.1. Трофическое:\u003c/b> нервные импульсы от зон раздражения на коже поступают в задние рога нескольких сегментов спинного мозга, затем переключаются на боковые рога этих же сегментов к ядрам преганглионарных волокон СНС → повышается кровоснабжение органов и скелетных мышц, вовлечённых в патологический процесс, улучшается регенерация тканей, уменьшаются воспалительные проявления. Рефлекторное расширение коронарных артерий при раздражении холодовых рецепторов ротовой полости (валидол), расширение поверхностных сосудов глотки и гортани (ментол)","\u003cb>2.2. Обезболивающее — отвлекающее.\u003c/b> Механизм тот же. Подавление очага, поддерживающего патологический процесс (гипералгезия, напряжение мышц, спазм сосудов), взаимодействием в ЦНС потока афферентных импульсов с поверхности кожи и поражённых органов. Высвобождение эндорфинов, энкефалинов в ЦНС → уменьшение выделения медиаторов боли (SP, соматостатина, холецистокинина)","\u003cb>2.3. Тонизирующее:\u003c/b> рефлекторная стимуляция ДЦ и СДЦ при раздражении ЧНО тройничного нерва в полости носа (аммиак)","\u003cb>3. Нейрогуморальное действие.\u003c/b> Резорбтивное действие БАВ, образующихся в зоне раздражения кожи → поток афферентных импульсов из очага раздражения в ЦНС → высвобождение эндорфинов и энкефалинов → снижение восприятия боли, повышение высвобождения либеринов из гипоталамуса, АКТГ, ТТГ из гипофиза, увеличение секреции ГКС и трийодтиронина → противовоспалительный эффект","\u003cb>Применение.\u003c/b> Для разогрева мышц в спортивной медицине. Спортивные травмы. Боль в суставах и мышцах, невралгия, неврит, радикулит, ишиас, люмбаго, артрит, тендовагинит, миозит, травмы мышц и связок, нарушение периферического кровообращения, бронхит, пневмония, трахеит (скипидар, горчичники), фарингит и ларингит (ментол, «Каметон»), приступ стенокардии (валидол под язык), обмороки и нетяжёлое угнетение ДЦ (раствор аммиака ингаляционно)"]},{"t":"h","text":"Ориентировочный список препаратов для выписывания"},{"t":"table","idx":true,"title":"Препараты для выписывания (жёлтые строки выделены в конспекте)","head":["МНН","Торговое название","Форма выпуска","Способ применения и дозы"],"rows":[["Капсикам","Капсикам (Capsicam)","мазь для наружного применения; туба 50 г с аппликатором","Наружно, 1–3 г мази наносят при помощи аппликатора на область болезненного участка и слегка втирают в кожу 2–3 раза в день"],["\u003cmark>Активированный уголь\u003c/mark>\u003cbr>\u003ci>Carbo activatus\u003c/i>","—","\u003cmark>таблетки 250 мг №20; капсулы 250 мг №10\u003c/mark>","\u003cmark>Промывание желудка с использованием взвеси активированного угля, затем внутрь 20–30 г\u003c/mark>"],["Артикаин\u003cbr>\u003ci>Articainum\u003c/i>","Ультракаин Д (Ultracainum D)","раствор для инъекций 40 мг/мл; ампула 2 мл №10","Режим дозирования индивидуальный. Высшая разовая доза для взрослых составляет до 7 мг/кг"],["Апизартрон","Апизартрон (Apisarthron)","мазь для наружного применения 100 г","Полоску мази длиной 3–5 см равномерно распределить на коже (толщина слоя примерно 1 мм) до появления покраснения и ощущения тепла (2–3 мин). После этого медленно и интенсивно втереть мазь в кожу. Применять 2–3 раза в сутки"],["Артикаин + Эпинефрин\u003cbr>\u003ci>Articainum + Epinephrinum\u003c/i>","Ультракаин Д-С (Ultracain D-S)","раствор для инъекций 40 мг + 5 мкг/мл; картридж 1,7 мл №100","В дозе 1,7 мл (на каждый зуб)"],["Бензокаин\u003cbr>\u003ci>Benzocainum\u003c/i>","Релиф Адванс (Relief Advance)","мазь для ректального и наружного применения 20%; туба пластиковая 28,4 г / свечи ректальные 0,206 №12","Наружно, на область поражения до 4 раз в день / в прямую кишку по 1 свече до 4 раз в сутки (утром, на ночь и после каждого опорожнения кишечника)"],["Бензокаин + Прокаин + Левоментол","Меновазин","раствор для наружного применения фл. 40 мл","Наружно, наносят на кожу или растирают кожу над поражённым участком 2–3 раза в день"],["Бупивакаин\u003cbr>\u003ci>Bupivacainum\u003c/i>","Маркаин (Marcainum)","раствор для инъекций 5 мг/мл; ампулы 5; 10 мл №5; флакон 20 мл №5","Концентрация используемого раствора зависит от вида анестезии: инфильтрационная — 0,25%; проводниковая — 0,25–0,5% раствор, симпатическая блокада — 0,25%, эпидуральная люмбальная анестезия — 0,25–0,5%, каудальная — 0,25%–0,5%, количество — подбирается индивидуально"],["Висмута трикалия дицитрат\u003cbr>\u003ci>Bismuthi trikalii dicitras\u003c/i>","Де-Нол (De-Nol)","таблетки, покрытые оболочкой 120 мг №112","Внутрь, по 120 мг 4 раза в сутки за 30 мин до завтрака, обеда и ужина и перед сном или по 240 мг 2 раза в сутки"],["Дуба кора\u003cbr>\u003ci>Quercus cortex\u003c/i>","—","порошок, фильтр-пакет 2 г №25","2 фильтр-пакета заливают 100 мл кипятка и настаивают в течение 15 мин. Используют для полосканий по 100 мл 6–8 раз в сутки. Перед применением настой рекомендуется взболтать"],["\u003cmark>Лидокаин\u003c/mark>\u003cbr>\u003ci>Lidocainum\u003c/i>","—","\u003cmark>спрей для местного применения дозированный 10% флакон 38 г; раствор для инъекций 20 мг/мл; ампула 2 мл №10\u003c/mark>","\u003cmark>1–2 дозы на анестезируемую поверхность; для инфильтрационной анестезии используется 0,5% раствор, для проводниковой — 1–2% раствор. Максимальная общая доза — 300–400 мг\u003c/mark>"],["\u003cmark>Прокаин\u003c/mark>\u003cbr>\u003ci>Procainum\u003c/i>","Новокаин (Novocainum)","\u003cmark>раствор для инъекций 2,5 мг/мл, 5 мг/мл, 10 мг/мл, 20 мг/мл; ампула 2 мл, 5 мл, 10 мл №10\u003c/mark>","\u003cmark>Для инфильтрационной анестезии применяют 0,25–0,5% растворы, для проводниковой и перидуральной — 2% раствор\u003c/mark>"],["Смектит диоктаэдрический\u003cbr>\u003ci>Smectitum dioctaedricum\u003c/i>","Смекта (Smecta)","порошок для приготовления суспензии для приёма внутрь 3 г; №30","Внутрь, при эзофагите — после еды, в других случаях — между приёмами пищи по 3 пакетика, растворяя содержимое каждого пакетика в 1/2 стакана воды. В случае острой диареи возможно удвоение суточной дозы в начале лечения"],["Стоматофит","Стоматофит (Stomatophyt)","экстракт жидкий; флакон 45 или 120 мл с мерным стаканом","7,5 мл препарата (мерный стаканчик) развести в 50 мл (1/4 стакана) тёплой кипячёной воды. Полученный раствор использовать для полоскания полости рта. Процедуру повторять 3–4 раза в день на протяжении 10–15 дней"],["Шалфея лекарственного листья\u003cbr>\u003ci>Folia Salviae officinalis\u003c/i>","—","порошок; фильтр-пакет 1,5 г №10","3–4 фильтр-пакета заливают 100 мл кипятка и настаивают в течение 15 мин. Используют для полосканий по 100 мл 6–8 раз в сутки. Перед применением настой рекомендуется взболтать"]]},{"t":"list","title":"Экзаменационные вопросы по теме (Средства, влияющие на ПНС)","items":["3. Местные анестетики. Классификация. Связь между химической структурой и действием. Механизм анестезирующего действия. Факторы, влияющие на длительность и выраженность анестезии. Виды анестезии и выбор препаратов для разных видов анестезии. Нежелательные эффекты.","4. Вяжущие, адсорбирующие, обволакивающие и раздражающие средства. Классификация. Механизм действия. Применение."]},{"t":"src","text":"Источники конспекта: УМП «Вещества, влияющие на афферентную иннервацию…» (А. А. Слобожанин, К. Н. Мельников); лекционный материал кафедры фармакологии; пособие «Местная анестезия» (В. А. Корячкин и соавт.); УМП «Средства, влияющие на афферентную часть рефлекторной нервной дуги» под ред. Э. Э. Звартау; учебник под ред. А. А. Свистунова, В. В. Тарасова; Государственный регистр лекарственных средств."}]});

function vParse(s){ const o={}; String(s).replace(/([a-z]+)([+-])(\d)/g,(_,k,sg,n)=>{ o[k]=(sg==='-'?-1:1)*(+n); return ''; }); return o; }
function vEntry(name){ const e=VIT[name]; if(!e) return null; if(typeof e==='string') return {v:[['Действие',e]], n:{}}; return {g:e.g, v:e.v, n:e.n||{}, anti:e.anti}; }
function vState(p){
  const s=Object.assign({},p);
  if(s.bp===undefined && (s.vt||s.co||s.ven||s.hr)){ const est=Math.round(0.55*(s.vt||0)+0.35*(s.co||0)+0.25*(s.ven||0)+0.15*(s.hr||0)); if(est) s.bp=Math.max(-3,Math.min(3,est)); }
  return s;
}
const VNUM = {
  hr:  v=>Math.round(72+(v>0?17:11)*v),
  sys: v=>Math.round(120+(v>0?18:14)*v), dia: v=>Math.round(80+(v>0?9:8)*v),
  rr:  v=>v<=-3?4:Math.round(16+(v>0?4:3.5)*v),
  pu:  v=>[1.2,2,2.8,3.5,5,6.5,8][v+3],
  tmp: v=>(36.6+0.7*v),
  glu: v=>(5.0+(v>0?1.6:0.9)*v),
  k:   v=>(4.4+0.6*v)
};

/* ---------- ЭКГ ---------- */
function vECG(s){
  const hr=VNUM.hr(s.hr||0), RR=6000/hr; // 100 px = 1 с
  const av=s.av||0, qt=s.qt||0;
  const PR=Math.max(10,16-(av>0?2.5:6)*av), QRS=qt<=-2?11:8, QT=Math.max(30,38+7*Math.max(0,qt)-2*Math.max(0,-qt));
  const n=Math.max(3,Math.ceil(600/RR)); const Win=n*RR; const y0=62;
  let d=`M0,${y0}`; let x=0;
  const beat=(i,x0)=>{ let o=''; const drop = av<=-3 && i%3===2; const ectop = qt>=2 && i%4===3;
    const pS=x0+4;
    o+=` L${pS},${y0} q4,-8 8,0`; // P
    if(drop){ return o; }
    const q=pS+8+(PR-8);
    if(ectop){ o+=` L${q},${y0} l3,6 l6,-40 l6,46 l6,-12 q10,-14 20,0`; return o; }
    o+=` L${q},${y0} l2,4 l${QRS/2-1},-34 l${QRS/2},40 l2,-10`;
    const t0=q+QRS+3, tEnd=q+QT;
    o+=` L${t0+(tEnd-t0)*0.35},${y0} q${(tEnd-t0)*0.3},-14 ${(tEnd-t0)*0.65},0`;
    return o; };
  for(let i=0;i<2*n;i++){ d+=beat(i,i*RR); }
  d+=` L${2*Win+10},${y0}`;
  const dur=(Win/100).toFixed(2);
  return {svg:`<svg class="ecg" viewBox="0 0 600 100" preserveAspectRatio="xMinYMid slice" aria-hidden="true"><defs><pattern id="ecg-g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 L0,0 0,20" class="ecg-grid"/></pattern></defs><rect width="600" height="100" fill="url(#ecg-g)"/><g class="ecg-run" style="--w:-${Win.toFixed(1)}px;--d:${dur}s"><path d="${d}" class="ecg-line"/></g></svg>`, hr};
}

function vSetup(A, nm){
  const $=A.$, $$=A.$$;
  const stage=$('#bdstage'), svg=$('.bd-svg',stage), panel=$('#bdpanel');

    const hits=all.filter(n=>n.toLowerCase().includes(v) || ((A.DRUGS[n]||{}).al||[]).some(a=>a.toLowerCase().includes(v))).slice(0,10);
    res.innerHTML=hits.length?hits.map(n=>`<a href="#body/${encodeURIComponent(n)}">${n}<small>${A.esc(vGroup(A,n))}</small></a>`).join(''):'<div class="none">Нет в модели. Попробуйте досье в базе препаратов.</div>'; });
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const a=$('a',res); if(a){ location.hash=a.getAttribute('href'); } } });
  $('#bdrand').addEventListener('click',()=>{ const k=all[Math.floor(Math.random()*all.length)]; location.hash='#body/'+encodeURIComponent(k); });
  svg.addEventListener('click',e=>{ const g=e.target.closest('.org'); if(g) vOrgan(A,cur,g.dataset.org); });
  svg.addEventListener('keydown',e=>{ const g=e.target.closest('.org'); if(g&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); vOrgan(A,cur,g.dataset.org); } });
  panel.addEventListener('click',e=>{
    const b=e.target.closest('[data-vi]'); if(b){ cur.vi=+b.dataset.vi; antiOn=false; render(); return; }
    const an=e.target.closest('[data-anti]'); if(an){ antiOn=!antiOn; render(); return; }
    const pl=e.target.closest('[data-play]'); if(pl){ apply({}); setTimeout(()=>apply(cur.s),420); return; }
    const o=e.target.closest('[data-org]'); if(o){ vOrgan(A,cur,o.dataset.org); }
  });
  function render(){
    if(!cur.name){ panel.innerHTML=vEmpty(); apply({}); vPanelLive(A,panel,{}); return; }
    const e=vEntry(cur.name); const v=e.v[Math.min(cur.vi,e.v.length-1)];

    panel.innerHTML=vPanel(A,cur,e,antiOn);

  if(cur.name){ apply({}); requestAnimationFrame(()=>setTimeout(render,260)); } else render();
}
function vGroup(A,n){ const e=VIT[n]; return (e&&e.g) || ((A.DRUGS[n]||{}).g) || ''; }

function vGauges(){ return `<div class="bd-g">${[['hr','ЧСС','уд/мин'],['bp','АД','мм рт. ст.'],['rr','ЧДД','в мин'],['pu','Зрачок','мм'],['tmp','t тела','°C'],['glu','Глюкоза','ммоль/л']].map(([k,l,u])=>`<div class="g-${k}"><small>${l}</small><b data-g="${k}">—</b><span>${u}</span><i class="g-ar"></i></div>`).join('')}</div>`; }
function vPanel(A,cur,e,antiOn){

function lSets(A,pid){
  const items=lDeck(A).filter(it=>it.p===pid); const p=KP.find(x=>x.id===pid); if(!p) return null;
  const heads=p.blocks.filter(b=>b.t==='h').map(b=>lClean(b.text));

  const gm=new Map(); items.forEach(it=>it.groups.forEach(g=>{ if(!gm.has(g)) gm.set(g,[]); gm.get(g).push(it); }));
  const groups=[...gm.entries()].filter(([,l])=>l.length>=2).map(([g,l])=>({g,items:l}));
  return {p, items, y:items.filter(it=>it.hl==='y'), yg:items.filter(it=>it.hl), rx:items.filter(it=>it.hasRx), hard:items.filter(it=>((lRec(it.id)||[])[3]||0)>0), secs, groups, heads};
}

/* очередь на сегодня: просроченные + новые, новые вставлены между повторениями */
function lQueueToday(items,pr,extra){
  const t=lToday(); const due=[], fresh=[], fr=[], fx=[];
  items.forEach(it=>{ const m=lRec(it.id), r=lRec('rv:'+it.id), x=lRec('rx:'+it.id);
    if(lSeen(m)){ if(m[1]<=t) due.push({it,f:'m',due:m[1]}); } else fresh.push({it,f:'m'});
    if(pr.rev){ if(lSeen(r)){ if(r[1]<=t) due.push({it,f:'r',due:r[1]}); } else if(lSeen(m)&&m[0]>=3&&lHasClue(it)) fr.push({it,f:'r'}); }
    if(it.hasRx){ if(lSeen(x)){ if(x[1]<=t) due.push({it,f:'x',due:x[1]}); } else if(pr.rxf && it.hl && lSeen(m)) fx.push({it,f:'x'}); }
  });
  due.sort((a,b)=>a.due-b.due || a.it.ord-b.it.ord);
  fresh.sort((a,b)=>lRank[b.it.hl]-lRank[a.it.hl] || lPlateIdx(a.it)-lPlateIdx(b.it) || a.it.ord-b.it.ord);
  const leftM=Math.max(0,(pr.nnew+(extra||0))-(LST.nw[t]||0)), leftX=Math.max(0,Math.ceil(pr.nnew*0.7)+(extra||0)-(LST.nx[t]||0));
  const side=fx.concat(fr).slice(0,leftX);
  const nw=[]; const fm=fresh.slice(0,leftM); let a=0,b=0; while(a<fm.length||b<side.length){ if(a<fm.length) nw.push(fm[a++]); if(a<fm.length) nw.push(fm[a++]); if(b<side.length) nw.push(side[b++]); }
  const out=[]; let i=0,j=0; while(i<due.length||j<nw.length){ for(let k=0;k<3&&i<due.length;k++) out.push(due[i++]); if(j<nw.length) out.push(nw[j++]); }
  return {list:out, due:due.length, nw:nw.length, freshLeft:fresh.length-fm.length};
}

const lNk=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/<[^>]+>/g,'').replace(/[^a-zа-я0-9]+/g,'');

function lNames(it){ const s=new Set([it.n]); if(it.card) (it.card.al||[]).forEach(x=>s.add(lClean(x))); if(it.e){ s.add(it.e.n); it.e.names.forEach(x=>s.add(x)); } if(it.d){ s.add(it.d.n); (it.d.al||[]).forEach(x=>s.add(x)); } return [...s]; }

  const doUndo=()=>{ if(!undo) return; if(undo.prev) LST.items[undo.id]=undo.prev; else delete LST.items[undo.id]; LST.days=undo.snap.days; LST.nw=undo.snap.nw; LST.nx=undo.snap.nx; lSave(); done[undo.g]--; if(undo.ins>=0) list.splice(undo.ins,1); i=undo.i; undo=null; lStats(st); draw(); };
  const check=()=>{ const inp=document.getElementById('lc-ans'); if(!inp||flipped) return; const v=inp.value.trim(); if(!v){ flip(); return; } const c=list[i]; typedRes=lMatch(c.it,v);
    inp.blur(); const res=box.querySelector('.lc-res'); if(res){ res.hidden=false; res.className='lc-res '+(typedRes?'ok':'no'); res.innerHTML=typedRes?`<b>Верно</b> · ваш ответ: ${st.A.esc(v)}`:`<b>Не совпало</b> · ваш ответ: ${st.A.esc(v)}`; } flip(); };
  box.onclick=e=>{ const t=e.target;
    if(t.closest('[data-flip]')||(t.closest('.lc-f')&&!t.closest('a,button,input,form,label'))){ if(box.querySelector('#lc-ans')&&box.querySelector('#lc-ans').value.trim()) check(); else flip(); return; }
    const r=t.closest('[data-r]'); if(r){ rate(+r.dataset.r); return; }
    if(t.closest('[data-undo]')){ doUndo(); return; }
    if(t.closest('[data-more]')){ st.extra+=10; lSession(st,box); return; }

    const nn=t.closest('[data-nn]'); if(nn){ st.pr.nnew=+nn.dataset.nn; lPrefSave(st.pr); lSession(st,box); return; }
    const gl=t.closest('[data-goal]'); if(gl){ st.pr.goal=+gl.dataset.goal; lPrefSave(st.pr); lStats(st); box.querySelectorAll('[data-goal]').forEach(x=>x.setAttribute('aria-pressed',String(x===gl))); return; }
    const g=t.closest('[data-goto]'); if(g){ const tb=document.querySelector(`.l-tabs [data-mode="${g.dataset.goto}"]`); if(tb) tb.click(); }
  };
  box.onchange=e=>{ const o=e.target.closest('[data-opt]'); if(o){ st.pr[o.dataset.opt]=o.checked; lPrefSave(st.pr); const open=true; lSession(st,box); const d=box.querySelector('.l-set2'); if(d&&open) d.open=true; } };
  box.onsubmit=e=>{ if(e.target.closest('[data-type]')){ e.preventDefault(); check(); } };
  document.onkeydown=e=>{ if(!document.getElementById('lc')) return; const typing=/input|textarea|select/i.test(e.target.tagName||'');
    if(typing){ if(e.key==='Escape'){ e.target.blur(); } return; }
    if(e.key===' '||e.key==='Enter'){ if(!flipped){ e.preventDefault(); flip(); } else if(e.key===' '){ e.preventDefault(); } }
    else if(['1','2','3','4'].includes(e.key)) rate(+e.key);
    else if(e.key==='Backspace'&&undo){ e.preventDefault(); doUndo(); } };
  draw();
}

/* ---------- тест ---------- */
function lShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* похожие формулировки: совпадение значимых основ слов (чтобы дистрактор не оказался тоже верным) */
const lStems=t=>[...new Set(String(t).toLowerCase().replace(/<[^>]+>/g,'').split(/[^a-zа-яё0-9]+/i).filter(w=>w.length>=5).map(w=>w.slice(0,6)))];
function lLike(t,list){ const st=lStems(t); if(!st.length) return (list||[]).some(y=>y.toLowerCase()===String(t).toLowerCase()); const need=Math.max(1,Math.ceil(st.length/2)); return (list||[]).some(y=>{ const ys=lStems(y); return st.filter(x=>ys.includes(x)).length>=need; }); }
const RP_STOP=new Set(['Tab','Sol','Caps','Ung','Gel','Supp','Emuls','Susp','Tinct','Dragee','Empl','Extr','Extracti','Sir','Fol','Cort','Rhiz','Aër','Aer']);
function lRpBlank(A,r){ const m=r.l.map(s=>s.replace(/^(Rp\.:)(.*)$/,(_,k,t)=>k+t.replace(/«[^»]+»/g,'«______»').replace(/\b[A-Z][a-zë]{3,}\b/g,w=>RP_STOP.has(w)?w:'______'))); return A.rpHTML({f:'',l:m},{nocopy:true}); }
function lQuestions(A,pool,all,N){
  const qs=[];
  const others=(it,pred)=>lShuffle(pool.filter(x=>x!==it&&x.p===it.p&&pred(x))).concat(lShuffle(all.filter(x=>x!==it&&x.p!==it.p&&pred(x))));
  const pickD=(it,pred)=>{ const o=[]; const seenN=new Set([it.n.toLowerCase()]); for(const x of others(it,pred)){ if(!seenN.has(x.n.toLowerCase())){ seenN.add(x.n.toLowerCase()); o.push(x.n); } if(o.length===3) break; } return o; };
  const gens=[
    it=>{ const fm=it.card&&it.card.fm; if(!fm||!fm.length) return null; const f=fm[Math.floor(Math.random()*fm.length)]; const ds=pickD(it,x=>!(x.card&&x.card.fm&&x.card.fm.includes(f))); return ds.length<3?null:{q:`Возможная формулировка: <b>«${f}»</b>. Какой это препарат?`, a:it.n, opts:ds}; },
    it=>{ if(!it.groups.length) return null; const g=it.groups[0]; const gs=lShuffle([...new Set(pool.concat(all).filter(x=>x.p===it.p).flatMap(x=>x.groups))].filter(x=>!it.groups.includes(x))).slice(0,3); return gs.length<3?null:{q:`К какой группе относится <b>${it.n}</b>?`, a:g, opts:gs}; },
    it=>{ if(!it.groups.length) return null; const g=it.groups[0]; const ds=pickD(it,x=>!x.groups.includes(g)); return ds.length<3?null:{q:`Какой препарат относится к группе <b>${g}</b>?`, a:it.n, opts:ds}; },
    it=>{ const pk=it.card&&it.card.pok; if(!pk||!pk.length) return null; const p=pk[Math.floor(Math.random()*pk.length)]; const ds=pickD(it,x=>!lLike(p,[].concat((x.card&&x.card.pok)||[],(x.d&&(x.d.i||[]).map(z=>z[0]))||[],x.card&&x.card.x?[x.card.x]:[]))); return ds.length<3?null:{q:`Показание из конспекта: <b>${p}</b>. Какой препарат?`, a:it.n, opts:ds}; },
    it=>{ const pe=it.card&&it.card.pe; if(!pe||!pe.length) return null; const p=pe[Math.floor(Math.random()*pe.length)]; const ds=pickD(it,x=>!lLike(p,[].concat((x.card&&x.card.pe)||[],(x.d&&(x.d.a||[]).map(z=>z[0]))||[]))); return ds.length<3?null:{q:`Побочный эффект из конспекта: <b>${p}</b>. У какого препарата?`, a:it.n, opts:ds}; },
    it=>{ const r=it.rx.find(x=>x.mark)||it.rx[0]; if(!r||!r.dose) return null; const ds=pickD(it,x=>x.rx.length>0); return ds.length<3?null:{q:`Способ применения и доза: <b>«${r.dose.length>180?r.dose.slice(0,180)+'…':r.dose}»</b>. Какой препарат?`, a:it.n, opts:ds}; },
    it=>{ if(!it.rp.length) return null; const r=it.rp[Math.floor(Math.random()*it.rp.length)]; const ds=pickD(it,x=>x.rp.length>0); return ds.length<3?null:{q:`Чей это рецепт? Название препарата скрыто.${lRpBlank(A,r)}`, a:it.n, opts:ds}; }
  ];
  const cand=lShuffle(pool.slice());
  const hard=cand.filter(it=>((lRec(it.id)||[])[3]||0)>0).sort((a,b)=>lRec(b.id)[3]-lRec(a.id)[3]).slice(0,Math.ceil(N/3));
  const rich=cand.filter(it=>it.card||it.rx.length||it.rp.length);
  const usedIt=new Set(); let guard=0;
  const tryIt=it=>{ if(!it||usedIt.has(it.id)) return false; const order=(it.card||it.rx.length||it.rp.length)?lShuffle([0,3,4,5,6]).concat(lShuffle([1,2])):lShuffle([1,2]);
    for(const gi of order){ const q=gens[gi](it); if(q){ usedIt.add(it.id); q.it=it; q.opts=lShuffle([q.a].concat(q.opts)); qs.push(q); return true; } } return false; };
  hard.forEach(it=>{ if(qs.length<N) tryIt(it); });
  while(qs.length<N && guard<N*30 && cand.length){ guard++;
    const src=(guard%3!==0 && rich.length)?rich:cand; tryIt(src[Math.floor(Math.random()*src.length)]); }
  return lShuffle(qs);
}
function lTestBox(A,box,pool,all,N,onDone,ctl){
  const qs=lQuestions(A,pool,all,N); let i=0, score=0, answered=false; const wrong=[];
  if(!qs.length){ box.innerHTML=`<div class="l-empty"><h2>Недостаточно данных для теста</h2><p>Выберите больше лекций или набор «Все препараты».</p></div>`; return; }
  const draw=()=>{
    if(i>=qs.length){ const pct=Math.round(score/qs.length*100);
      box.innerHTML=`<div class="l-res"><svg viewBox="0 0 120 120" class="l-ring"><circle cx="60" cy="60" r="52" class="rg-bg"/><circle cx="60" cy="60" r="52" class="rg-fg" style="--p:${pct}"/></svg><div class="l-res-t"><b>${score} из ${qs.length}</b><span>${pct>=90?'Отлично — уровень зачёта':pct>=70?'Хорошо, повторите ошибки':'Стоит прогнать карточки'}</span></div></div>${wrong.length?`<div class="bd-card"><h3>Ошибки</h3><ul class="l-wrong">${wrong.map(w=>`<li><span>${w.q}</span><b>${w.a}</b></li>`).join('')}</ul></div>`:''}<div class="l-more"><button type="button" class="btn pri" data-new="1">Новый тест</button>${wrong.length?`<button type="button" class="btn" data-wrong="1">Прогнать ошибки · ${wrong.length}</button>`:''}${ctl?'':`<button type="button" class="btn" data-goto="today">К карточкам</button>`}</div>`;
      if(pct>=80) lConfetti(box); if(onDone) onDone(); return; }
    const q=qs[i]; answered=false;
    box.innerHTML=`<div class="l-prog"><span style="--p:${(i/qs.length*100).toFixed(1)}%"></span></div><p class="l-count">Вопрос ${i+1} из ${qs.length} · ${q.it.lec}</p><div class="l-q"><div class="l-qq">${q.q}</div><div class="l-opts">${q.opts.map((o,k)=>`<button type="button" data-o="${k}"><kbd>${k+1}</kbd>${o}</button>`).join('')}</div><div class="l-fb" hidden></div></div>`;
  };
  const answer=k=>{ if(answered) return; answered=true; const q=qs[i]; const ok=q.opts[k]===q.a;
    box.querySelectorAll('.l-opts button').forEach((b,j)=>{ b.disabled=true; if(q.opts[j]===q.a) b.classList.add('ok'); else if(j===k) b.classList.add('no'); });
    if(ok) score++; else wrong.push({q:q.q.replace(/<figure[\s\S]*<\/figure>/,' [рецепт]').replace(/<[^>]+>/g,''),a:q.a,it:q.it});
    lTouch(q.it.id,ok);
    const fb=box.querySelector('.l-fb'); fb.hidden=false; const it=q.it;
    fb.innerHTML=`<p class="${ok?'ok':'no'}"><b>${ok?'Верно.':'Неверно.'}</b> ${it.n}${it.groups[0]?' — '+it.groups[0]:''}${it.card&&it.card.kl?'; кл: '+it.card.kl:''}</p><button type="button" class="btn pri" data-next="1">Дальше <kbd>Enter</kbd></button>`;
  };
  box.onclick=e=>{ const o=e.target.closest('[data-o]'); if(o){ answer(+o.dataset.o); return; } if(e.target.closest('[data-next]')){ i++; draw(); return; } if(e.target.closest('[data-new]')){ lTestBox(A,box,pool,all,N,onDone,ctl); return; }
    if(e.target.closest('[data-wrong]')){ const set=[...new Set(wrong.map(w=>w.it))]; if(ctl&&ctl.cards) ctl.cards(set); else RUN.open({items:set, mode:'cards', title:'Ошибки теста', eyebrow:'Прогон', opener:e.target.closest('button')}); return; }
    const g=e.target.closest('[data-goto]'); if(g){ const tb=document.querySelector(`.l-tabs [data-mode="${g.dataset.goto}"]`); if(tb) tb.click(); } };
  const key=e=>{ if(!box.querySelector('.l-q')||/input|textarea/i.test(e.target.tagName||'')) return false; if(['1','2','3','4'].includes(e.key)){ answer(+e.key-1); return true; } if(e.key==='Enter'&&answered){ e.preventDefault(); i++; draw(); return true; } return false; };
  if(ctl) ctl.key=key; else document.onkeydown=key;
  draw();
}

/* ---------- прогресс ---------- */
function lProg(st,box){
  const A=st.A; const items=st.items; const plates=KP.filter(p=>items.some(it=>it.p===p.id)); const t=lToday();
  const rows=plates.map(p=>{ const s=lStat(items.filter(it=>it.p===p.id)); return {p,s}; });
  const hard=items.filter(it=>((lRec(it.id)||[])[3]||0)>=2).sort((a,b)=>lRec(b.id)[3]-lRec(a.id)[3]).slice(0,16);
  const days=[]; for(let d=t-34; d<=t; d++) days.push([d,LST.days[d]||0]); const mx=Math.max(1,...days.map(x=>x[1]));
  const fc=[]; for(let d=0; d<7; d++){ let n=0; Object.values(LST.items).forEach(r=>{ if(r[2] && (d===0?r[1]<=t:r[1]===t+d)) n++; }); fc.push(n); } const fmx=Math.max(1,...fc);
  const wd=['вс','пн','вт','ср','чт','пт','сб']; const today=new Date();
  box.innerHTML=`<div class="bd-card"><h3>По лекциям</h3><div class="l-bars">${rows.map(({p,s})=>`<a class="l-bar" href="#learn/${p.id}"><span class="l-bl">${p.roman}</span><span class="l-bt">${A.esc(p.title)}</span><span class="l-bb"><i class="k" style="width:${(s.mature/s.n*100).toFixed(1)}%"></i><i class="l" style="width:${(s.young/s.n*100).toFixed(1)}%"></i></span><span class="l-bn">${s.mature+s.young}/${s.n}</span></a>`).join('')}</div><p class="l-leg"><i class="k"></i>прочно (интервал от 3 недель) <i class="l"></i>в процессе <i class="n"></i>не начаты</p></div>

/* ---------- план до экзамена ---------- */
const L_PLAN='atlas-plan';
function lPlanGet(){ try{ const x=JSON.parse(localStorage.getItem(L_PLAN)||'null'); return x&&x.date?Object.assign({lec:[],res:2},x):null; }catch(e){ return null; } }
function lPlanSet(x){ try{ if(x&&x.date) localStorage.setItem(L_PLAN,JSON.stringify(x)); else localStorage.removeItem(L_PLAN); }catch(e){} }
const lDayOf=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?Math.floor(Date.UTC(+m[1],m[2]-1,+m[3])/864e5):null; };
const lDayStr=d=>new Date(d*864e5).toISOString().slice(0,10);
const lDayFmt=d=>{ const x=new Date(d*864e5); return ['вс','пн','вт','ср','чт','пт','сб'][x.getUTCDay()]+' '+String(x.getUTCDate()).padStart(2,'0')+'.'+String(x.getUTCMonth()+1).padStart(2,'0'); };
function lPlanCalc(items,plan,set){
  const t=lToday(), ex=lDayOf(plan.date); if(ex==null) return null; const days=ex-t;
  const pool=lPool(items,{lec:plan.lec||[], set:set||'all'});
  const fresh=pool.filter(it=>!lSeen(lRec(it.id))).sort((a,b)=>lRank[b.hl]-lRank[a.hl] || lPlateIdx(a)-lPlateIdx(b) || a.ord-b.ord);
  const doneToday=LST.nw[t]||0;
  const reserve=days>=6?Math.min(plan.res==null?2:plan.res, days-3):0; const work=Math.max(1,days-reserve);
  const per=!fresh.length?0:days>0?Math.ceil((fresh.length+doneToday)/work):fresh.length;
  const sched=[]; let k=0;
  for(let d=0; d<days; d++){ if(d<work){ const take=d===0?Math.max(0,per-doneToday):per; const ch=fresh.slice(k,k+take); k+=ch.length; const by={}; ch.forEach(it=>{ by[it.p]=(by[it.p]||0)+1; }); sched.push({day:t+d, n:ch.length, by, run:false}); } else sched.push({day:t+d, n:0, by:{}, run:true}); }
  return {t,ex,days,pool,fresh,reserve,work,per,sched,doneToday};
}
function lPlanTab(st,box){
  const A=st.A; const plan=lPlanGet()||{date:'',lec:[],res:2}; const plates=KP.filter(p=>st.items.some(it=>it.p===p.id)); const t=lToday();
  const C=plan.date?lPlanCalc(st.items,plan,st.pr.set):null; const lab=id=>A.BY[id]?A.BY[id].roman:id;
  const setT={all:'все препараты',yg:'жёлтые и зелёные',y:'только жёлтые'}[st.pr.set]||'все препараты';

const RUN=(function(){

    el.querySelector('#run-t').textContent=o.title||'';

    start(S.mode);
    el.querySelector('.run-panel').focus({preventScroll:true});
  }
  function modes(){ const rx=S.items.filter(it=>it.hasRx).length; el.querySelector('.run-m').innerHTML=[['cards','Карточки'],['test','Тест']].concat(rx?[['rx','Рецепты']]:[]).map(([k,t])=>`<button type="button" data-rm="${k}" aria-pressed="${S.mode===k}">${t}</button>`).join(''); }
  function start(mode){ S.mode=mode; S.key=null; modes(); const box=el.querySelector('#runBody'); box.scrollTop=0;
    if(mode==='test'){ const ctl={cards:set=>{ S.items=set; start('cards'); }}; lTestBox(A(),box,S.items,lDeck(A()),Math.min(15,Math.max(5,S.items.length)),()=>{ lRefreshAll(); if(S&&S.o.done) S.o.done(); },ctl); S.key=e=>ctl.key&&ctl.key(e); return; }
    cards(box, mode==='rx'); }
  function cards(box,rx){
    const A0=A(); let list=S.items.filter(it=>!rx||it.hasRx); if(!list.length){ box.innerHTML='<div class="l-empty"><h2>Нет рецептов в этом наборе</h2></div>'; return; }
    if(S.o.shuffle) list=lShuffle(list.slice()); else list=list.slice();
    const total=list.length; const first=new Map(); const miss=new Set(); let flipped=false; let q=list.slice();

      if(!q.length){ const clean=total-miss.size;
        box.innerHTML=`<div class="l-res"><svg viewBox="0 0 120 120" class="l-ring"><circle cx="60" cy="60" r="52" class="rg-bg"/><circle cx="60" cy="60" r="52" class="rg-fg" style="--p:${Math.round(clean/total*100)}"/></svg><div class="l-res-t"><b>${clean} из ${total}</b><span>с первого раза. ${miss.size?'Ошибки уже стоят в повторении на сегодня.':'Чисто — без ошибок.'}</span></div></div>
        ${miss.size?`<div class="bd-card"><h3>Не вспомнились сразу</h3><div class="bd-sugg">${[...miss].map(it=>`<button type="button" class="bd-chip" data-dr="${A0.esc((it.e&&it.e.n)||it.n)}">${it.n}</button>`).join('')}</div></div>`:''}
        <div class="l-more">${miss.size?`<button type="button" class="btn pri" data-again="miss">Прогнать ошибки · ${miss.size}</button>`:''}<button type="button" class="btn${miss.size?'':' pri'}" data-again="all">Ещё раз всё</button><button type="button" class="btn" data-rm="test">Тест по набору</button><button type="button" class="btn" data-rclose>Закрыть</button></div>`;

  function onClick(e){ if(e.target.closest('[data-rclose]')){ close(); return; } const m=e.target.closest('[data-rm]'); if(m&&S){ start(m.dataset.rm); return; }

})();

function lConfetti(host){

  const w=document.createElement('div'); w.className='confetti'; const cols=['var(--hema)','var(--eosin)','var(--iodine)','var(--hl-g)','var(--hl-y)'];
  for(let i=0;i<46;i++){ const s=document.createElement('i'); s.style.left=(Math.random()*100)+'%'; s.style.background=cols[i%cols.length]; s.style.setProperty('--dx',(Math.random()*160-80)+'px'); s.style.setProperty('--r',(Math.random()*720-360)+'deg'); s.style.animationDelay=(Math.random()*0.35)+'s'; w.appendChild(s); }

/* ===== Анимации и «фишки»: живые схемы, подсветка цепочек, появление при прокрутке, горячие клавиши, тема ===== */
const FX = (function(){
  const RM = ()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_KEY='atlas-theme';
  const qs=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>Array.from(r.querySelectorAll(s));

  /* ---------- тема ---------- */
  function themeGet(){ try{ return localStorage.getItem(T_KEY)||'auto'; }catch(e){ return 'auto'; } }
  function themeSet(t){ try{ localStorage.setItem(T_KEY,t); }catch(e){} themeApply(t); }
  function themeApply(t){ const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
    qa('.fx-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===t))); }
  themeApply(themeGet());

  /* ---------- наблюдатель прокрутки ---------- */
  const hasIO = typeof IntersectionObserver!=='undefined';
  const cb = new WeakMap();
  let io = hasIO ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; const f=cb.get(e.target); io.unobserve(e.target); cb.delete(e.target); if(f) f(e.target); }),{rootMargin:'0px 0px -8% 0px',threshold:0.06}) : null;
  function watch(el,fn){ if(!io){ fn(el); return; } cb.set(el,fn); io.observe(el); }

  /* ---------- появление блоков ---------- */
  function reveal(root){
    if(RM()||!io) return;
    const H=innerHeight;
    qa('.kc,.fig,.pcard,.tblw,.klist,.kwarn,.dbrow,.module,.bd-card,.l-bar',root).forEach((el,i)=>{
      if(el.closest('.dz')||el.classList.contains('rv')) return;
      const r=el.getBoundingClientRect(); if(r.top<H-20) return;
      el.classList.add('rv'); watch(el,x=>{ x.classList.add('in'); setTimeout(()=>x.classList.remove('rv','in'),700); });
    });
  }
  /* цепочки «причина → следствие» разворачиваются по звеньям */
  function chains(root){
    if(RM()) return;
    qa('.cf',root).forEach(cf=>{ if(cf._fx) return; cf._fx=1; Array.from(cf.children).forEach((c,i)=>c.style.setProperty('--i',i)); cf.classList.add('fx-cf'); watch(cf,x=>x.classList.add('in')); });
  }

  /* ---------- блок-схемы: уровни, проигрывание, подсветка цепочки ---------- */
  function gPrep(svg){
    if(svg._g) return svg._g;
    const nodes=qa('.gn-w',svg), edges=qa('.ge-w',svg); const N={}; nodes.forEach(g=>N[g.dataset.n]=g);
    const out={}, inc={};
    edges.forEach(e=>{ const a=e.dataset.a, b=e.dataset.b; if(a&&N[a]) (out[a]=out[a]||[]).push(e); if(b&&N[b]) (inc[b]=inc[b]||[]).push(e); });
    const lv={};
    const bfs=roots=>{ const q=roots.slice(); while(q.length){ const id=q.shift(); (out[id]||[]).forEach(e=>{ const b=e.dataset.b; if(b&&N[b]&&lv[b]===undefined){ lv[b]=lv[id]+1; q.push(b); } }); } };
    const roots=nodes.map(g=>g.dataset.n).filter(id=>!(inc[id]||[]).some(e=>e.dataset.a&&N[e.dataset.a]));
    roots.forEach(id=>lv[id]=0); bfs(roots);
    nodes.forEach(g=>{ const id=g.dataset.n; if(lv[id]===undefined){ lv[id]=0; bfs([id]); } });
    let max=0;
    nodes.forEach(g=>{ g._s=lv[g.dataset.n]; max=Math.max(max,g._s); });
    edges.forEach(e=>{ const a=e.dataset.a, b=e.dataset.b; e._s = a&&N[a] ? lv[a]+1 : (b&&N[b] ? lv[b] : 0); max=Math.max(max,e._s); });
    return svg._g={nodes,edges,N,out,inc,max};
  }
  function drawEdge(e,ms){
    const p=e.querySelector('path'); if(!p||!p.getTotalLength) return;
    let L=0; try{ L=p.getTotalLength(); }catch(x){} if(!L) return;
    const me=p.getAttribute('marker-end'), msA=p.getAttribute('marker-start');
    if(me) p.removeAttribute('marker-end'); if(msA) p.removeAttribute('marker-start');
    p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.getBoundingClientRect();
    p.style.transition=`stroke-dashoffset ${ms}ms ease-out`; p.style.strokeDashoffset='0';
    setTimeout(()=>{ p.style.transition=''; p.style.strokeDasharray=''; p.style.strokeDashoffset=''; if(me) p.setAttribute('marker-end',me); if(msA) p.setAttribute('marker-start',msA); },ms+20);
  }
  function gStop(svg){ (svg._tm||[]).forEach(clearTimeout); svg._tm=[]; svg.classList.remove('fx-hide','fx-playing'); qa('.on,.cur',svg).forEach(x=>x.classList.remove('on','cur')); const b=svg.closest('.kgraph'); const btn=b&&qs('.fx-gbtn',b); if(btn){ btn.textContent='▶ Проиграть'; btn.setAttribute('aria-pressed','false'); } const st=b&&qs('.fx-step',b); if(st) st.textContent=''; }
  function gPlay(svg,step,slow){

/* ---------- подсветка ---------- */
function highlight(fig, sites, act, badge=true){
  const svg=$('svg',fig), layer=$('.hl',svg); layer.innerHTML='';
  $$('.site.on',svg).forEach(e=>e.classList.remove('on'));
  const sym={stim:'+',block:'⊣',mod:'~'}[act];
  sites.forEach(s=>$$(`.site[data-site="${s}"]`,svg).forEach(el=>{
    el.classList.add('on'); const d=el.dataset, x=+d.cx, y=+d.cy; let bx,by;
    if(d.w){ const w=+d.w,h=+d.h; layer.insertAdjacentHTML('beforeend',`<rect class="ring ${act}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="10"/>`); bx=x+w/2-14; by=y-h/2; }
    else { const r=+d.r; layer.insertAdjacentHTML('beforeend',`<circle class="ring ${act}" cx="${x}" cy="${y}" r="${r}"/>`); bx=x+r*.72; by=y-r*.72; }
    if(badge) layer.insertAdjacentHTML('beforeend',`<circle class="badge-c ${act}" cx="${bx}" cy="${by}" r="10"/><text class="badge-t" x="${bx}" y="${by+4.2}" text-anchor="middle">${sym}</text>`);
  }));
}
function siteLabel(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s?plain(s.l):k; }
function siteInfo(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s; }
function activateChip(fig,b,i){
  const c=b.chips[i]; const sites=[].concat(c.s);
  $$('.chip',fig).forEach(x=>x.setAttribute('aria-pressed', x.dataset.i==String(i)?'true':'false'));
  highlight(fig,sites,c.a);
  const where=[...new Set(sites.map(s=>siteLabel(b,s)))].join(', ');
  $('.info',fig).innerHTML=`<h4>${c.d} <span class="act ${c.a}">${ACT[c.a]}</span></h4><p>${c.x}</p><p style="margin-top:6px;font-size:13px;color:var(--ink-3)">Точка действия на схеме: ${where}</p>`+(findDrug(c.d)?`<div class="also"><button type="button" class="btn" data-dr="${esc(findDrug(c.d).n)}">Досье: системы, показания, побочные эффекты →</button></div>`:'');
}
function activateSite(fig,b,k){
  const s=siteInfo(b,k); if(!s) return;
  $$('.chip',fig).forEach(x=>x.setAttribute('aria-pressed','false'));
  highlight(fig,[k],'stim',false);
  const users=b.chips.map((c,i)=>[c,i]).filter(([c])=>[].concat(c.s).includes(k));
  $('.info',fig).innerHTML=`<h4>${s.l}</h4><p>${s.f||''}</p>`+(users.length?`<div class="also">${users.map(([c,i])=>`<button type="button" class="chip ${c.a}" data-go="${i}">${c.d}</button>`).join('')}</div>`:'');
}

function renderSteps(steps){
  return steps.map(s=>{
    if(s.split) return `<div class="rx-split" style="--cols:${s.split.length}">${s.split.map((br,i)=>`<div class="rx-branch">${s.labels?`<div class="rx-blab">${s.labels[i]}</div>`:''}<div class="rx-chain">${renderSteps(br)}</div></div>`).join('')}</div>`;
    if(s.n!==undefined) return `<div class="rx-node ${s.tag?'is-'+s.tag:''}"><span class="rx-n">${s.n}</span>${s.s?`<span class="rx-s">${s.s}</span>`:''}${s.prod?`<dl class="rx-prod">${s.prod.map(([a,d])=>`<dt>${a}</dt><dd>${d}</dd>`).join('')}</dl>`:''}</div>`;
    const mods=(s.inh||[]).map(d=>`<span class="tag inh">⊣ ${d}</span>`).join('')+(s.act||[]).map(d=>`<span class="tag ac">+ ${d}</span>`).join('');
    return `<div class="rx-arr"><div class="rx-line"></div><div class="rx-txt">${s.e?`<span class="rx-e">${s.e}</span>`:''}${s.c?` <span class="rx-c">${s.c}</span>`:''}${s.note?`<div class="rx-note">${s.note}</div>`:''}${mods?`<div>${mods}</div>`:''}</div></div>`;
  }).join('');
}

function pkDraw(fig){

  g+=`<path d="M${x0},${Y(cavg).toFixed(1)} H${x1}" style="stroke:var(--hema);stroke-width:1.2;stroke-dasharray:5 4"/><text class="t-small" x="${x0+8}" y="${(Y(cmax)-6).toFixed(1)}" text-anchor="start">коридор C<tspan baseline-shift="sub" font-size="8">ss</tspan></text>`;

/* ---------- конспект: блок-схема ---------- */
const GF = {b:'gt', d:'gt-d', h:'gt-h', s:'gt-s', z:'t-zone', l:'gl'};
let _ms=null, _mt=null; const _mcache=new Map();
function tw(t,cls){ const k=cls+'|'+t; if(_mcache.has(k)) return _mcache.get(k);
  if(!_ms){ _ms=document.createElementNS('http://www.w3.org/2000/svg','svg'); _ms.setAttribute('aria-hidden','true'); _ms.style.cssText='position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden'; _mt=document.createElementNS('http://www.w3.org/2000/svg','text'); _ms.appendChild(_mt); document.body.appendChild(_ms); }
  _mt.setAttribute('class',cls); _mt.textContent=t; const v=_mt.getComputedTextLength()||t.length*7.4; _mcache.set(k,v); return v; }
function wrapW(t,maxw,f){ const out=[]; String(t).split('\n').forEach(par=>{ let line=''; par.split(' ').forEach(w=>{ if(!line) line=w; else if(tw(line+' '+w,f)<=maxw) line+=' '+w; else { out.push(line); line=w; } }); out.push(line); }); return out; }
function gnode(nd){
  const [id,x,y,t,k='',w0]=nd; const txt=plain(t);
  const small = k==='t'||k==='z';
  const f = k==='d'?GF.d:(k==='h'?GF.h:(k==='t'?GF.s:(k==='z'?GF.z:GF.b)));
  const pad = small||k==='h' ? 6 : 18;
  const longest = Math.max(...txt.split('\n').map(l=>tw(k==='z'?l.toUpperCase():l,f)));
  const maxW = k==='h'?560:(small?300:230);
  const w = w0 || Math.min(maxW, Math.max(52, longest+pad));
  const lines = wrapW(k==='z'?txt.toUpperCase():txt, w-pad, f);
  const lh = small?14.5:(k==='h'?19:16.5);
  const h = lines.length*lh + (small||k==='h'?4:12);

const RP_K=/^(Rp\.?:?|D\.\s*t\.\s*d\.|D\.\s*S\.|S\.)\s*/;

function rpAll(e){ if(!e) return []; if(e._rpa) return e._rpa; const out=[], ck=new Set();
  e.cards.forEach(({p,c})=>{ if(!c.rp) return; const r=rpParse(c.rp,'из конспекта '+BY[p].roman); ck.add(rpKey(r.l[0])); out.push(r); });

const TR_STEMS=[],TR_ANTI=[],TR_CAUSE=[],TR_COMBO=[];

const trLoad=()=>{ try{ return JSON.parse(localStorage.getItem(TR_KEY)||'{}')||{}; }catch(e){ return {}; } };
const trSave=o=>{ try{ localStorage.setItem(TR_KEY, JSON.stringify(o)); }catch(e){} };
const trShuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  {id:'anti', t:'Антидоты', s:'Отравления и передозировки: что ввести и почему', n:()=>TR_ANTI.length, u:'ситуаций'},

function trOpts(ok, pool, n){ const seen=new Set([ok]); const out=[]; trShuf(pool).forEach(x=>{ if(out.length<(n||3) && !seen.has(x)){ seen.add(x); out.push(x); } }); return out; }
function trMk(q, ok, wrong, why){ if(wrong.length<2) return null; const opts=trShuf([ok].concat(wrong)); return {q, opts, ok:opts.indexOf(ok), why}; }
const TRQ={
  stem(){ const s=trPick(TR_STEMS); const groups=TR_STEMS.filter(x=>x[1]!==s[1]).map(x=>x[1]); const t=Math.random();
    const why=`<b>${esc(s[0])}</b> — ${esc(s[1])}: ${s[2].map(trDn).join(', ')}.${s[3]?' '+esc(s[3][0].toUpperCase()+s[3].slice(1))+'.':''}`;
    if(t<.45){ const d=trPick(s[2]); return trMk(`<b>${esc(d)}</b> — к какой группе относится?`, s[1], trOpts(s[1],groups), why); }
    if(t<.7) return trMk(`Окончание <b>${esc(s[0])}</b> — это…`, s[1], trOpts(s[1],groups), why);
    const d=trPick(s[2]); const other=TR_STEMS.filter(x=>x!==s).flatMap(x=>x[2]); return trMk(`Какой препарат относится к группе «${esc(s[1])}»?`, d, trOpts(d,other), why); },
  anti(){ const a=trPick(TR_ANTI); const why=`<b>${esc(a.x)}</b> → ${esc(a.a||a.k)}. ${esc(a.m)}`;
    if(Math.random()<.65){ const bad=new Set([a.k].concat(a.ok||[])); const pool=TR_ANTI.map(x=>x.k).filter(k=>!bad.has(k)); return trMk(`${a.xd&&a.xd.length&&Math.random()<.5?`Передозировка: <b>${esc(trPick(a.xd))}</b> (${esc(a.x.toLowerCase())})`:`Отравление: <b>${esc(a.x)}</b>`}. Что ввести?`, a.k, trOpts(a.k,pool), why); }
    const pool=TR_ANTI.filter(x=>x.k!==a.k && !(x.ok||[]).includes(a.k) && !(a.ok||[]).includes(x.k)).map(x=>x.x); return trMk(`<b>${esc(a.k)}</b> — антидот при…`, a.x, trOpts(a.x,pool), why); },
  cause(){ const c=trPick(TR_CAUSE);

};
function trGen(id, n){ const out=[], keys=new Set(); let guard=0; const ids=id==='mix'?['stem','anti','cause','combo']:[id];
