  {t:'p', html:'<i>Из учебника.</i> Растворы обволакивающих веществ на поверхности тканей, воспалённых участках, язвах образуют защитное мягкое покрытие, предохраняющее ткани и находящиеся в них окончания чувствительных нервов от раздражения. Поэтому обволакивающие средства оказывают местное противовоспалительное и болеутоляющее действие. Они находят применение при воспалительных и язвенных поражениях слизистой оболочки желудка (гастрите, язвенной болезни) и кишечника (энтероколите). Защищая слизистую оболочку ЖКТ от раздражения пищеварительными соками и составными частями пищи, они оказывают противоязвенное и антидиарейное действие. Обволакивающие средства (крахмальную слизь) назначают совместно или непосредственно перед приёмом различных лекарственных препаратов, обладающих раздражающим свойством. Обволакивающие средства назначают часто и продолжительное время (2–3 недели) при отравлениях кислотами, щелочами и едкими жидкостями с целью покрытия воспалённой и изъязвлённой поверхности коллоидной плёнкой. Крахмал (<i>Amylum</i>) в холодной воде нерастворим, в горячей образует коллоидный раствор (<i>Mucilago Amyli</i>). В медицинской практике, кроме крахмальной слизи, используют слизь из семян льна посевного (<i>Semen Lini</i>). Применяют внутрь в виде слизи из льняного семени (<i>Mucilago seminis Lini</i>), которую готовят из 1 части цельного льняного семени и 30 частей горячей воды.'},

K1.blocks.push(
  {t:'h', text:'Раздражающие средства'},
  {t:'p', html:'<b>Раздражающие средства</b> — возбуждают нервные окончания. <i>Из учебника:</i> раздражающие средства прямо стимулируют окончания чувствительных нервов кожи и слизистых оболочек, в результате чего рефлекторно возникает терапевтический эффект в органах и тканях. При непосредственном возбуждении рецепторов кожи и слизистых оболочек возникают импульсы с рецепторов, которые поступают в ЦНС и вызывают реакцию со стороны органов, имеющих иннервацию, сопряжённую в ЦНС с участками, подвергшимися воздействию раздражающих средств. В результате их действия улучшается кровоснабжение органа, его трофика. Основные эффекты раздражающих средств используют для профилактики и лечения различных воспалительных процессов. <i>Местное раздражение</i> проявляется болевыми ощущениями, гиперемией, отёком на месте нанесения препаратов. <i>Рефлекторное действие</i> характеризуется тонизированием дыхательного и сосудодвигательного центров продолговатого мозга.'},

  {t:'flow', title:'Аммиак', rows:[{h:'1. Вдыхание резкого неприятного запаха', s:['остановка дыхания','гиперкапния','раздражение (возбуждение) нейронов ДЦ','рефлекторная стимуляция дыхания','вдох']},{h:'2. Прямое возбуждение ЦНС', s:['т.к. любой запах возбуждает']}]},
  {t:'p', html:'<i>Из учебника.</i> <b>Аммиака раствор 10%</b> (нашатырный спирт) при вдыхании раздражает окончания тройничного нерва в полости носа, афферентные импульсы достигают центра этого нерва, а затем переключаются на дыхательный центр. Раствор аммиака используют при обмороках (надо поднести вату, смоченную раствором аммиака, к носу больного; вдохнув пары аммиака, больной обычно приходит в сознание). При этом следует учитывать, что большие количества паров аммиака могут вызвать и нежелательные рефлексы, например резкое урежение сердечных сокращений, остановку дыхания.'},

  {t:'p', html:'<i>Из учебника.</i> <b>Нейрогуморальное влияние</b> обусловлено резорбтивными эффектами биологически активных веществ, образующихся в зоне раздражения кожи, а также воздействием на головной и спинной мозг потока восходящих афферентных импульсов. При этом изменяется обмен медиаторов головного мозга — освобождаются антиноцицептивные факторы (β-эндорфин, энкефалины), уменьшается выделение медиаторов боли (субстанции P, соматостатина, холецистокинина), возрастает секреция рилизинг-гормонов гипоталамуса, адренокортикотропного и тиреотропного гормонов гипофиза. К веществам этой группы относятся <i>масло камфорное</i>, камфорный спирт (действующее вещество камфора), настойка перца стручкового и другие раздражающие вещества (масла гвоздичное и эвкалиптовое, ментол), входящие в состав «разогревающих» мазей и растираний (бальзам «Золотая звезда», Эфкамон, Меновазин, Никофлекс).'},

  {t:'list', title:'Механизм действия и основные эффекты раздражающих средств', items:[
    '<b>1. Местное действие.</b> Например, при смачивании тёплой водой горчичника фермент горчицы мирозин расщепляет гликозид горчицы синигрин с образованием горчичного эфирного масла, которое оказывает выраженное раздражающее действие. Боль, гиперемия, отёк (увеличение высвобождения гистамина, серотонина, брадикинина, простагландинов, которые, в свою очередь, раздражают нервные окончания и расширяют сосуды). Аксон-рефлекс: возбуждение от ЧНО кожи распространяется по афферентным волокнам к органам и по коллатералям, минуя ЦНС, поступает к сосудам кожи → гиперемия, в том числе прилегающей к области раздражения зоны',
    '<b>2. Рефлекторное действие. 2.1. Трофическое:</b> нервные импульсы от зон раздражения на коже поступают в задние рога нескольких сегментов спинного мозга, затем переключаются на боковые рога этих же сегментов к ядрам преганглионарных волокон СНС → повышается кровоснабжение органов и скелетных мышц, вовлечённых в патологический процесс, улучшается регенерация тканей, уменьшаются воспалительные проявления. Рефлекторное расширение коронарных артерий при раздражении холодовых рецепторов ротовой полости (валидол), расширение поверхностных сосудов глотки и гортани (ментол)',
    '<b>2.2. Обезболивающее — отвлекающее.</b> Механизм тот же. Подавление очага, поддерживающего патологический процесс (гипералгезия, напряжение мышц, спазм сосудов), взаимодействием в ЦНС потока афферентных импульсов с поверхности кожи и поражённых органов. Высвобождение эндорфинов, энкефалинов в ЦНС → уменьшение выделения медиаторов боли (SP, соматостатина, холецистокинина)',
    '<b>2.3. Тонизирующее:</b> рефлекторная стимуляция ДЦ и СДЦ при раздражении ЧНО тройничного нерва в полости носа (аммиак)',
    '<b>3. Нейрогуморальное действие.</b> Резорбтивное действие БАВ, образующихся в зоне раздражения кожи → поток афферентных импульсов из очага раздражения в ЦНС → высвобождение эндорфинов и энкефалинов → снижение восприятия боли, повышение высвобождения либеринов из гипоталамуса, АКТГ, ТТГ из гипофиза, увеличение секреции ГКС и трийодтиронина → противовоспалительный эффект',
    '<b>Применение.</b> Для разогрева мышц в спортивной медицине. Спортивные травмы. Боль в суставах и мышцах, невралгия, неврит, радикулит, ишиас, люмбаго, артрит, тендовагинит, миозит, травмы мышц и связок, нарушение периферического кровообращения, бронхит, пневмония, трахеит (скипидар, горчичники), фарингит и ларингит (ментол, «Каметон»), приступ стенокардии (валидол под язык), обмороки и нетяжёлое угнетение ДЦ (раствор аммиака ингаляционно)']}

function vParse(s){ const o={}; String(s).replace(/([a-z]+)([+-])(\d)/g,(_,k,sg,n)=>{ o[k]=(sg==='-'?-1:1)*(+n); return ''; }); return o; }
function vEntry(name){ const e=VIT[name]; if(!e) return null; if(typeof e==='string') return {v:[['Действие',e]], n:{}}; return {g:e.g, v:e.v, n:e.n||{}, anti:e.anti}; }
function vState(p){
  const s=Object.assign({},p);
  if(s.bp===undefined && (s.vt||s.co||s.ven||s.hr)){ const est=Math.round(0.55*(s.vt||0)+0.35*(s.co||0)+0.25*(s.ven||0)+0.15*(s.hr||0)); if(est) s.bp=Math.max(-3,Math.min(3,est)); }
  return s;
}
const VNUM = {
  hr:  v=>Math.round(72+(v>0?17:11)*v),

  rr:  v=>v<=-3?4:Math.round(16+(v>0?4:3.5)*v),
  pu:  v=>[1.2,2,2.8,3.5,5,6.5,8][v+3],
  tmp: v=>(36.6+0.7*v),
  glu: v=>(5.0+(v>0?1.6:0.9)*v),
  k:   v=>(4.4+0.6*v)
};

/* ---------- ЭКГ ---------- */
function vECG(s){
  const hr=VNUM.hr(s.hr||0), RR=6000/hr; // 100 px = 1 с
  const av=s.av||0, qt=s.qt||0;
  const PR=Math.max(10,16-(av>0?2.5:6)*av), QRS=qt<=-2?11:8, QT=Math.max(30,38+7*Math.max(0,qt)-2*Math.max(0,-qt));
  const n=Math.max(3,Math.ceil(600/RR)); const Win=n*RR; const y0=62;
  let d=`M0,${y0}`; let x=0;
  const beat=(i,x0)=>{ let o=''; const drop = av<=-3 && i%3===2; const ectop = qt>=2 && i%4===3;
    const pS=x0+4;
    o+=` L${pS},${y0} q4,-8 8,0`; // P
    if(drop){ return o; }
    const q=pS+8+(PR-8);
    if(ectop){ o+=` L${q},${y0} l3,6 l6,-40 l6,46 l6,-12 q10,-14 20,0`; return o; }
    o+=` L${q},${y0} l2,4 l${QRS/2-1},-34 l${QRS/2},40 l2,-10`;
    const t0=q+QRS+3, tEnd=q+QT;
    o+=` L${t0+(tEnd-t0)*0.35},${y0} q${(tEnd-t0)*0.3},-14 ${(tEnd-t0)*0.65},0`;
    return o; };
  for(let i=0;i<2*n;i++){ d+=beat(i,i*RR); }
  d+=` L${2*Win+10},${y0}`;
  const dur=(Win/100).toFixed(2);
  return {svg:`<svg class="ecg" viewBox="0 0 600 100" preserveAspectRatio="xMinYMid slice" aria-hidden="true"><defs><pattern id="ecg-g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 L0,0 0,20" class="ecg-grid"/></pattern></defs><rect width="600" height="100" fill="url(#ecg-g)"/><g class="ecg-run" style="--w:-${Win.toFixed(1)}px;--d:${dur}s"><path d="${d}" class="ecg-line"/></g></svg>`, hr};
}

function vSetup(A, nm){
  const $=A.$, $$=A.$$;
  const stage=$('#bdstage'), svg=$('.bd-svg',stage), panel=$('#bdpanel');

    const hits=all.filter(n=>n.toLowerCase().includes(v) || ((A.DRUGS[n]||{}).al||[]).some(a=>a.toLowerCase().includes(v))).slice(0,10);
    res.innerHTML=hits.length?hits.map(n=>`<a href="#body/${encodeURIComponent(n)}">${n}<small>${A.esc(vGroup(A,n))}</small></a>`).join(''):'<div class="none">Нет в модели. Попробуйте досье в базе препаратов.</div>'; });
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const a=$('a',res); if(a){ location.hash=a.getAttribute('href'); } } });
  $('#bdrand').addEventListener('click',()=>{ const k=all[Math.floor(Math.random()*all.length)]; location.hash='#body/'+encodeURIComponent(k); });
  svg.addEventListener('click',e=>{ const g=e.target.closest('.org'); if(g) vOrgan(A,cur,g.dataset.org); });
  svg.addEventListener('keydown',e=>{ const g=e.target.closest('.org'); if(g&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); vOrgan(A,cur,g.dataset.org); } });
  panel.addEventListener('click',e=>{
    const b=e.target.closest('[data-vi]'); if(b){ cur.vi=+b.dataset.vi; antiOn=false; render(); return; }
    const an=e.target.closest('[data-anti]'); if(an){ antiOn=!antiOn; render(); return; }

    const o=e.target.closest('[data-org]'); if(o){ vOrgan(A,cur,o.dataset.org); }
  });
  function render(){
    if(!cur.name){ panel.innerHTML=vEmpty(); apply({}); vPanelLive(A,panel,{}); return; }
    const e=vEntry(cur.name); const v=e.v[Math.min(cur.vi,e.v.length-1)];

    panel.innerHTML=vPanel(A,cur,e,antiOn);

  if(cur.name){ apply({}); requestAnimationFrame(()=>setTimeout(render,260)); } else render();
}
function vGroup(A,n){ const e=VIT[n]; return (e&&e.g) || ((A.DRUGS[n]||{}).g) || ''; }

function vGauges(){ return `<div class="bd-g">${[['hr','ЧСС','уд/мин'],['bp','АД','мм рт. ст.'],['rr','ЧДД','в мин'],['pu','Зрачок','мм'],['tmp','t тела','°C'],['glu','Глюкоза','ммоль/л']].map(([k,l,u])=>`<div class="g-${k}"><small>${l}</small><b data-g="${k}">—</b><span>${u}</span><i class="g-ar"></i></div>`).join('')}</div>`; }
function vPanel(A,cur,e,antiOn){

/* ===== Учить: колода из конспектов, интервальное повторение, тест, дозы ===== */
const L_KEY='atlas-learn-v1', L_PREF='atlas-learn-pref';
const L_INT=[0,1,2,4,8,16]; // дни до следующего показа по коробке
let LST={v:1, items:{}, days:{}};
let LCLOUD={ref:null, state:'local', writing:false, dirty:false, t:0, started:false};
let LDECK=null;
const lToday=()=>{ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5); };
function lLoad(){ try{ const x=JSON.parse(localStorage.getItem(L_KEY)||'null'); if(x&&x.items) LST=x; }catch(e){} if(!LST.days) LST.days={}; }
function lSaveLocal(){ try{ localStorage.setItem(L_KEY, JSON.stringify(LST)); }catch(e){} }
function lSave(){ lSaveLocal(); if(!LCLOUD.ref) return; LCLOUD.dirty=true; clearTimeout(LCLOUD.t); LCLOUD.t=setTimeout(lFlush,1600); }
async function lFlush(){
  if(LCLOUD.writing||!LCLOUD.dirty||!LCLOUD.ref) return;
  LCLOUD.writing=true; LCLOUD.dirty=false;
  try{ await LCLOUD.ref.set(JSON.parse(JSON.stringify(LST))); }
  catch(e){ const c=e&&e.code;
    if(c==='unavailable'||c==='resource_exhausted'){ LCLOUD.dirty=true; setTimeout(lFlush,3000+Math.random()*3000); }
    else { LCLOUD.ref=null; LCLOUD.state='local'; lBadge(); } }
  LCLOUD.writing=false; if(LCLOUD.dirty){ clearTimeout(LCLOUD.t); LCLOUD.t=setTimeout(lFlush,1600); }
}
function lMerge(remote){
  let localNewer=false;
  const r=(remote&&remote.items)||{}; const out={};
  const ids=new Set([...Object.keys(r),...Object.keys(LST.items)]);
  ids.forEach(id=>{ const a=LST.items[id], b=r[id]; if(!a) out[id]=b; else if(!b){ out[id]=a; localNewer=true; } else { if((a[4]||0)>(b[4]||0)){ out[id]=a; localNewer=true; } else out[id]=b; } });
  const days=Object.assign({}, (remote&&remote.days)||{}); Object.entries(LST.days||{}).forEach(([d,n])=>{ if(!days[d]||days[d]<n){ days[d]=n; localNewer=true; } });
  LST={v:1, items:out, days}; return localNewer;
}
async function lCloudInit(){
  if(LCLOUD.started) return; LCLOUD.started=true;
  if(!(window.claude && typeof window.claude.use==='function')) return;
  LCLOUD.state='connecting'; lBadge();
  try{
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db||!user){ LCLOUD.state='local'; lBadge(); return; }
    const uid=await user.id(); if(!uid){ LCLOUD.state='local'; lBadge(); return; }
    const ref=db.doc('data/users/'+uid+'/learn');
    const snap=await ref.get();
    const newer=lMerge(snap.exists?snap.data():null);
    LCLOUD.ref=ref; LCLOUD.state='cloud'; lSaveLocal(); lBadge();
    if(newer||!snap.exists){ LCLOUD.dirty=true; lFlush(); }
    if(typeof LREFRESH==='function') LREFRESH();
  }catch(e){ LCLOUD.ref=null; LCLOUD.state='local'; lBadge(); }
}
function lBadge(){ const b=document.getElementById('lsync'); if(!b) return; const m={cloud:['Прогресс сохраняется в аккаунте','ok'],connecting:['Подключаю сохранение…',''],local:['Прогресс хранится в этом браузере','']}[LCLOUD.state]||['','']; b.textContent=m[0]; b.className='l-sync '+m[1]; }
let LREFRESH=null;
lLoad();

/* ---------- колода ---------- */
const lClean=s=>String(s).replace(/<[^>]+>/g,'').replace(/[*«»"]/g,'').replace(/\s+/g,' ').trim();
const lRank={'':0,g:1,y:2};
function lDeck(A){
  if(LDECK) return LDECK;
  const items=[]; const byPlate={};
  const findIn=(pid,nm)=>(byPlate[pid]||[]).find(it=>A.kSame(nm,it.n)||A.kSame(it.n,nm));
  const add=(p,name,info)=>{ const nm=lClean(name); if(!nm||nm.length<3) return; let it=findIn(p.id,nm);
    if(!it){ it={id:p.id+':'+A.key(nm).replace(/\s+/g,'_'), n:nm, p:p.id, lec:p.roman, title:p.title, hl:'', groups:[], card:null, rx:[]}; (byPlate[p.id]=byPlate[p.id]||[]).push(it); items.push(it); }
    if(info.hl && lRank[info.hl]>lRank[it.hl]) it.hl=info.hl;
    if(info.group && !it.groups.includes(info.group)) it.groups.push(info.group);
    if(info.card && !it.card) it.card=info.card;
    if(info.rx) it.rx.push(info.rx);
  };
  KP.forEach(p=>p.blocks.forEach(b=>{
    if(b.t==='tree'){ const walk=(nd,path)=>{ const here=lClean(nd.n||''); const pth=here?path.concat(here):path;
        (nd.d||[]).forEach(x=>{ const [nm,hl]=String(x).split('|'); const g=pth.slice(-2).join(' → '); add(p,nm,{hl:hl||'',group:g}); });
        (nd.k||[]).forEach(c=>walk(c,pth)); };
      walk({n:b.n||b.title,d:b.d,k:b.k},[]); }
    if(b.t==='cards') b.items.forEach(c=>add(p,c.n,{card:c,hl:c.hl||''}));
    if(b.t==='table' && b.idx && /выписыв/i.test(b.title||'')){ b.rows.forEach(r=>{ const nm=String(r[0]).split('<br>')[0]; const mark=r.some(c=>/<mark>/.test(c)); const L=r.length;
      add(p,nm,{hl:mark?'y':'', rx:{tn:lClean(r[1]||''), form:lClean(r[L>=5?3:2]||''), dose:lClean(r[L-1]||''), ind:L>=5?lClean(r[2]):'', mark}}); }); }
  }));
  items.forEach(it=>{ it.d=A.kFindDrug(it.n); it.hasBody = typeof VIT!=='undefined' && !!(VIT[it.n] || (it.d && VIT[it.d.n])); });
  LDECK=items; return items;
}
function lPrefs(){ try{ return Object.assign({lec:[], set:'all', mode:'cards', dir:'fwd', nnew:15}, JSON.parse(localStorage.getItem(L_PREF)||'{}')); }catch(e){ return {lec:[], set:'all', mode:'cards', dir:'fwd', nnew:15}; } }
function lPrefSave(pr){ try{ localStorage.setItem(L_PREF, JSON.stringify(pr)); }catch(e){} }
function lPool(items,pr){ return items.filter(it=>(!pr.lec.length||pr.lec.includes(it.p)) && (pr.set==='all' || (pr.set==='y'?it.hl==='y':it.hl))); }
const lRec=id=>LST.items[id]||[0,0,0,0,0];
function lRate(id,grade){ // 0 — не помню, 1 — с трудом, 2 — помню
  const r=lRec(id).slice(); const today=lToday();
  if(grade===0){ r[0]=1; r[1]=today; r[3]=(r[3]||0)+1; }
  else if(grade===1){ r[0]=Math.max(1,r[0]); r[1]=today+1; }
  else { r[0]=Math.min(5,r[0]+1); r[1]=today+L_INT[r[0]]; }
  r[2]=(r[2]||0)+1; r[4]=Date.now(); LST.items[id]=r;
  LST.days[today]=(LST.days[today]||0)+1; lSave();
}
function lDueCount(A){ const items=lDeck(A); const t=lToday(); let n=0; items.forEach(it=>{ const r=lRec(it.id); if(r[0]&&r[1]<=t) n++; const x=lRec('rx:'+it.id); if(x[0]&&x[1]<=t) n++; }); return n; }
function lStreak(){ const t=lToday(); let n=0, d=LST.days[t]?t:t-1; while(LST.days[d]){ n++; d--; } return n; }

function lQueue(st,rx){
  const t=lToday(); let pool=lPool(st.items,st.pr);

/* ---------- тест ---------- */
function lShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* похожие формулировки: совпадение значимых основ слов (чтобы дистрактор не оказался тоже верным) */
const lStems=t=>[...new Set(String(t).toLowerCase().replace(/<[^>]+>/g,'').split(/[^a-zа-яё0-9]+/i).filter(w=>w.length>=5).map(w=>w.slice(0,6)))];

/* ---------- конфетти ---------- */

  for(let i=0;i<46;i++){ const s=document.createElement('i'); s.style.left=(Math.random()*100)+'%'; s.style.background=cols[i%cols.length]; s.style.setProperty('--dx',(Math.random()*160-80)+'px'); s.style.setProperty('--r',(Math.random()*720-360)+'deg'); s.style.animationDelay=(Math.random()*0.35)+'s'; w.appendChild(s); }
  host.appendChild(w); setTimeout(()=>w.remove(),2600);
}

/* ===== Анимации и «фишки»: живые схемы, подсветка цепочек, появление при прокрутке, горячие клавиши, тема ===== */
const FX = (function(){
  const RM = ()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_KEY='atlas-theme';
  const qs=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>Array.from(r.querySelectorAll(s));

  /* ---------- тема ---------- */
  function themeGet(){ try{ return localStorage.getItem(T_KEY)||'auto'; }catch(e){ return 'auto'; } }
  function themeSet(t){ try{ localStorage.setItem(T_KEY,t); }catch(e){} themeApply(t); }
  function themeApply(t){ const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
    qa('.fx-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===t))); }

  function watch(el,fn){ if(!io){ fn(el); return; } cb.set(el,fn); io.observe(el); }

  /* ---------- появление блоков ---------- */
  function reveal(root){
    if(RM()||!io) return;
    const H=innerHeight;
    qa('.kc,.fig,.pcard,.tblw,.klist,.kwarn,.dbrow,.module,.bd-card,.l-bar',root).forEach((el,i)=>{
      if(el.closest('.dz')||el.classList.contains('rv')) return;
      const r=el.getBoundingClientRect(); if(r.top<H-20) return;
      el.classList.add('rv'); watch(el,x=>{ x.classList.add('in'); setTimeout(()=>x.classList.remove('rv','in'),700); });
    });
  }
  /* цепочки «причина → следствие» разворачиваются по звеньям */
  function chains(root){
    if(RM()) return;
    qa('.cf',root).forEach(cf=>{ if(cf._fx) return; cf._fx=1; Array.from(cf.children).forEach((c,i)=>c.style.setProperty('--i',i)); cf.classList.add('fx-cf'); watch(cf,x=>x.classList.add('in')); });

    o+=Z(W-14,98+oy,'Внеклеточно','end')+Z(W-14,170+oy,'Цитоплазма','end'); }
  b.targets.forEach((t,i)=>{

    else if(t.kind==='gpcr'){ let d=`M${x-33},${Y(150)}`, up=true; for(let k=0;k<7;k++){ d+= up?` V${Y(108)}`:` V${Y(152)}`; if(k<6) d+=' h11'; up=!up; } g=`<path class="s-serp" d="${d}"/><ellipse class="s-prot2" cx="${x}" cy="${Y(176)}" rx="18" ry="11"/>`+T(x,Y(180),'G','t-small'); }

/* ---------- подсветка ---------- */
function highlight(fig, sites, act, badge=true){
  const svg=$('svg',fig), layer=$('.hl',svg); layer.innerHTML='';
  $$('.site.on',svg).forEach(e=>e.classList.remove('on'));
  const sym={stim:'+',block:'⊣',mod:'~'}[act];
  sites.forEach(s=>$$(`.site[data-site="${s}"]`,svg).forEach(el=>{
    el.classList.add('on'); const d=el.dataset, x=+d.cx, y=+d.cy; let bx,by;
    if(d.w){ const w=+d.w,h=+d.h; layer.insertAdjacentHTML('beforeend',`<rect class="ring ${act}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="10"/>`); bx=x+w/2-14; by=y-h/2; }
    else { const r=+d.r; layer.insertAdjacentHTML('beforeend',`<circle class="ring ${act}" cx="${x}" cy="${y}" r="${r}"/>`); bx=x+r*.72; by=y-r*.72; }
    if(badge) layer.insertAdjacentHTML('beforeend',`<circle class="badge-c ${act}" cx="${bx}" cy="${by}" r="10"/><text class="badge-t" x="${bx}" y="${by+4.2}" text-anchor="middle">${sym}</text>`);
  }));
}
function siteLabel(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s?plain(s.l):k; }
function siteInfo(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s; }
function activateChip(fig,b,i){
  const c=b.chips[i]; const sites=[].concat(c.s);
  $$('.chip',fig).forEach(x=>x.setAttribute('aria-pressed', x.dataset.i==String(i)?'true':'false'));
  highlight(fig,sites,c.a);
  const where=[...new Set(sites.map(s=>siteLabel(b,s)))].join(', ');
  $('.info',fig).innerHTML=`<h4>${c.d} <span class="act ${c.a}">${ACT[c.a]}</span></h4><p>${c.x}</p><p style="margin-top:6px;font-size:13px;color:var(--ink-3)">Точка действия на схеме: ${where}</p>`+(findDrug(c.d)?`<div class="also"><button type="button" class="btn" data-dr="${esc(findDrug(c.d).n)}">Досье: системы, показания, побочные эффекты →</button></div>`:'');
}
function activateSite(fig,b,k){
  const s=siteInfo(b,k); if(!s) return;
  $$('.chip',fig).forEach(x=>x.setAttribute('aria-pressed','false'));
  highlight(fig,[k],'stim',false);
  const users=b.chips.map((c,i)=>[c,i]).filter(([c])=>[].concat(c.s).includes(k));
  $('.info',fig).innerHTML=`<h4>${s.l}</h4><p>${s.f||''}</p>`+(users.length?`<div class="also">${users.map(([c,i])=>`<button type="button" class="chip ${c.a}" data-go="${i}">${c.d}</button>`).join('')}</div>`:'');
}

let figs = {};

function figBlock(b,p,no){

}

function renderSteps(steps){
  return steps.map(s=>{
    if(s.split) return `<div class="rx-split" style="--cols:${s.split.length}">${s.split.map((br,i)=>`<div class="rx-branch">${s.labels?`<div class="rx-blab">${s.labels[i]}</div>`:''}<div class="rx-chain">${renderSteps(br)}</div></div>`).join('')}</div>`;
    if(s.n!==undefined) return `<div class="rx-node ${s.tag?'is-'+s.tag:''}"><span class="rx-n">${s.n}</span>${s.s?`<span class="rx-s">${s.s}</span>`:''}${s.prod?`<dl class="rx-prod">${s.prod.map(([a,d])=>`<dt>${a}</dt><dd>${d}</dd>`).join('')}</dl>`:''}</div>`;
    const mods=(s.inh||[]).map(d=>`<span class="tag inh">⊣ ${d}</span>`).join('')+(s.act||[]).map(d=>`<span class="tag ac">+ ${d}</span>`).join('');
    return `<div class="rx-arr"><div class="rx-line"></div><div class="rx-txt">${s.e?`<span class="rx-e">${s.e}</span>`:''}${s.c?` <span class="rx-c">${s.c}</span>`:''}${s.note?`<div class="rx-note">${s.note}</div>`:''}${mods?`<div>${mods}</div>`:''}</div></div>`;
  }).join('');
}

const GF = {b:'gt', d:'gt-d', h:'gt-h', s:'gt-s', z:'t-zone', l:'gl'};

function tw(t,cls){ const k=cls+'|'+t; if(_mcache.has(k)) return _mcache.get(k);
  if(!_ms){ _ms=document.createElementNS('http://www.w3.org/2000/svg','svg'); _ms.setAttribute('aria-hidden','true'); _ms.style.cssText='position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden'; _mt=document.createElementNS('http://www.w3.org/2000/svg','text'); _ms.appendChild(_mt); document.body.appendChild(_ms); }

function drugOfDay(){ const L=UPOOL(); if(!L.length) return null; const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5); return L[(Math.imul(day,2654435761)>>>0)%L.length]; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-rand]'); if(!t) return; const L=UPOOL(); const d=L[Math.floor(Math.random()*L.length)]; openDossier(d.n,t); });

  ${lockBanner()}<div class="howto"><div><b>Нажмите на препарат</b>Под каждой схемой — список препаратов. Кольцо на рисунке покажет, где именно он действует.</div><div><b>Нажмите на элемент схемы</b>Рецептор, фермент или транспортёр расскажет, что он делает и какие препараты на него влияют.</div><div><b>Найдите препарат</b>Поиск в боковой панели ведёт к схеме или карточке группы на нужном листе.</div></div>
  ${HASV?`<div class="hero-ecg" aria-hidden="true">${vECG({}).svg.replace('xMinYMid slice','none')}</div>`:''}

  <div class="cta2">${HASV?`<a class="cta-b" href="#body"><span class="cta-ic cta-heart" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 40C11 31 6 24 6 17c0-6 4.6-10 10-10 3.8 0 6.6 2 8 5 1.4-3 4.2-5 8-5 5.4 0 10 4 10 10 0 7-5 14-18 23z"/><path class="cta-pulse" d="M8 24h8l3-6 4 12 4-9 2 3h11"/></svg></span><span><b>Организм</b>Выберите препарат — анимированная схема тела покажет, что происходит с сердцем и ЭКГ, сосудами и давлением, зрачком, бронхами, ЖКТ, железами и ЦНС. Дозовые режимы, отравления и антидоты.</span><span class="go" aria-hidden="true">→</span></a>`:''}${typeof lDeck==='function'?(()=>{ const dn=lDueCount(A), tot=lDeck(A).length; return `<a class="cta-b" href="#learn"><span class="cta-ic cta-cards" aria-hidden="true"><i></i><i></i><i></i></span><span><b>Учить препараты</b>${tot} ${plur(tot,'препарат','препарата','препаратов')} из конспектов: карточки с интервальным повторением, тест в формулировках зачёта, тренажёр доз и рецептов.${dn?` <em class="due">Сегодня к повторению: ${dn}</em>`:''}</span><span class="go" aria-hidden="true">→</span></a>`; })():''}</div>
  ${(()=>{ const dd=drugOfDay(); if(!dd) return ''; const g=dd.groups[0]; return `<div class="dday"><div><p class="eyebrow">Препарат дня${uKLecs(dd).length?' · конспект '+uKLecs(dd).map(p=>p.roman).join(', '):''}</p><h3>${dd.n}</h3><p>${g?g.g:(dd.d?dd.d.g:'')}</p>${dd.hl?`<p class="u-hl">${uHlBadge(dd.hl)}</p>`:''}</div><div class="dday-a"><button type="button" class="btn pri" data-dr="${esc(dd.n)}">Открыть карточку →</button><button type="button" class="btn" data-rand="1">Случайный препарат</button></div></div>`; })()}
  <div class="legend"><span class="chip stim">стимулирует, агонист</span><span class="chip block">блокирует, ингибирует</span><span class="chip mod">модулирует, смешанное действие</span><span><span class="rx-e">Фермент</span> — оранжевым моноширинным</span></div></section>
  ${MODULES.map(m=>`<section class="module${m.id==='kon'?' module-k':''}"><h2>${m.t}</h2>${m.id==='kon'?'<p class="par">Схемы, классификации и формулировки из ваших лекций — так, как спрашивают на зачётах. Препараты кликабельны: ведут к карточке конспекта или к подробному досье.</p><p class="par"><span class="kd hl-y">Жёлтый фон</span> — знать наизусть дозировку, сигнатуру, классификацию, показания и побочные эффекты, выписать рецепт. <span class="kd hl-g">Зелёный фон</span> — выписать рецепт. Рамка «Возможные формулировки» — так препарат могут описать на микроконтрольной и в ЗКР.</p>':''}<div class="plist">${P.filter(p=>p.mod===m.id).map(p=>`<a class="pcard${p.locked?' is-locked':''}" href="#${p.id}"><span class="num">${p.roman}</span><b>${p.title}</b><span>${p.sum}</span>${p.locked?`<em class="lock-tag">${LOCK_ICO}После входа</em>`:''}</a>`).join('')}</div></section>`).join('')}
  <section class="tblw" style="margin-top:48px"><div class="rx-head"><h2 class="sec" style="margin:0">Антидоты семестра</h2></div><div class="tbl"><table><thead><tr><th scope="col">Отравление</th><th scope="col">Антидот</th><th scope="col">Механизм</th><th scope="col">Лист</th></tr></thead><tbody>${ANTIDOTES.map(r=>`<tr><td>${r[0]}</td><td style="color:var(--ink)">${r[1]}</td><td>${r[2]}</td><td><a href="#${P.find(p=>p.roman===r[3]).id}">${r[3]}</a></td></tr>`).join('')}</tbody></table></div></section>
  <p class="note">Материал для подготовки к занятиям. Дозы и показания сверяйте с инструкциями к препаратам и действующими клиническими рекомендациями.</p>`;
}

/* ---------- досье ---------- */
const dz=$('#dz'), dzBody=$('#dzBody'), dzBack=$('.dz-back'); let dzStack=[], dzOpener=null;
function flow(str){ const parts=String(str).split(' → '); if(parts.length<2) return `<p class="cf1">${str}</p>`; return `<div class="cf">${parts.map((x,i)=>i===parts.length-1?`<b>${x}</b>`:`<span>${x}</span><i aria-hidden="true">→</i>`).join('')}</div>`; }
function plateHasChip(pid,n){ const k=first(n); return BY[pid].blocks.some(b=>(b.chips||[]).some(c=>first(c.d)===k)); }
function dossierHTML(d){
  const P0=BY[d.p], pr=d.like?DRUGS[d.like]:null;
  const m=d.m||(pr&&pr.m)||[], s=d.s||(pr&&pr.s)||{}, sk=Object.keys(s);
  const viaM=pr&&!d.m, viaS=pr&&!d.s, chip=plateHasChip(d.p,d.n);
  const kc = findCard(d.n) || (d.al||[]).map(findCard).find(Boolean);
  const head = `<header class="dz-h"><p class="eyebrow">Лист <span class="roman">${P0.roman}</span> · ${P0.title}</p><h2 id="dz-title">${d.n}</h2><p class="dz-g">${d.g}</p><span class="dz-t">${d.t}</span>${d.al&&d.al.length?`<p class="dz-al">Другие названия: ${d.al.join(', ')}</p>`:''}
  <div class="dz-act"><button type="button" class="btn pri" data-goplate="${d.p}" data-n="${esc(d.n)}">${chip?'Показать на схеме':(location.hash.slice(1)===d.p?'Найти на листе':'Открыть лист '+P0.roman)}</button>${kc?`<button type="button" class="btn" data-goplate="${kc.p}" data-n="${esc(kc.n)}" data-k="1">Формулировки конспекта ${BY[kc.p].roman} →</button>`:''}${bodyName(d.n)?`<a class="btn" href="#body/${encodeURIComponent(bodyName(d.n))}">Как действует на организм →</a>`:''}</div></header>`;
  const likeBox = pr?`<div class="like"><p><b>Аналог препарата <button type="button" class="tlink" data-dr="${esc(pr.n)}">${pr.n}</button>.</b> Механизм и влияние на системы — как у прототипа${d.d?', отличия:':'.'}</p>${d.d?`<p>${d.d}</p>`:''}</div>`:'';
  const mech = `<section class="dz-sec"><h3>Молекулярный механизм${viaM?' · как у '+pr.n:''}</h3><ol class="mstep">${m.map(x=>`<li>${x}</li>`).join('')}</ol></section>`;
  const sys = sk.length?`<section class="dz-sec"><h3>Влияние на системы: причина → следствие${viaS?' · как у '+pr.n:''}</h3>${sk.map(k=>`<div class="sys"><h4>${k}</h4><div>${s[k].map(flow).join('')}</div></div>`).join('')}</section>`:'';
  const own = `<section class="dz-sec"><h3>Показания — когда и зачем</h3><ul class="dl2 ind">${(d.i||[]).map(([w,y])=>`<li><b>${w}</b>${y?`<span class="why"><em>зачем</em>${y}</span>`:''}</li>`).join('')}</ul></section>
  <section class="dz-sec"><h3>Побочные эффекты — что и почему</h3><ul class="dl2 ae">${(d.a||[]).map(([w,y])=>`<li><b>${w}</b>${y?`<span class="why"><em>почему</em>${y}</span>`:''}</li>`).join('')}</ul></section>
  ${d.c?`<section class="dz-sec"><h3>Противопоказания</h3><p class="dz-p">${d.c}</p></section>`:''}
  ${d.x?`<section class="dz-sec"><h3>Важно</h3><p class="dz-p">${d.x}</p></section>`:''}`;
  return head + (pr && viaS ? likeBox + own + `<details class="inh" open><summary>Механизм и влияние на системы — как у прототипа: ${pr.n}</summary>${mech}${sys}</details>` : likeBox + mech + sys + own);
}
function openDossier(name, opener, push){
  const e=uFind(name); if(!e) return;
  if(dz.hidden){ dzStack=[]; dzOpener=opener||document.activeElement; }
  if(push!==false && dzStack[dzStack.length-1]!==e.n) dzStack.push(e.n);
  dzBody.innerHTML=uCardHTML(e);
  dzBack.hidden=dzStack.length<2;
  dz.hidden=false; document.documentElement.classList.add('dz-open');
  const panel=$('.dz-panel'); panel.scrollTop=0; panel.focus({preventScroll:true});
  if(typeof FX!=='undefined') FX.dossier();
}
function closeDz(silent){
  if(dz.hidden) return; dz.hidden=true; document.documentElement.classList.remove('dz-open'); dzStack=[];
  if(!silent && dzOpener && document.contains(dzOpener)) dzOpener.focus({preventScroll:true});
}
dz.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ closeDz(); return; }
  if(e.target.closest('.dz-back')){ dzStack.pop(); openDossier(dzStack[dzStack.length-1],null,false); return; }
  const go=e.target.closest('[data-goplate]'); if(go){ const pid=go.dataset.goplate; pending={n:go.dataset.n,kind:go.dataset.k?'k':'d'}; closeDz(true); if(location.hash.slice(1)===pid) requestAnimationFrame(focusPending); else location.hash=pid; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !dz.hidden) closeDz(); });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-dr]'); if(t){ e.preventDefault(); openDossier(t.dataset.dr,t); } });
/* ссылка «к карточке конспекта» из Организма и Учить */
document.addEventListener('click',e=>{ const t=e.target.closest('a[data-kgo]'); if(!t) return; const pid=(t.getAttribute('href')||'').slice(1); if(!BY[pid]) return; pending={n:t.dataset.kgo,kind:'k'}; if(!dz.hidden) closeDz(true); if(location.hash.slice(1)===pid){ e.preventDefault(); requestAnimationFrame(focusPending); } });

/* ---------- страница базы ---------- */
const SYSC=[['Нервная система',/ЦНС|Нервная|Противорвот/],['Сердце и сосуды',/Сердце|ССС|Сосуд/],['Дыхание',/Дыхан|Лёгк|нос/],['ЖКТ',/ЖКТ|Слюн|Поджелуд/],['Почки и мочевыделение',/Почк|Мочевыд|Водный|Моча/],['Глаз',/Глаз/],['Мышцы',/[Мм]ышц/],['Обмен и эндокринная',/Обмен|Эндокрин|Щитовид|Паращитовид|Надпочеч|Кост/],['Кровь',/Кровь/],['Печень',/Печень/],['Кожа и терморегуляция',/Кожа|Терморег/],['Репродукция и плод',/Плод|Половая|Матка/],['Вегетативные эффекты',/Периферия|Вегетатив|Железы/]];
const canon=nm=>{ const f=SYSC.find(([,r])=>r.test(nm)); return f?f[0]:'Другое'; };
const drugSys=d=>{ const s=d.s||(d.like&&DRUGS[d.like]&&DRUGS[d.like].s)||{}; return new Set(Object.keys(s).map(canon)); };
const dbState={q:'',p:'',sys:''};
const SUB='₀₁₂₃₄₅₆₇₈₉';
const norm=x=>key(x).replace(/[₀-₉]/g,c=>String(SUB.indexOf(c))).replace(/альфа[- ]?/g,'α').replace(/бета[- ]?/g,'β').replace(/гамма[- ]?/g,'γ').replace(/\bb(?=\d|\b)/g,'β').replace(/\ba(?=\d)/g,'α').replace(/[⁺⁻]/g,'');
function renderDB(){
  figs={};
  const lecs=P.filter(isK);
  $('#page').innerHTML=`<header><p class="eyebrow">Все препараты · ${UNI.length}</p><h1 class="title">Все препараты</h1><p class="lead">Каждый препарат из конспектов и подробных листов. Нажмите на название — откроется одна карточка: дозировка и форма выпуска, зачем выписывают, побочные эффекты, противопоказания, формулировки и действие на организм.</p></header>
  <div class="dbf"><label for="dbq">Поиск<input id="dbq" type="search" placeholder="Название или группа: атропин, β₂, статины" value="${esc(dbState.q)}" autocomplete="off"></label><label for="dbp">Лекция<select id="dbp"><option value="">Все лекции</option>${lecs.map(p=>`<option value="${p.id}"${dbState.p===p.id?' selected':''}>${p.roman} · ${p.title}</option>`).join('')}<option value="_ext"${dbState.p==='_ext'?' selected':''}>Только в подробных листах</option></select></label></div>
  <div class="seg dbset" role="group" aria-label="Набор"><button type="button" data-set="" aria-pressed="${!dbState.sys}">Все</button><button type="button" data-set="yg" aria-pressed="${dbState.sys==='yg'}">Жёлтые и зелёные</button><button type="button" data-set="y" aria-pressed="${dbState.sys==='y'}">Только жёлтые</button></div>
  <p class="dbn" aria-live="polite"></p><div class="dbl"></div>`;
  const draw=()=>{
    const v=norm(dbState.q);
    const list=UNI.filter(e=>{ if(dbState.p==='_ext'){ if(uKLecs(e).length) return false; } else if(dbState.p && !e.ps.has(dbState.p)) return false;
      if(dbState.sys==='y' && e.hl!=='y') return false; if(dbState.sys==='yg' && !e.hl) return false;
      if(!v) return true; return [e.n,...e.names,...e.groups.map(g=>g.g),e.d?e.d.g:'',e.d?e.d.t:''].some(x=>norm(x).includes(v)); });
    $('.dbn').textContent=list.length?`Найдено: ${list.length} из ${UNI.length}`:'Ничего не найдено — измените запрос или фильтры.';
    const groups={}; list.forEach(e=>{ const L=e.n[0].toUpperCase(); (groups[L]=groups[L]||[]).push(e); });
    $('.dbl').innerHTML=Object.keys(groups).map(L=>`<section><h3 class="letter">${L}</h3>${groups[L].map(e=>{ const g=e.groups[0]; const kl=uKLecs(e).map(p=>p.roman).join(', ');
      return `<button type="button" class="dbrow${e.hl?' hl-'+e.hl:''}" data-dr="${esc(e.n)}"><b>${e.n}</b><span>${g?g.g:(e.d?e.d.g:'')}</span><small>${kl?'Конспект '+kl:(e.d?'Лист '+BY[e.d.p].roman:'')}${e.rx.length||e.x?' · доза':''}</small></button>`; }).join('')}</section>`).join('');
  };
  $('#dbq').addEventListener('input',e=>{ dbState.q=e.target.value; draw(); });
  $('#dbp').addEventListener('change',e=>{ dbState.p=e.target.value; draw(); });
  $('.dbset').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; dbState.sys=b.dataset.set; $$('.dbset button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); draw(); });
  draw();
}

/* ---------- маршрутизация ---------- */
const A = {$, $$, esc, plain, key, first, findDrug, kFindDrug, kSame, findCard, openDossier, BY, P, DLIST, DRUGS, canon, flow, isK, plab, bodyName, plur, uFind, uCardHTML, uLearnHTML, uDoseHTML, UNI};
window.__A = A;
function route(){
  let id=location.hash.slice(1); try{ id=decodeURIComponent(id); }catch(e){}
  const parts=id.split('/'), base=parts[0], arg=parts.slice(1).join('/');
  const p=BY[id]; document.onkeydown=null;
  let kind='home';
  if(typeof EXTRA!=='undefined' && EXTRA.routes[base]){ figs={}; EXTRA.routes[base](A,arg); setCurrent(base); kind=base; }
  else { if(id==='drugs'){ renderDB(); kind='drugs'; } else if(p){ renderPlate(p); kind='plate'; } else renderHome(); setCurrent(p?p.id:(id==='drugs'?'drugs':'')); }
  if(kind==='home'){ const c=$('[data-count]'); if(c&&typeof FX!=='undefined') FX.count(c,+c.dataset.count); }
  if(!pendingDossier) closeDz(true);
  if(pending) requestAnimationFrame(focusPending); else window.scrollTo(0,0);
  if(pendingDossier){ const n=pendingDossier; pendingDossier=null; openDossier(n); }
  if(typeof FX!=='undefined') FX.page(kind);
  const due=$('#nav .due'); if(due && typeof lDueCount==='function'){ const n=lDueCount(A); due.textContent=n; due.hidden=!n; }
}
window.addEventListener('hashchange',route);
const start=()=>{ buildNav(); if(typeof FX!=='undefined') FX.shell(); route(); };
if(document.fonts && document.fonts.status!=='loaded'){ let done=false; const go=()=>{ if(!done){ done=true; start(); } }; document.fonts.ready.then(()=>{ if(done){ _mcache.clear(); fitTrees(); if($('.kgraph') && dz.hidden){ const y=scrollY; route(); scrollTo(0,y); } } else go(); }); setTimeout(go,1800); } else start();
})();
