<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Атлас фармакологии</title>
<meta name="description" content="Интерактивный атлас по фармакологии: конспекты лекций схемами, карточки препаратов (доза, показания, побочные эффекты), анимированная схема организма и тренажёр для заучивания.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: atlas — a plate index rail on the left, one plate (лист) at a time on the right; figures are numbered plates with legends below */
:root{
  --paper:#F1F3F8; --sheet:#FFFFFF; --ink:#151A32; --ink-2:#454B69; --ink-3:#747A96;
  --rule:#D7DBE7; --rule-2:#E6E9F1;
  --hema:#3836B0; --hema-soft:#E7E7FA;      /* гематоксилин: стимуляция, агонисты */
  --eosin:#C42F63; --eosin-soft:#FBE6EE;    /* эозин: блок, ингибирование, токсичность */
  --iodine:#9A5F0C; --iodine-soft:#F9EEDA;  /* йод: ферменты, модуляция */
  --pre:#E5E8F6; --post:#ECEEF4;
  --hl-y:#FCEB9B; --hl-g:#C9EFC4; --hl-b:#CDE7FA; --hl-p:#F8D3E4; --hl-ink:#1B1B1B; --k-rp:#8DD5C6; --k-fm:#EBA2C6;
  --f-display:"Spectral","PT Serif",Georgia,serif;
  --f-body:"Golos Text","PT Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1020; --sheet:#151A2E; --ink:#E6E8F4; --ink-2:#B2B7D2; --ink-3:#8389A6;
    --rule:#2B3152; --rule-2:#222843;
    --hema:#9C9AFF; --hema-soft:#24264A; --eosin:#FF7FA8; --eosin-soft:#3B1C2C;
    --iodine:#E8B65A; --iodine-soft:#33291A; --pre:#1E2442; --post:#191E36;
    --hl-y:#5C4B0E; --hl-g:#1D4A23; --hl-b:#17394F; --hl-p:#4F1C36; --hl-ink:#F3F3F3; --k-rp:#2F7E70; --k-fm:#9A4A72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1020; --sheet:#151A2E; --ink:#E6E8F4; --ink-2:#B2B7D2; --ink-3:#8389A6;
  --rule:#2B3152; --rule-2:#222843;
  --hema:#9C9AFF; --hema-soft:#24264A; --eosin:#FF7FA8; --eosin-soft:#3B1C2C;
  --iodine:#E8B65A; --iodine-soft:#33291A; --pre:#1E2442; --post:#191E36;
  --hl-y:#5C4B0E; --hl-g:#1D4A23; --hl-b:#17394F; --hl-p:#4F1C36; --hl-ink:#F3F3F3; --k-rp:#2F7E70; --k-fm:#9A4A72;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--hema)}
button{font:inherit;color:inherit}
sub,sup{line-height:0}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--sheet);border-right:1px solid var(--rule);padding:24px 18px 48px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1;letter-spacing:-.005em}
.brand span{font-size:12.5px;color:var(--ink-3)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink)}
.search input:focus{outline:2px solid var(--hema);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.results{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.results button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--hema-soft);outline:none}
.results b{font-weight:600;font-size:14.5px}
.results small{font-size:12px;color:var(--ink-3)}
.results .none{font-size:13px;color:var(--ink-3);padding:6px 10px}
.nav{display:flex;flex-direction:column;gap:18px}
.nav h6{margin:0 0 6px;font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-left:10px}
.nav a{display:grid;grid-template-columns:34px 1fr;align-items:baseline;gap:4px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:14.5px;line-height:1.3}
.nav a .n{font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:14px}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--hema-soft);color:var(--ink)}
.nav a[aria-current="page"] .n{color:var(--hema)}
.nav a:focus-visible{outline:2px solid var(--hema);outline-offset:-2px}

.mbar{display:none}
.scrim{display:none}

.main{min-width:0;padding-inline:clamp(16px,4.5vw,64px);padding-block:36px 96px}
.page{max-width:1020px}

@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);padding:10px 16px}
  .mbar a{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--ink);text-decoration:none}
  .mbar button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  .rail{position:fixed;z-index:40;top:0;left:0;bottom:0;height:auto;width:min(88vw,330px);transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--rule)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:30;background:#0b0e1c66}
  .main{padding-block:24px 72px}
}

/* ---------- typography ---------- */
.eyebrow{font:600 11.5px/1.3 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0}
.eyebrow .roman{color:var(--hema)}
h1.title{font-family:var(--f-display);font-weight:600;font-size:clamp(29px,4.4vw,48px);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;line-height:1.06;letter-spacing:-.012em;text-wrap:balance;margin:.22em 0 .38em}
.lead{font-size:18px;line-height:1.55;color:var(--ink-2);max-width:68ch;margin:0}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;letter-spacing:-.005em;margin:56px 0 4px;text-wrap:balance}
h3.blk{font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.blk-no{font:500 12px/1 var(--f-mono);color:var(--hema);letter-spacing:.02em}
p.par{max-width:70ch;color:var(--ink-2);margin:12px 0}

/* ---------- figures ---------- */
.fig{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;margin:26px 0;overflow:hidden}
.fig-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:16px 20px 0}
.fig-scroll{overflow-x:auto;padding:6px 8px 2px;-webkit-overflow-scrolling:touch}
.fig-scroll svg{display:block;width:100%;height:auto}
.fig-cap{font-size:13px;color:var(--ink-3);padding:0 20px 12px;max-width:80ch}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 20px;border-top:1px solid var(--rule-2)}
.chips .lab{flex-basis:100%;font:600 11px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.chip{--c:var(--ink-3);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;line-height:1;padding:7px 11px 7px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip.stim{--c:var(--hema)} .chip.block{--c:var(--eosin)} .chip.mod{--c:var(--iodine)}
.chip:hover{border-color:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--c)}
.chip:focus-visible,.seg button:focus-visible,.rbtn:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.info{padding:14px 20px 18px;border-top:1px solid var(--rule-2);min-height:92px}
.info .hint{color:var(--ink-3);font-size:14px;margin:0}
.info h4{margin:0 0 4px;font-size:16px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.info p{margin:0;font-size:14.5px;max-width:78ch;color:var(--ink-2)}
.info .also{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.act{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.act.stim{background:var(--hema-soft);color:var(--hema)} .act.block{background:var(--eosin-soft);color:var(--eosin)} .act.mod{background:var(--iodine-soft);color:var(--iodine)}

/* svg anatomy */
.s-pre{fill:var(--pre);stroke:var(--ink-3);stroke-width:2.4}
.s-post{fill:var(--post)}
.s-memb{stroke:var(--ink-3);stroke-width:2.4;fill:none}
.s-gap{stroke:var(--sheet);stroke-width:5}
.s-ves{fill:var(--sheet);stroke:var(--hema);stroke-width:1.6}
.s-nt{fill:var(--hema)}
.s-prot{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.s-prot2{fill:var(--hema-soft);stroke:var(--ink-2);stroke-width:1.4}
.s-pocket{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.s-pore{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:3 3}
.s-enz{fill:var(--iodine-soft);stroke:var(--iodine);stroke-width:1.4}
.s-mito{fill:var(--iodine-soft);stroke:var(--iodine);stroke-width:1.4}
.s-cris{fill:none;stroke:var(--iodine);stroke-width:1.1;opacity:.6}
.s-arr{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.s-arr-h{fill:var(--ink-2)}
.s-tbar{stroke:var(--eosin);stroke-width:3;fill:none}
.s-bil{fill:var(--rule-2)}
.s-bil-l{stroke:var(--ink-3);stroke-width:1.4}
.s-zone{fill:var(--post)}
.s-zone2{fill:var(--pre)}
.s-node{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.s-node.tox{stroke:var(--eosin)}
.s-sub{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.s-sub.a{fill:var(--hema-soft)} .s-sub.g{fill:var(--rule-2)}
.s-serp{fill:none;stroke:var(--ink-2);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.s-tm{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 2}
.s-dia{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.s-hatch{stroke:var(--ink-3);stroke-width:1.2;opacity:.55}
.fig .tbl{border:0;border-radius:0;border-top:1px solid var(--rule-2)}
.s-trace{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round}
.s-brain{fill:var(--pre);stroke:var(--ink-3);stroke-width:2}
.s-reg{fill:var(--sheet);stroke:var(--ink-3);stroke-width:1.3}
.dp-path{fill:none;stroke:var(--ink-3);stroke-width:3;stroke-linecap:round;transition:opacity .2s,stroke .2s}
.dp-path.on{stroke:var(--hema);stroke-width:4.5}
.dp-dim .dp-path:not(.on){opacity:.22}
.t-lab{font:500 13px var(--f-body);fill:var(--ink)}
.t-lab-b{font:600 13.5px var(--f-body);fill:var(--ink)}
.t-pill{font:600 12.5px var(--f-body);fill:var(--ink)}
.t-small{font:400 11.5px var(--f-body);fill:var(--ink-2)}
.t-mono{font:500 11.5px var(--f-mono);fill:var(--iodine)}
.t-zone{font:600 10.5px var(--f-body);letter-spacing:.12em;fill:var(--ink-3)}
.t-big{font:600 15px var(--f-display);fill:var(--ink)}
.t-ion{font:600 12px var(--f-body);fill:var(--hema)}
.site{cursor:pointer}
.site:focus{outline:none}
.site:focus-visible .s-prot,.site:focus-visible .s-enz,.site:focus-visible .s-node,.site:focus-visible .s-sub{stroke:var(--hema);stroke-width:2.6}
.site.on .s-prot,.site.on .s-enz,.site.on .s-node,.site.on .s-sub,.site.on .s-mito,.site.on .s-prot2{stroke-width:2.6}
.ring{fill:none;stroke-width:2.4;stroke-dasharray:6 4;animation:ringspin 9s linear infinite}
.ring.stim{stroke:var(--hema)} .ring.block{stroke:var(--eosin)} .ring.mod{stroke:var(--iodine)}
.badge-c.stim{fill:var(--hema)} .badge-c.block{fill:var(--eosin)} .badge-c.mod{fill:var(--iodine)}
.badge-t{font:700 12px var(--f-body);fill:var(--sheet)}
@keyframes ringspin{to{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.rail{transition:none}}

/* ---------- reaction chains ---------- */
.rx{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 20px 20px;margin:26px 0}
.rx-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:14px}
.rx-chain{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.rx-node{display:inline-flex;flex-direction:column;gap:2px;max-width:100%;padding:7px 12px;border:1.5px solid var(--ink-3);border-radius:8px;background:var(--paper)}
.rx-node .rx-n{font-weight:600;font-size:15px}
.rx-node .rx-s{font-size:13px;color:var(--ink-2);max-width:62ch}
.rx-node.is-tox{border-color:var(--eosin);background:var(--eosin-soft)}
.rx-node.is-tox .rx-n::after{content:" · токсичен";font-weight:500;font-size:12px;color:var(--eosin)}
.rx-node.is-act{border-color:var(--hema);background:var(--hema-soft)}
.rx-node.is-drug{border-style:dashed}
.rx-prod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:6px;font-size:13.5px}
.rx-prod dt{font-weight:600;white-space:nowrap}
.rx-prod dd{margin:0;color:var(--ink-2)}
.rx-arr{display:grid;grid-template-columns:22px minmax(0,1fr);margin-left:16px;min-height:38px}
.rx-line{position:relative;border-left:2px solid var(--ink-3);margin:2px 0 6px}
.rx-line::after{content:"";position:absolute;left:-6px;bottom:-6px;border:5px solid transparent;border-top:7px solid var(--ink-3);border-bottom:0}
.rx-txt{padding:4px 0 10px 4px;font-size:14px;min-width:0}
.rx-e{font:500 13px/1.35 var(--f-mono);color:var(--iodine)}
.rx-c{font-size:13px;color:var(--ink-3)}
.rx-note{font-size:13px;color:var(--ink-2);margin-top:2px;max-width:62ch}
.tag{display:inline-block;font-size:12.5px;line-height:1.3;padding:2px 8px;border-radius:999px;margin:5px 5px 0 0}
.tag.inh{background:var(--eosin-soft);color:var(--eosin)}
.tag.ac{background:var(--hema-soft);color:var(--hema)}
.rx-split{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px 22px;width:100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--rule)}
.rx-branch{min-width:0}
.rx-blab{font:600 10.5px/1.3 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.rx-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2);max-width:78ch}
@media (max-width:760px){.rx-split{grid-template-columns:minmax(0,1fr)}}

/* ---------- groups ---------- */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px;margin:22px 0}
.g{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px 18px;min-width:0;transition:box-shadow .3s}
.g h4{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;margin:0 0 10px;text-wrap:balance}
.drugs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dtag{font-size:13px;line-height:1.25;padding:4px 9px;border-radius:6px;background:var(--paper);border:1px solid var(--rule-2);color:var(--ink)}
button.dtag{cursor:pointer;border-color:var(--hema);color:var(--hema);background:var(--sheet)}
button.dtag:hover{background:var(--hema-soft)}
.g dl{margin:0;display:grid;gap:9px}
.g dt{font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.g dd{margin:2px 0 0;font-size:14.5px;color:var(--ink-2)}
.g dd.x{color:var(--ink)}
.flash{box-shadow:0 0 0 3px var(--hema)}

/* ---------- tables ---------- */
.tblw{margin:26px 0}
.tblw .rx-head{margin-bottom:10px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
.tbl th{text-align:left;font:600 10.5px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:11px 14px;border-bottom:1px solid var(--rule);background:var(--paper)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--rule-2);vertical-align:top;color:var(--ink-2)}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tnote{font-size:13px;color:var(--ink-3);margin:8px 2px 0;max-width:80ch}

/* ---------- formulas ---------- */
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin:22px 0}
.fx div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.fx code{display:block;font:500 15px/1.4 var(--f-mono);color:var(--hema);margin-bottom:6px}
.fx p{margin:0;font-size:14px;color:var(--ink-2)}

/* ---------- chains (ANS) ---------- */
.chains{display:flex;flex-direction:column;gap:12px;padding:6px 20px 18px}
.chain{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 16px;align-items:center;padding-top:12px;border-top:1px solid var(--rule-2)}
.chain:first-child{border-top:0}
.chain > b{font-size:14px}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lk{font-size:13px;padding:5px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--paper)}
.med{font:500 12px var(--f-mono);color:var(--hema);display:inline-flex;align-items:center;gap:3px}
.med::after{content:"→";font-family:var(--f-body);color:var(--ink-3)}
@media (max-width:640px){.chain{grid-template-columns:minmax(0,1fr)}}

/* ---------- keys, quiz ---------- */
.keys{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 22px 20px;margin:26px 0}
.keys ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.keys li{position:relative;padding-left:20px;font-size:15px;max-width:78ch}
.keys li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;background:var(--eosin);transform:rotate(45deg)}
.quiz{margin:26px 0}
.quiz details{border-top:1px solid var(--rule);padding:12px 2px}
.quiz details:last-child{border-bottom:1px solid var(--rule)}
.quiz summary{cursor:pointer;font-weight:600;list-style:none;display:grid;grid-template-columns:26px 1fr;gap:6px;font-size:15.5px}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary::before{content:"?";font:600 13px/24px var(--f-display);width:22px;height:22px;text-align:center;border-radius:50%;border:1px solid var(--hema);color:var(--hema)}

/* ---------- widgets ---------- */

.seg{display:inline-flex;flex-wrap:wrap;gap:4px}

.ro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-2);border-top:1px solid var(--rule-2)}

.bars{display:grid;gap:12px;padding:14px 20px;border-top:1px solid var(--rule-2)}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;font-size:13.5px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--rule)}

.verdict{font-size:14px;color:var(--ink-2);padding:0 20px 16px;max-width:80ch}
@media (max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr)}.ro{grid-template-columns:repeat(2,minmax(0,1fr))}}

.rbtns{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 4px}
.rbtn{border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:6px 10px;font:500 13.5px var(--f-mono);cursor:pointer}
.rbtn[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.casc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 20px 18px}
.col{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper);transition:opacity .2s,border-color .2s;min-width:0}
.col h5{margin:0 0 8px;font:600 15px var(--f-mono);color:var(--ink)}

@media (max-width:980px){.casc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.casc{grid-template-columns:minmax(0,1fr)}}

.ans td.eff{color:var(--ink)}
.ans td.eff.none{color:var(--ink-3)}
.ans tr.off td{opacity:.45}
.ans .rk{font:500 12.5px var(--f-mono);color:var(--hema);margin-right:4px}
.ans .ue{display:block}
.ans .ue + .ue{margin-top:4px}
.ans .ue.bl .rk{color:var(--eosin)}

/* ---------- home ---------- */
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(42px,6.4vw,72px);line-height:1;letter-spacing:-.02em;margin:.12em 0 .3em;text-wrap:balance}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.pcard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);text-decoration:none;color:inherit;transition:border-color .15s}

.pcard span{font-size:13px;color:var(--ink-3);line-height:1.4}
.note{font-size:13px;color:var(--ink-3);margin-top:40px;max-width:80ch}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:64px;padding-top:18px;border-top:1px solid var(--rule)}
.pager a{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet)}
.pager a:hover{border-color:var(--hema)}
.pager a.nx{text-align:right;grid-column:2}
.pager small{font-size:12px;color:var(--ink-3)}
.pager b{font-weight:600;font-size:15px}

/* ---------- досье ---------- */
html.dz-open{overflow:hidden}
.dz{position:fixed;inset:0;z-index:60}
.dz-scrim{position:absolute;inset:0;background:#0b0e1c73}
.dz-panel{position:absolute;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--sheet);box-shadow:-1px 0 0 var(--rule),-28px 0 56px #0b0e1c40;overflow-y:auto;outline:none;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.dz-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--sheet);border-bottom:1px solid var(--rule-2)}
.dz-back{border:0;background:none;color:var(--hema);font-size:14px;cursor:pointer;padding:6px 4px}
.dz-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.dz-x:focus-visible,.dz-back:focus-visible,.btn:focus-visible,.tlink:focus-visible,.dbrow:focus-visible,.sysf button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.dz-body{padding:18px 26px 8px}
.dz-h h2{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.08;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.dz-g{margin:0;color:var(--ink-2);font-size:15px}
.dz-t{display:inline-block;margin-top:12px;font:500 12.5px/1.45 var(--f-mono);color:var(--hema);background:var(--hema-soft);padding:6px 10px;border-radius:7px}
.dz-al{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.dz-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;line-height:1.2;padding:8px 13px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--hema)}
.btn.pri{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.tlink{border:0;background:none;padding:0;font:inherit;color:var(--hema);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;text-align:left}
.like{margin:18px 0 0;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:14.5px;color:var(--ink-2)}
.like p{margin:0}
.like p + p{margin-top:6px}
.like b{color:var(--ink)}
.dz-sec{margin-top:26px}
.dz-sec > h3{font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.mstep{list-style:none;margin:0;padding:0;counter-reset:m}
.mstep li{position:relative;padding:1px 0 14px 34px;font-size:14.5px;line-height:1.45;counter-increment:m}
.mstep li::before{content:counter(m);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--hema-soft);color:var(--hema);font:600 12px/22px var(--f-mono);text-align:center}
.mstep li::after{content:"";position:absolute;left:11px;top:25px;bottom:3px;border-left:1px dashed var(--rule)}
.mstep li:last-child{padding-bottom:0}
.mstep li:last-child::after{display:none}
.sys{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 16px;padding:12px 0 6px;border-top:1px solid var(--rule-2)}
.sys h4{margin:2px 0 0;font-size:13.5px;font-weight:600;line-height:1.3}
.cf{display:flex;flex-wrap:wrap;align-items:center;gap:5px 5px;font-size:13.5px;line-height:1.35;margin-bottom:8px}
.cf span,.cf b{border-radius:6px;padding:3px 8px}
.cf span{background:var(--paper);border:1px solid var(--rule-2);color:var(--ink-2)}
.cf b{background:var(--hema-soft);border:1px solid var(--hema);font-weight:600;color:var(--ink)}
.cf i{font-style:normal;color:var(--ink-3)}
.cf1{margin:0 0 8px;font-size:13.5px;color:var(--ink-2)}
.dl2{list-style:none;margin:0;padding:0}
.dl2 li{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:8px;padding:8px 0;border-top:1px solid var(--rule-2)}
.dl2 li::before{grid-row:span 2;font:600 13px/21px var(--f-mono)}
.dl2.ind li::before{content:"+";color:var(--hema)}
.dl2.ae li::before{content:"!";color:var(--eosin)}
.dl2 b{font-weight:600;font-size:14.5px;line-height:1.4}
.dl2 .why{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.dl2 .why em{font-style:normal;font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:7px}
.dz-p{margin:0;font-size:14.5px;color:var(--ink-2);max-width:68ch}
@media (max-width:600px){.dz-body{padding:16px 16px 8px}.sys{grid-template-columns:minmax(0,1fr)}.dz-h h2{font-size:28px}}

/* ---------- база ---------- */
.navdb{background:var(--paper);border:1px solid var(--rule)}
.nav a.navdb small{font:500 12px var(--f-mono);color:var(--hema);margin-left:4px}
.dbcta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;margin:26px 0 4px;padding:16px 18px;border:1px solid var(--hema);border-radius:12px;background:var(--sheet);color:var(--ink-2);text-decoration:none;font-size:14.5px}
.dbcta b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.dbcta-n{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1;color:var(--hema);font-variant-numeric:tabular-nums}
.dbcta .go{font-size:20px;color:var(--hema)}
.dbcta:hover,.dbcta:focus-visible{background:var(--hema-soft);outline:none}
@media (max-width:520px){.dbcta{grid-template-columns:minmax(0,1fr)}.dbcta .go{display:none}}
.dbf{display:flex;flex-wrap:wrap;gap:12px 16px;margin:26px 0 12px}
.dbf label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-3);flex:1 1 260px;min-width:0}
.dbf input,.dbf select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink);width:100%}
.dbf input:focus,.dbf select:focus{outline:2px solid var(--hema);outline-offset:1px;border-color:transparent}
.sysf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.sysf .lab{flex-basis:100%;font:600 11px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sysf button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.sysf button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.dbn{font-size:13.5px;color:var(--ink-3);margin:14px 0 0}
.dbl h3.letter{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--hema);margin:26px 0 4px}
.dbrow{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:2px 18px;width:100%;text-align:left;padding:11px 12px;border:0;border-top:1px solid var(--rule-2);background:none;cursor:pointer;color:var(--ink);border-radius:0}
.dbrow:hover{background:var(--sheet)}
.dbrow b{font-weight:600;font-size:15px}
.dbrow span{color:var(--ink-2);font-size:14px}
.dbrow small{grid-column:2;font:500 12px/1.4 var(--f-mono);color:var(--hema)}
@media (max-width:600px){.dbrow{grid-template-columns:minmax(0,1fr)}.dbrow small{grid-column:1}}
.dix .drugs{margin-top:12px}

.cf + .cf,.cf1 + .cf,.cf + .cf1{padding-top:8px;border-top:1px dashed var(--rule-2)}
.inh{margin-top:26px;border-top:1px solid var(--rule)}
.inh > summary{cursor:pointer;list-style:none;padding:14px 0 0;font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--hema)}
.inh > summary::-webkit-details-marker{display:none}
.inh > summary::before{content:"▸ ";}
.inh[open] > summary::before{content:"▾ ";}
.inh > summary:focus-visible{outline:2px solid var(--hema);outline-offset:3px}
.inh .dz-sec:first-of-type{margin-top:14px}


/* ---------- конспект ---------- */
.ksrc{font-size:13px;color:var(--ink-3);margin:12px 0 0;max-width:80ch}
.krel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.module-k{padding:18px 20px 20px;border:1px solid var(--hema);border-radius:14px;background:var(--sheet)}
.module-k .par{margin-top:0}
.module-k .pcard{background:var(--paper)}
/* дерево (слева направо; на узких экранах — вложенный список) */
.tree-scroll{overflow-x:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.tree,.tree .tu{list-style:none;margin:0;padding:0}
.tree{display:flex;flex-direction:column;width:max-content;max-width:none}
.tree .ti{display:flex;align-items:center;position:relative;list-style:none}
.tree .tu{display:flex;flex-direction:column;justify-content:center;position:relative;padding-left:20px}
.tree .tu > .ti{padding:5px 0 5px 20px}
.tree .tu > .ti::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--ink-3)}
.tree .tu > .ti:first-child::before{top:50%}
.tree .tu > .ti:last-child::before{bottom:50%}
.tree .tu > .ti:only-child::before{display:none}
.tree .tu > .ti::after{content:"";position:absolute;left:0;top:50%;width:20px;border-top:1.5px solid var(--ink-3)}
.tree .tu::before{content:"";position:absolute;left:0;top:50%;width:20px;border-top:1.5px solid var(--ink-3)}
.tn{display:inline-block;flex:none;text-align:left;min-width:92px;max-width:220px;padding:7px 11px;border:1.5px solid var(--ink-3);border-radius:9px;background:var(--sheet);font-size:13.5px;line-height:1.35;position:relative}
.tn > b{display:block;font-weight:600;font-size:13.5px}
.tn > small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px;line-height:1.35}
.tn.tc-root{border-color:var(--hema);background:var(--hema-soft);max-width:180px}
.tn.tc-root > b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.tn.tc-a{border-color:var(--hema)} .tn.tc-b{border-color:var(--eosin)} .tn.tc-c{border-color:var(--iodine)} .tn.tc-d{border-style:dashed}
.tn.tn-0{padding:6px 10px}
.tdl{margin:5px 0 0;padding-left:20px}
.tdl li{padding:1px 0;overflow-wrap:anywhere}
.tn > .tdl:first-child,.tn > .tl:first-child{margin-top:0}
.kd{border:0;background:none;padding:0 2px;font:inherit;color:var(--hema);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer;text-align:left;border-radius:3px}
span.kd{color:var(--ink);text-decoration:none;cursor:default}
.kd.hl-y{background:var(--hl-y);color:var(--hl-ink)} .kd.hl-g{background:var(--hl-g);color:var(--hl-ink)} .kd.hl-b{background:var(--hl-b);color:var(--hl-ink)} .kd.hl-p{background:var(--hl-p);color:var(--hl-ink)}
.kd:focus-visible{outline:2px solid var(--hema);outline-offset:1px}
.tleg .kd{padding:1px 6px;text-decoration:none}
.tdl .kd,.kcol .kd{vertical-align:top;max-width:100%}
/* дерево, не помещающееся по ширине, — вертикальным списком */
.tree.tv{display:block;width:auto}
.tree.tv .ti{display:block}
.tree.tv .tu{display:block;padding-left:14px}
.tree.tv .tu > .ti{padding:8px 0 0 16px}
.tree.tv .tu > .ti::before,.tree.tv .tu > .ti:first-child::before,.tree.tv .tu > .ti:last-child::before{display:block;top:0;bottom:0}
.tree.tv .tu > .ti:last-child::before{bottom:auto;height:24px}
.tree.tv .tu > .ti:only-child::before{display:block;bottom:auto;height:24px}
.tree.tv .tu > .ti::after{top:24px;width:14px}
.tree.tv .tu::before{display:none}
.tree.tv .tn{display:block;max-width:none}
.tree.tv .tn .tdl:has(li:nth-child(6)){columns:auto 220px;column-gap:28px}
.tree.tv .tn .tdl li{break-inside:avoid}
@media (max-width:760px){
  .tree{display:block;width:auto}
  .tree .ti{display:block}
  .tree .tu{display:block;padding-left:14px}
  .tree .tu > .ti{padding:8px 0 0 16px}
  .tree .tu > .ti::before,.tree .tu > .ti:first-child::before,.tree .tu > .ti:last-child::before{display:block;top:0;bottom:0}
  .tree .tu > .ti:last-child::before{bottom:auto;height:24px}
  .tree .tu > .ti:only-child::before{display:block;bottom:auto;height:24px}
  .tree .tu > .ti::after{top:24px;width:14px}
  .tree .tu::before{display:none}
  .tn{display:block;max-width:none}
  .tree-scroll{padding:10px 16px 16px}
}
/* блок-схема */

.gn-c{fill:var(--pre);stroke:var(--ink-3)}
.gn-p{fill:var(--paper);stroke:var(--rule)}
.gn-g{fill:var(--hema-soft);stroke:var(--hema);stroke-width:2}
.gt{font:500 13px var(--f-body);fill:var(--ink)}
.gt-d{font:600 13px var(--f-body);fill:var(--hema)}
.gt-h{font:600 15.5px var(--f-display);fill:var(--ink)}
.gt-s{font:400 11.5px var(--f-body);fill:var(--ink-2)}

.ge-t{stroke:var(--eosin);stroke-width:3}
.gl-bg{fill:var(--sheet)}
.gl{font:600 11.5px var(--f-body);fill:var(--ink-2)}
.gl.gl-p{fill:var(--hema)} .gl.gl-n{fill:var(--eosin)}
.gz{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
.gz-cell{fill:var(--pre);stroke:var(--ink-3);stroke-width:2}

.gz-d{fill:none;stroke:var(--ink-3);stroke-dasharray:6 5}
.gdrug{cursor:pointer}
.gdrug:hover .gn,.gdrug:focus-visible .gn{stroke-width:2.8}
.gdrug:focus{outline:none}
/* карточки */
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;margin:20px 0}
.kc{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px 16px;min-width:0;transition:box-shadow .3s}
.kc h4{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;margin:0;display:inline}
.kc.hl-y h4{background:var(--hl-y);color:var(--hl-ink);padding:0 4px;border-radius:4px}
.kc.hl-g h4{background:var(--hl-g);color:var(--hl-ink);padding:0 4px;border-radius:4px}
.kc-al{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.kc-g{margin:5px 0 0;font:500 12.5px/1.45 var(--f-mono);color:var(--hema)}
.kc-l{margin-top:10px}
.kc-l h5{margin:0 0 4px;font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.kc-l ul,.kc-l ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.kc-l li{padding:1.5px 0}
.kc-pok h5{color:var(--hema)} .kc-pe h5{color:var(--eosin)}
.kc-rp{margin:12px 0 0;padding:9px 12px;border:1.5px solid var(--k-rp);border-radius:8px;font:13px/1.55 var(--f-mono);color:var(--ink);white-space:pre-wrap;word-break:break-word;background:transparent}
.kc-kl{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.kc-kl span{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:var(--hl-p);color:var(--hl-ink);font:600 11px/1.6 var(--f-body)}
.kc-fm{margin:12px 0 0;padding:8px 12px 10px;border:1.5px solid var(--k-fm);border-radius:8px}
.kc-fm h5{margin:0 0 4px;font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.kc-fm ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink)}
.kc-x{margin:10px 0 0;font-size:13.5px;color:var(--ink);padding:8px 10px;background:var(--paper);border-radius:8px}
.kc-dr{margin:10px 0 0;font-size:13.5px}
.kwarn{margin:18px 0;padding:12px 16px;border-left:3px solid var(--iodine);background:var(--iodine-soft);border-radius:0 10px 10px 0;font-size:14.5px;max-width:860px}
.kwarn b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--iodine);margin-bottom:3px}
.kwarn p{margin:0;color:var(--ink)}
.klist{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 20px 18px;margin:22px 0}
.klist ul,.klist ol{margin:8px 0 0;padding-left:20px;display:grid;gap:5px;font-size:14.5px;color:var(--ink-2)}
.klist h3 + ul,.klist h3 + ol{margin-top:10px}

/* колонки (схема-карта) */
.kroot{display:flex;justify-content:center;padding:14px 20px 0}
.kroot span{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;padding:7px 18px;border-radius:10px;background:var(--hema-soft);border:1.5px solid var(--hema);text-align:center}
.kroot small{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--ink-2)}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--cmin,190px)),1fr));gap:12px;padding:16px 20px 18px}
.kcol{border:1px solid var(--rule);border-top:3px solid var(--hema);border-radius:10px;padding:10px 12px 12px;background:var(--paper);min-width:0}
.kcol.kc-b{border-top-color:var(--eosin)} .kcol.kc-c{border-top-color:var(--iodine)} .kcol.kc-d{border-top-color:var(--ink-3)}
.kcol h5{margin:0;font:600 19px/1.2 var(--f-display);color:var(--ink)}
.kcol > small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px;line-height:1.4}
.kcol ol,.kcol ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45;color:var(--ink-2);display:grid;gap:6px}
.kcol li b{color:var(--ink)}
.kcol .tdl{gap:2px;font-size:14px;color:var(--ink)}
.kcol .tdl + ul,.kcol .tdl + ol{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule-2)}
.kfoot{margin:0 20px 18px;padding:10px 14px;border:1.5px solid var(--eosin);border-radius:10px;font-size:14px}
.kfoot ul{margin:0;padding-left:18px;display:grid;gap:5px}
.tl{padding-left:16px;color:var(--ink-2);font-size:13px}
.tl li{padding:1px 0}

.tbl mark{background:var(--hl-y);color:var(--hl-ink);padding:0 3px;border-radius:3px}

/* конспект: причинно-следственные цепочки */
.kfl{padding:4px 18px 16px}
.kfr + .kfr{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule-2)}
.kfr h5{margin:0 0 8px;font:600 13.5px/1.3 var(--f-body);color:var(--ink)}
.kfr .cf{margin:0;font-size:14px}
.kfn{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
@media (max-width:560px){ .kfl{padding:4px 12px 14px} }

/* =====================================================================
   Навигация: верхние разделы
   ===================================================================== */
.navtop{display:flex;flex-direction:column;gap:6px}
.nav a.navdb .n svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.nav a.navdb .n{color:var(--hema)}
.nav a.navdb .ico-hb{fill:var(--eosin);stroke:none;transform-box:fill-box;transform-origin:center;animation:hb 1.1s ease-in-out infinite}
.nav a.navdb small.due{background:var(--eosin);color:#fff;border-radius:999px;padding:1px 7px;font:600 11px/1.5 var(--f-body)}
kbd{font:500 11px/1 var(--f-mono);padding:2px 5px;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;opacity:.75;margin-left:4px;vertical-align:1px}
.search .fx-k{position:absolute;right:9px;top:21px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;margin:0}
.search input:focus ~ .fx-k,.search input:not(:placeholder-shown) ~ .fx-k{display:none}
@media (max-width:920px){.search .fx-k{display:none}}
.fx-theme{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:auto;padding-top:14px;border-top:1px solid var(--rule-2);font-size:12.5px}
.fx-theme span{font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.fx-theme button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.fx-theme button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.fx-theme button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}

/* =====================================================================
   Главная: ЭКГ, разделы, препарат дня
   ===================================================================== */
.hero-ecg{height:56px;margin:4px 0 0;max-width:760px;border-radius:10px;overflow:hidden;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.hero-ecg .ecg{height:56px}
.hero-ecg .ecg rect{display:none}
.cta2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;margin:12px 0 4px}
.cta-b{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:16px 18px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink-2);text-decoration:none;font-size:14.5px;transition:border-color .2s,transform .2s,box-shadow .2s}
.cta-b b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.cta-b .go{font-size:20px;color:var(--hema);transition:transform .2s}
.cta-b:hover,.cta-b:focus-visible{border-color:var(--hema);outline:none;transform:translateY(-2px);box-shadow:0 10px 24px -16px var(--hema)}
.cta-b:hover .go{transform:translateX(4px)}
.cta-b .due{display:block;margin-top:6px;font-style:normal;font-weight:600;color:var(--eosin);font-size:13.5px}
.cta-ic{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:var(--hema-soft)}
.cta-heart svg{width:40px;height:40px;overflow:visible}
.cta-heart svg path:first-child{fill:var(--eosin);transform-box:fill-box;transform-origin:center;animation:hb 1s ease-in-out infinite}
.cta-pulse{fill:none;stroke:var(--sheet);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;animation:pulse-line 2s linear infinite}
.cta-cards{position:relative}
.cta-cards i{position:absolute;width:26px;height:34px;border-radius:5px;border:1.5px solid var(--hema);background:var(--sheet);left:15px;top:11px;transform-origin:50% 100%}
.cta-cards i:nth-child(1){transform:rotate(-14deg)}
.cta-cards i:nth-child(2){transform:rotate(0deg)}
.cta-cards i:nth-child(3){background:var(--hl-y);border-color:var(--iodine);animation:cardflip 3.2s ease-in-out infinite}
.dday{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin:12px 0 4px;padding:16px 18px;border:1px dashed var(--hema);border-radius:12px;background:linear-gradient(120deg,var(--hema-soft),transparent 70%)}
.dday h3{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:4px 0 2px}
.dday p{margin:0;color:var(--ink-2);font-size:14.5px}
.dday .dz-t{margin-top:8px}
.dday-a{display:flex;flex-wrap:wrap;gap:8px}
.pcard{transition:border-color .15s,transform .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px -16px var(--hema)}
.kc-dr{display:flex;flex-wrap:wrap;gap:6px 16px}

/* =====================================================================
   Организм
   ===================================================================== */
.bd-pick{display:flex;gap:8px;align-items:flex-start;margin:22px 0 14px;max-width:620px}
.bd-q{position:relative;flex:1;min-width:0}
.bd-q input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink)}
.bd-q input:focus{outline:2px solid var(--hema);outline-offset:1px;border-color:transparent}
.bd-res{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 4px);display:flex;flex-direction:column;background:var(--sheet);border-radius:10px;box-shadow:0 0 0 1px var(--rule),0 16px 32px -18px #0b0e1c80;overflow:hidden}
.bd-res:empty{display:none}
.bd-res a{display:flex;flex-direction:column;padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px}
.bd-res a small{font-weight:400;font-size:12px;color:var(--ink-3)}
.bd-res a:hover,.bd-res a:focus-visible{background:var(--hema-soft);outline:none}
.bd-res .none{padding:10px 12px;font-size:13px;color:var(--ink-3)}
.bd-pick .btn{padding:10px 14px}
.bd-wrap{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}
.bd-body{position:sticky;top:16px}
.bd-stage{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:10px 6px 4px;overflow:hidden}
.bd-svg{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);margin:0 auto;overflow:visible;
  --bd-rr:.833s;--bd-beat:1.07;--bd-br:3.75s;--bd-bamp:1.045;--bd-brw:6;--bd-gid:2.6s;--bd-art:5;--bd-flow:2.2s;--bd-kid:2.4s;--bd-sal:1.6s;--bd-sw:1.8s;--bd-blf:.5;--bd-cns:transparent}
.bd-hint{font-size:12.5px;color:var(--ink-3);margin:8px 4px 0}
.bd-sil .bd-trunk{fill:var(--rule-2);stroke:var(--rule);stroke-width:1.2}
.bd-sil .bd-limb{fill:none;stroke:var(--rule-2);stroke-linecap:round}
.org{cursor:pointer;outline:none;transition:opacity .5s,filter .3s}
.org:focus-visible{filter:drop-shadow(0 0 3px var(--hema)) drop-shadow(0 0 1px var(--hema))}
.org.sel{filter:drop-shadow(0 0 4px var(--hema)) drop-shadow(0 0 1px var(--hema))}
.bd-svg:has(.org.hit) .org:not(.hit):not(.sel):not([data-org="vessels"]){opacity:.5}
.org.hit{animation:orghit .9s ease-out 1}
/* сосуды */
.bd-art{fill:none;stroke:var(--eosin);stroke-opacity:.28;stroke-width:calc(var(--bd-art) * 1px);stroke-linecap:round;stroke-linejoin:round;transition:stroke-width 1.2s ease,stroke-opacity 1s}
.bd-art.bd-flow{stroke-opacity:.95;stroke-width:1.6px;stroke-dasharray:2 13;animation:artflow var(--bd-flow) linear infinite}
.vt-up .bd-art:not(.bd-flow){stroke-opacity:.5}
.vt-dn .bd-art:not(.bd-flow){stroke-opacity:.2}
/* мозг */
.bd-brain{fill:var(--hl-p);stroke:var(--ink-3);stroke-width:1.4}
.bd-gyri{fill:none;stroke:var(--ink-3);stroke-width:1.1;opacity:.55}
.bd-glowc{opacity:0;transition:opacity 1s}
.cns-dn .bd-glowc,.cns-up .bd-glowc{opacity:1}
.cns-up .bd-glowc{animation:glow 1.2s ease-in-out infinite}
.cns-sz .bd-glowc{animation:glow .22s steps(2) infinite}
.bd-z{opacity:0;font:600 15px var(--f-display);fill:var(--hema)}
.cns-dn .bd-z{opacity:1}
.cns-dn .bd-z text{animation:zz 2.4s ease-in-out infinite}
.cns-dn .bd-z text:nth-child(2){animation-delay:.6s}
.cns-dn .bd-z text:nth-child(3){animation-delay:1.2s}
.bd-spark{opacity:0;fill:none;stroke:var(--eosin);stroke-width:2.2;stroke-linecap:round}
.cns-up .bd-spark{opacity:1;animation:spark .5s steps(2) infinite}
/* глаза */
.bd-eyew{fill:#F4F5FA;stroke:var(--ink-3);stroke-width:1}
.bd-iris{fill:var(--hema);opacity:.55}
.bd-pupil{fill:#0B0E1C;transform-box:fill-box;transform-origin:center;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
/* слюна, пот */
.bd-gland{fill:var(--hl-y);stroke:var(--iodine);stroke-width:1;transition:opacity .8s}
.bd-mouth{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.bd-saliva path{fill:var(--hema);opacity:0}
.sal-up .bd-saliva path{animation:drip var(--bd-sal) ease-in infinite}
.sal-up .bd-saliva path:nth-child(2){animation-delay:calc(var(--bd-sal) / 2)}
.sal-up .bd-gland{animation:pulse-o var(--bd-sal) ease-in-out infinite}
.bd-dry{fill:none;stroke:var(--iodine);stroke-width:1.2;opacity:0}
.sal-dn .bd-dry{opacity:1}
.sal-dn .bd-gland{opacity:.35}
.bd-sweat path{fill:var(--hl-b);stroke:var(--hema);stroke-width:.8;opacity:0}
.sw-up .bd-sweat path{animation:drip var(--bd-sw) ease-in infinite}
.sw-up .bd-sweat path:nth-child(2){animation-delay:.4s}.sw-up .bd-sweat path:nth-child(3){animation-delay:.8s}.sw-up .bd-sweat path:nth-child(4){animation-delay:1.2s}
.bd-heat{fill:none;stroke:var(--eosin);stroke-width:1.6;stroke-linecap:round;opacity:0}
.sw-dn .bd-heat{opacity:1}
.sw-dn .bd-heat path{animation:heat 1.6s ease-in-out infinite}
/* лёгкие */
.bd-lungs{transform-box:fill-box;transform-origin:50% 10%;animation:breathe var(--bd-br) ease-in-out infinite}
.apnea .bd-lungs{animation:none}
.bd-lung{fill:var(--hl-b);stroke:var(--ink-3);stroke-width:1.2}
.apnea .bd-lung{fill:var(--rule)}
.bd-bronch{fill:none;stroke:var(--ink-2);stroke-opacity:.7;stroke-width:calc(var(--bd-brw) * 1px);stroke-linecap:round;stroke-linejoin:round;transition:stroke-width 1.2s,stroke .6s}
.br-dn .bd-bronch{stroke:var(--eosin);stroke-opacity:.9}
.bd-mucus circle{fill:var(--hl-g);stroke:var(--ink-3);stroke-width:.8;opacity:0;transform-box:fill-box;transform-origin:center}
.bs-up .bd-mucus circle{opacity:1;animation:mucus 1.4s ease-in-out infinite}
.bs-up .bd-mucus circle:nth-child(2n){animation-delay:.5s}
/* сердце */
.bd-heart{fill:var(--eosin);stroke:color-mix(in srgb,var(--eosin) 70%,#000);stroke-width:1;transform-box:fill-box;transform-origin:50% 55%;animation:beat var(--bd-rr) ease-out infinite}
.qt-up .bd-heart{animation-name:beat-irr}
/* печень, поджелудочная, желудок */
.bd-liver{fill:var(--iodine-soft);stroke:var(--iodine);stroke-width:1.3;transition:fill .8s}
.liv-up .bd-liver{fill:var(--hl-y);stroke:var(--eosin);animation:warn 1.4s ease-in-out infinite}
.bd-panc{fill:var(--hl-y);stroke:var(--iodine);stroke-width:1.1}
.glu-up .bd-panc,.glu-dn .bd-panc{animation:warn 1.6s ease-in-out infinite}
.glu-dn .bd-panc{stroke:var(--hema)}
.bd-stom{fill:var(--hl-p);stroke:var(--eosin);stroke-width:1.3;stroke-opacity:.7}
.bd-ulc circle{fill:var(--eosin);opacity:0;transform-box:fill-box;transform-origin:center}
.ulc-up .bd-ulc circle{opacity:1;animation:mucus 1.2s ease-in-out infinite}
/* почки и мочевыводящие */
.bd-kid{fill:var(--eosin-soft);stroke:var(--eosin);stroke-width:1.3}
.bd-ureter{fill:none;stroke:var(--ink-3);stroke-width:1.4}
.bd-urine circle{fill:var(--iodine);opacity:0}
.bd-urine circle:nth-child(1){animation:urL var(--bd-kid) linear infinite}
.bd-urine circle:nth-child(2){animation:urR var(--bd-kid) linear infinite;animation-delay:calc(var(--bd-kid) / -2)}
.kid-dn .bd-kid{fill:var(--rule-2)}
.bd-blad{fill:var(--sheet);stroke:var(--ink-3);stroke-width:1.4}
.bd-urfill{fill:var(--hl-y);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--bd-blf));transition:transform 1.4s ease}
.bl-dn .bd-blad{stroke:var(--eosin);stroke-width:2}
.bl-up .bd-urfill{animation:void 2.6s ease-in-out infinite}
/* кишечник */
.bd-gut{fill:none;stroke:var(--hl-p);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.bd-gut.bd-gutw{stroke:var(--eosin);stroke-opacity:.55;stroke-width:4;stroke-dasharray:3 16;animation:peri var(--bd-gid) linear infinite}
/* мышцы */
.bd-musc ellipse{fill:var(--eosin);fill-opacity:.16;stroke:var(--eosin);stroke-opacity:.35;stroke-width:1;transition:fill-opacity .8s;transform-box:fill-box;transform-origin:center}
.skm-up .bd-musc ellipse{fill-opacity:.32;animation:tremor .12s linear infinite}
.skm-dn .bd-musc ellipse{fill-opacity:.06;stroke-dasharray:3 3}
.skm-par .bd-musc ellipse{fill-opacity:0;stroke:var(--ink-3)}
/* кровь */
.bd-drop{fill:var(--eosin);transition:fill .8s}
.coag-up .bd-drop{fill:color-mix(in srgb,var(--eosin) 55%,#300)}
.bd-bleed circle{fill:var(--eosin);opacity:0}
.coag-dn .bd-bleed circle{animation:bleed 1.6s ease-in infinite}
.coag-dn .bd-bleed circle:nth-child(2){animation-delay:.5s}.coag-dn .bd-bleed circle:nth-child(3){animation-delay:1s}

/* панель */
.bd-panel{min-width:0}
.bd-h h2{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4vw,38px);line-height:1.05;margin:4px 0 10px;letter-spacing:-.01em}
.bd-seg{margin:0 0 10px}
.bd-act{display:flex;flex-wrap:wrap;gap:8px}
.btn.on{background:var(--hl-g);border-color:var(--ink-3);color:var(--hl-ink)}
.bd-anti{margin:12px 0 0;padding:9px 12px;border-radius:9px;background:var(--hl-g);color:var(--hl-ink);font-size:14px}
.bd-card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-top:12px;min-width:0}
.bd-card h3{font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.bd-card h3 small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.bd-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.bd-g > div{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px 9px;transition:border-color .6s,background .6s}
.bd-g small{display:block;font:600 10.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.bd-g b{display:block;font:600 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:3px;white-space:nowrap}
.bd-g span{font-size:12px;color:var(--ink-3)}
.bd-g .g-ar{position:absolute;right:10px;top:9px;font-style:normal;font-size:12px}

.lb-s.pok h4{color:var(--hema)} .lb-s.pe h4{color:var(--eosin)}
.lb-s.fm{padding:8px 12px 10px;border:1.5px solid var(--k-fm);border-radius:8px}
.lb-mark{padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--hl-y) 55%,var(--sheet))}
.lb-l{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.l-rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.l-rate button{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px 8px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.l-rate button:active{transform:scale(.97)}
.l-rate .r0{color:var(--eosin);border-color:var(--eosin)} .l-rate .r0:hover{background:var(--eosin-soft)}
.l-rate .r1{color:var(--iodine);border-color:var(--iodine)} .l-rate .r1:hover{background:var(--iodine-soft)}
.l-rate .r2{color:var(--hema);border-color:var(--hema)} .l-rate .r2:hover{background:var(--hema-soft)}

.l-empty{text-align:center;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:32px 20px}

.l-opts button kbd{margin:0;flex:none;color:var(--ink-3)}
.l-opts button:hover:not(:disabled){border-color:var(--hema)}

.l-opts .ok{background:var(--hl-g);border-color:#2E9E5B;color:var(--hl-ink);animation:pop .35s ease-out}
.l-opts .no{background:var(--eosin-soft);border-color:var(--eosin);animation:shake .4s ease-in-out}
.l-fb{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.l-fb p{margin:0;font-size:14.5px;color:var(--ink-2);flex:1;min-width:220px}
.l-fb p.ok b{color:#2E9E5B} .l-fb p.no b{color:var(--eosin)}
.l-fb .btn kbd{border-color:var(--sheet)}
.l-res{display:flex;align-items:center;gap:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:18px 22px}
.l-ring{width:110px;height:110px;flex:none}
.rg-bg{fill:none;stroke:var(--rule-2);stroke-width:10}
.rg-fg{fill:none;stroke:var(--hema);stroke-width:10;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:calc(326.73 - 326.73 * var(--p) / 100);transform:rotate(-90deg);transform-origin:60px 60px;animation:ringfill 1.2s cubic-bezier(.3,.7,.3,1) both}
.l-res-t b{display:block;font:600 34px/1.1 var(--f-display)}
.l-res-t span{color:var(--ink-2)}
.l-wrong{list-style:none;margin:0;padding:0}
.l-wrong li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:8px 0;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2)}
.l-wrong li:first-child{border-top:0}
.l-wrong b{color:var(--ink)}
.l-bars{display:flex;flex-direction:column;gap:2px}
.l-bar{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(90px,200px) 52px;gap:10px;align-items:center;padding:7px 6px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px}
.l-bar:hover{background:var(--paper)}
.l-bl{font:600 14px var(--f-display);color:var(--hema)}

.l-bb .k,.l-leg .k{background:var(--hema)} .l-bb .l,.l-leg .l{background:color-mix(in srgb,var(--hema) 35%,var(--rule-2))}
.l-bn{font:500 12.5px var(--f-mono);text-align:right;color:var(--ink-3)}

.l-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.l-leg i:first-child{margin-left:0}
.l-leg .n{background:var(--rule-2)}
.l-heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}

.confetti{position:absolute;inset:-40px 0 0;pointer-events:none;overflow:hidden;z-index:5}

  .l-bar{grid-template-columns:40px minmax(0,1fr) 46px}
  .l-bb{grid-column:1 / -1;grid-row:2}

  .l-rate kbd{display:none}
}

/* =====================================================================
   Анимации: схемы, прокрутка, страница
   ===================================================================== */
.fx-enter{animation:fxup .32s ease-out both}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
.fx-cf > *{opacity:0;transform:translateX(-6px)}
.fx-cf.in > *{animation:fxchain .38s ease-out calc(var(--i,0) * 70ms) both}
.fx-gctl{display:inline-flex;align-items:center;gap:10px;margin-left:auto}
.fx-step{font:500 12px var(--f-mono);color:var(--ink-3)}
.fx-gbtn{border:1px solid var(--hema);background:var(--sheet);color:var(--hema);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.fx-gbtn:hover{background:var(--hema-soft)}
.fx-gbtn[aria-pressed="true"]{background:var(--hema);color:var(--sheet)}
.fx-gbtn:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.fx-hint{font-size:12.5px;color:var(--ink-3);padding:2px 20px 10px;margin:0}
.fx-hint .fx-dn{color:var(--hema);font-weight:600} .fx-hint .fx-up{color:var(--iodine);font-weight:600}
@media (hover:none){.fx-hint{display:none}}
.gn-w,.ge-w{transition:opacity .25s}
.gn-w{transform-box:fill-box;transform-origin:center}
.fx-hide .gn-w,.fx-hide .ge-w{opacity:0;transition:none}
.fx-hide .ge-w.on{opacity:1;transition:opacity .2s}
.fx-hide .gn-w.on{opacity:1;animation:fxpop .42s cubic-bezier(.3,1.5,.5,1) both}
.fx-playing .gn-w.on:not(.cur){opacity:.82}
.gn-w.cur .gn{stroke:var(--hema);stroke-width:2.6}
.fx-playing .gn-w.cur{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--hema) 55%,transparent))}
.fx-trace .gn-w:not(.tr),.fx-trace .ge-w:not(.tr){opacity:.16}
.fx-trace .ge-w.tr .ge,.fx-trace .ge-w.tr .ge-i,.fx-trace .ge-w.tr .ge-d{stroke-width:2.2;stroke-dasharray:7 5;animation:fxdash .7s linear infinite}
.fx-trace .ge-w.tr-dn .ge,.fx-trace .ge-w.tr-dn .ge-d{stroke:var(--hema)}
.fx-trace .ge-w.tr-up .ge,.fx-trace .ge-w.tr-up .ge-d{stroke:var(--iodine)}
.fx-trace .gn-w.tr-me .gn{stroke:var(--hema);stroke-width:2.8}
.fx-trace .gn-w.tr-me{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hema) 50%,transparent))}
.kgraph .gn-w:not(:has(.gdrug)){cursor:pointer}
/* синапс: медиатор в щели «дышит» */
.fig-scroll svg circle.s-nt[opacity]{transform-box:fill-box;animation:ntd 2.6s ease-in-out infinite alternate}
.fig-scroll svg circle.s-nt[opacity]:nth-of-type(2n){animation-duration:3.3s;animation-delay:-1.1s}
.fig-scroll svg circle.s-nt[opacity]:nth-of-type(3n){animation-duration:2.1s;animation-delay:-.6s}
/* прогресс чтения */
.fx-prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
.fx-prog.on{opacity:1}
.fx-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin));transform-origin:0 50%;transform:scaleX(0)}
.flash{animation:flash 1.6s ease-out}

@keyframes fxup{from{opacity:0;transform:translateY(10px)}}
@keyframes fxchain{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fxpop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes fxdash{to{stroke-dashoffset:-12}}
@keyframes ntd{to{transform:translate(4px,6px)}}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--hema)}100%{box-shadow:0 0 0 3px transparent}}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@keyframes pulse-line{from{stroke-dashoffset:60}to{stroke-dashoffset:-60}}
@keyframes cardflip{0%,30%{transform:rotate(12deg)}50%,80%{transform:rotate(12deg) rotateY(180deg)}100%{transform:rotate(12deg) rotateY(360deg)}}
@keyframes orghit{0%{filter:drop-shadow(0 0 0 transparent)}40%{filter:drop-shadow(0 0 6px var(--hema))}100%{filter:drop-shadow(0 0 0 transparent)}}
@keyframes artflow{to{stroke-dashoffset:-30}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
@keyframes spark{0%{opacity:1}100%{opacity:.2}}
@keyframes drip{0%{opacity:0;transform:translateY(-2px)}20%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes pulse-o{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes heat{0%{opacity:0;transform:translateY(4px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes breathe{0%,100%{transform:scale(1)}45%{transform:scale(var(--bd-bamp))}}
@keyframes mucus{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(var(--bd-beat))}28%{transform:scale(1)}40%{transform:scale(calc((var(--bd-beat) - 1) * .45 + 1))}52%,100%{transform:scale(1)}}
@keyframes beat-irr{0%{transform:scale(1)}10%{transform:scale(var(--bd-beat))}20%{transform:scale(1)}48%{transform:scale(1)}55%{transform:scale(var(--bd-beat))}62%,100%{transform:scale(1)}}

  {t:'p', html:'<i>Из учебника.</i> Растворы обволакивающих веществ на поверхности тканей, воспалённых участках, язвах образуют защитное мягкое покрытие, предохраняющее ткани и находящиеся в них окончания чувствительных нервов от раздражения. Поэтому обволакивающие средства оказывают местное противовоспалительное и болеутоляющее действие. Они находят применение при воспалительных и язвенных поражениях слизистой оболочки желудка (гастрите, язвенной болезни) и кишечника (энтероколите). Защищая слизистую оболочку ЖКТ от раздражения пищеварительными соками и составными частями пищи, они оказывают противоязвенное и антидиарейное действие. Обволакивающие средства (крахмальную слизь) назначают совместно или непосредственно перед приёмом различных лекарственных препаратов, обладающих раздражающим свойством. Обволакивающие средства назначают часто и продолжительное время (2–3 недели) при отравлениях кислотами, щелочами и едкими жидкостями с целью покрытия воспалённой и изъязвлённой поверхности коллоидной плёнкой. Крахмал (<i>Amylum</i>) в холодной воде нерастворим, в горячей образует коллоидный раствор (<i>Mucilago Amyli</i>). В медицинской практике, кроме крахмальной слизи, используют слизь из семян льна посевного (<i>Semen Lini</i>). Применяют внутрь в виде слизи из льняного семени (<i>Mucilago seminis Lini</i>), которую готовят из 1 части цельного льняного семени и 30 частей горячей воды.'},

  {t:'h', text:'Раздражающие средства'},
  {t:'p', html:'<b>Раздражающие средства</b> — возбуждают нервные окончания. <i>Из учебника:</i> раздражающие средства прямо стимулируют окончания чувствительных нервов кожи и слизистых оболочек, в результате чего рефлекторно возникает терапевтический эффект в органах и тканях. При непосредственном возбуждении рецепторов кожи и слизистых оболочек возникают импульсы с рецепторов, которые поступают в ЦНС и вызывают реакцию со стороны органов, имеющих иннервацию, сопряжённую в ЦНС с участками, подвергшимися воздействию раздражающих средств. В результате их действия улучшается кровоснабжение органа, его трофика. Основные эффекты раздражающих средств используют для профилактики и лечения различных воспалительных процессов. <i>Местное раздражение</i> проявляется болевыми ощущениями, гиперемией, отёком на месте нанесения препаратов. <i>Рефлекторное действие</i> характеризуется тонизированием дыхательного и сосудодвигательного центров продолговатого мозга.'},

  {t:'flow', title:'Аммиак', rows:[{h:'1. Вдыхание резкого неприятного запаха', s:['остановка дыхания','гиперкапния','раздражение (возбуждение) нейронов ДЦ','рефлекторная стимуляция дыхания','вдох']},{h:'2. Прямое возбуждение ЦНС', s:['т.к. любой запах возбуждает']}]},
  {t:'p', html:'<i>Из учебника.</i> <b>Аммиака раствор 10%</b> (нашатырный спирт) при вдыхании раздражает окончания тройничного нерва в полости носа, афферентные импульсы достигают центра этого нерва, а затем переключаются на дыхательный центр. Раствор аммиака используют при обмороках (надо поднести вату, смоченную раствором аммиака, к носу больного; вдохнув пары аммиака, больной обычно приходит в сознание). При этом следует учитывать, что большие количества паров аммиака могут вызвать и нежелательные рефлексы, например резкое урежение сердечных сокращений, остановку дыхания.'},

  {t:'flow', title:'Горчица', rows:[

  {t:'p', html:'<i>Из учебника.</i> <b>Нейрогуморальное влияние</b> обусловлено резорбтивными эффектами биологически активных веществ, образующихся в зоне раздражения кожи, а также воздействием на головной и спинной мозг потока восходящих афферентных импульсов. При этом изменяется обмен медиаторов головного мозга — освобождаются антиноцицептивные факторы (β-эндорфин, энкефалины), уменьшается выделение медиаторов боли (субстанции P, соматостатина, холецистокинина), возрастает секреция рилизинг-гормонов гипоталамуса, адренокортикотропного и тиреотропного гормонов гипофиза. К веществам этой группы относятся <i>масло камфорное</i>, камфорный спирт (действующее вещество камфора), настойка перца стручкового и другие раздражающие вещества (масла гвоздичное и эвкалиптовое, ментол), входящие в состав «разогревающих» мазей и растираний (бальзам «Золотая звезда», Эфкамон, Меновазин, Никофлекс).'},

  {t:'list', title:'Механизм действия и основные эффекты раздражающих средств', items:[
    '<b>1. Местное действие.</b> Например, при смачивании тёплой водой горчичника фермент горчицы мирозин расщепляет гликозид горчицы синигрин с образованием горчичного эфирного масла, которое оказывает выраженное раздражающее действие. Боль, гиперемия, отёк (увеличение высвобождения гистамина, серотонина, брадикинина, простагландинов, которые, в свою очередь, раздражают нервные окончания и расширяют сосуды). Аксон-рефлекс: возбуждение от ЧНО кожи распространяется по афферентным волокнам к органам и по коллатералям, минуя ЦНС, поступает к сосудам кожи → гиперемия, в том числе прилегающей к области раздражения зоны',
    '<b>2. Рефлекторное действие. 2.1. Трофическое:</b> нервные импульсы от зон раздражения на коже поступают в задние рога нескольких сегментов спинного мозга, затем переключаются на боковые рога этих же сегментов к ядрам преганглионарных волокон СНС → повышается кровоснабжение органов и скелетных мышц, вовлечённых в патологический процесс, улучшается регенерация тканей, уменьшаются воспалительные проявления. Рефлекторное расширение коронарных артерий при раздражении холодовых рецепторов ротовой полости (валидол), расширение поверхностных сосудов глотки и гортани (ментол)',
    '<b>2.2. Обезболивающее — отвлекающее.</b> Механизм тот же. Подавление очага, поддерживающего патологический процесс (гипералгезия, напряжение мышц, спазм сосудов), взаимодействием в ЦНС потока афферентных импульсов с поверхности кожи и поражённых органов. Высвобождение эндорфинов, энкефалинов в ЦНС → уменьшение выделения медиаторов боли (SP, соматостатина, холецистокинина)',
    '<b>2.3. Тонизирующее:</b> рефлекторная стимуляция ДЦ и СДЦ при раздражении ЧНО тройничного нерва в полости носа (аммиак)',
    '<b>3. Нейрогуморальное действие.</b> Резорбтивное действие БАВ, образующихся в зоне раздражения кожи → поток афферентных импульсов из очага раздражения в ЦНС → высвобождение эндорфинов и энкефалинов → снижение восприятия боли, повышение высвобождения либеринов из гипоталамуса, АКТГ, ТТГ из гипофиза, увеличение секреции ГКС и трийодтиронина → противовоспалительный эффект',
    '<b>Применение.</b> Для разогрева мышц в спортивной медицине. Спортивные травмы. Боль в суставах и мышцах, невралгия, неврит, радикулит, ишиас, люмбаго, артрит, тендовагинит, миозит, травмы мышц и связок, нарушение периферического кровообращения, бронхит, пневмония, трахеит (скипидар, горчичники), фарингит и ларингит (ментол, «Каметон»), приступ стенокардии (валидол под язык), обмороки и нетяжёлое угнетение ДЦ (раствор аммиака ингаляционно)']}

<script type="text/plain" id="ma-app">
/* ===== Слияние закрытой части: заглушки заменяются настоящими темами, восстанавливается исходный порядок ===== */
(function(){
  function dedupe(arr){
    const real=new Map(); arr.forEach(p=>{ if(!p.locked) real.set(p.id,p); });
    const seen=new Set(), out=[];
    arr.forEach(p=>{ const r=real.get(p.id)||p; if(seen.has(r.id)) return; seen.add(r.id); out.push(r); });
    arr.length=0; arr.push(...out);
  }
  dedupe(KP); dedupe(P);
  if(typeof DRUGS_ORDER!=='undefined'){
    const all=Object.assign({},DRUGS); Object.keys(DRUGS).forEach(k=>delete DRUGS[k]);
    DRUGS_ORDER.forEach(k=>{ if(all[k]) DRUGS[k]=all[k]; });
    Object.keys(all).forEach(k=>{ if(!DRUGS[k]) DRUGS[k]=all[k]; });
  }
})();

/* ===== Анимации и «фишки»: живые схемы, подсветка цепочек, появление при прокрутке, горячие клавиши, тема ===== */
const FX = (function(){
  const RM = ()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_KEY='atlas-theme';
  const qs=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>Array.from(r.querySelectorAll(s));

  /* ---------- тема ---------- */
  function themeGet(){ try{ return localStorage.getItem(T_KEY)||'auto'; }catch(e){ return 'auto'; } }
  function themeSet(t){ try{ localStorage.setItem(T_KEY,t); }catch(e){} themeApply(t); }
  function themeApply(t){ const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
    qa('.fx-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===t))); }
  themeApply(themeGet());

  /* ---------- наблюдатель прокрутки ---------- */
  const hasIO = typeof IntersectionObserver!=='undefined';
  const cb = new WeakMap();
  let io = hasIO ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; const f=cb.get(e.target); io.unobserve(e.target); cb.delete(e.target); if(f) f(e.target); }),{rootMargin:'0px 0px -8% 0px',threshold:0.06}) : null;
  function watch(el,fn){ if(!io){ fn(el); return; } cb.set(el,fn); io.observe(el); }

  /* ---------- появление блоков ---------- */
  function reveal(root){
    if(RM()||!io) return;
    const H=innerHeight;
    qa('.kc,.fig,.pcard,.tblw,.klist,.kwarn,.dbrow,.module,.bd-card,.l-bar',root).forEach((el,i)=>{
      if(el.closest('.dz')||el.classList.contains('rv')) return;
      const r=el.getBoundingClientRect(); if(r.top<H-20) return;
      el.classList.add('rv'); watch(el,x=>{ x.classList.add('in'); setTimeout(()=>x.classList.remove('rv','in'),700); });
    });
  }
  /* цепочки «причина → следствие» разворачиваются по звеньям */
  function chains(root){
    if(RM()) return;
    qa('.cf',root).forEach(cf=>{ if(cf._fx) return; cf._fx=1; Array.from(cf.children).forEach((c,i)=>c.style.setProperty('--i',i)); cf.classList.add('fx-cf'); watch(cf,x=>x.classList.add('in')); });
  }

  /* ---------- блок-схемы: уровни, проигрывание, подсветка цепочки ---------- */
  function gPrep(svg){
    if(svg._g) return svg._g;
    const nodes=qa('.gn-w',svg), edges=qa('.ge-w',svg); const N={}; nodes.forEach(g=>N[g.dataset.n]=g);
    const out={}, inc={};
    edges.forEach(e=>{ const a=e.dataset.a, b=e.dataset.b; if(a&&N[a]) (out[a]=out[a]||[]).push(e); if(b&&N[b]) (inc[b]=inc[b]||[]).push(e); });
    const lv={};
    const bfs=roots=>{ const q=roots.slice(); while(q.length){ const id=q.shift(); (out[id]||[]).forEach(e=>{ const b=e.dataset.b; if(b&&N[b]&&lv[b]===undefined){ lv[b]=lv[id]+1; q.push(b); } }); } };
    const roots=nodes.map(g=>g.dataset.n).filter(id=>!(inc[id]||[]).some(e=>e.dataset.a&&N[e.dataset.a]));
    roots.forEach(id=>lv[id]=0); bfs(roots);
    nodes.forEach(g=>{ const id=g.dataset.n; if(lv[id]===undefined){ lv[id]=0; bfs([id]); } });
    let max=0;
    nodes.forEach(g=>{ g._s=lv[g.dataset.n]; max=Math.max(max,g._s); });
    edges.forEach(e=>{ const a=e.dataset.a, b=e.dataset.b; e._s = a&&N[a] ? lv[a]+1 : (b&&N[b] ? lv[b] : 0); max=Math.max(max,e._s); });
    return svg._g={nodes,edges,N,out,inc,max};
  }
  function drawEdge(e,ms){
    const p=e.querySelector('path'); if(!p||!p.getTotalLength) return;
    let L=0; try{ L=p.getTotalLength(); }catch(x){} if(!L) return;
    const me=p.getAttribute('marker-end'), msA=p.getAttribute('marker-start');
    if(me) p.removeAttribute('marker-end'); if(msA) p.removeAttribute('marker-start');
    p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.getBoundingClientRect();
    p.style.transition=`stroke-dashoffset ${ms}ms ease-out`; p.style.strokeDashoffset='0';
    setTimeout(()=>{ p.style.transition=''; p.style.strokeDasharray=''; p.style.strokeDashoffset=''; if(me) p.setAttribute('marker-end',me); if(msA) p.setAttribute('marker-start',msA); },ms+20);
  }
  function gStop(svg){ (svg._tm||[]).forEach(clearTimeout); svg._tm=[]; svg.classList.remove('fx-hide','fx-playing'); qa('.on,.cur',svg).forEach(x=>x.classList.remove('on','cur')); const b=svg.closest('.kgraph'); const btn=b&&qs('.fx-gbtn',b); if(btn){ btn.textContent='▶ Проиграть'; btn.setAttribute('aria-pressed','false'); } const st=b&&qs('.fx-step',b); if(st) st.textContent=''; }
  function gPlay(svg,step,slow){
    const G=gPrep(svg); if(!G.edges.length) return;
    gStop(svg); gTrace(svg,null); svg._pin=null;
    svg.classList.add('fx-hide'); if(slow) svg.classList.add('fx-playing');
    const fig=svg.closest('.kgraph'); const btn=fig&&qs('.fx-gbtn',fig), st=fig&&qs('.fx-step',fig);
    if(slow&&btn){ btn.textContent='■ Стоп'; btn.setAttribute('aria-pressed','true'); }
    const tm=svg._tm=[];
    for(let s=0;s<=G.max;s++){
      tm.push(setTimeout(()=>{
        if(slow) qa('.cur',svg).forEach(x=>x.classList.remove('cur'));
        G.edges.forEach(e=>{ if(e._s===s){ e.classList.add('on'); drawEdge(e,Math.min(step*0.85,520)); } });
        G.nodes.forEach(g=>{ if(g._s===s){ g.classList.add('on'); if(slow) g.classList.add('cur'); } });
        if(slow&&st) st.textContent=`шаг ${s+1} из ${G.max+1}`;
      }, s*step));
    }
    tm.push(setTimeout(()=>gStop(svg), (G.max+1)*step + (slow?900:450)));
  }
  function gTrace(svg,id){
    qa('.tr',svg).forEach(x=>x.classList.remove('tr','tr-up','tr-dn','tr-me'));
    if(!id){ svg.classList.remove('fx-trace'); return; }
    const G=gPrep(svg); if(!G.N[id]) return;
    const walk=(start,dir)=>{ const seen=new Set([start]); const st=[start]; while(st.length){ const x=st.pop(); ((dir==='dn'?G.out:G.inc)[x]||[]).forEach(e=>{ e.classList.add('tr','tr-'+dir); const y=dir==='dn'?e.dataset.b:e.dataset.a; if(y&&G.N[y]&&!seen.has(y)){ seen.add(y); G.N[y].classList.add('tr'); st.push(y); } }); } };
    walk(id,'dn'); walk(id,'up');
    G.N[id].classList.add('tr','tr-me'); svg.classList.add('fx-trace');
  }
  function graphs(root){
    qa('.kgraph',root).forEach(fig=>{
      const svg=qs('.fig-scroll svg',fig); if(!svg||svg._fxb) return; svg._fxb=1;
      const G=gPrep(svg); if(!G.edges.length) return;
      const head=qs('.fig-head',fig);
      if(head && !qs('.fx-gbtn',head)) head.insertAdjacentHTML('beforeend',`<span class="fx-gctl"><span class="fx-step" aria-live="polite"></span><button type="button" class="fx-gbtn" aria-pressed="false" title="Пошагово показать, как развивается цепочка">▶ Проиграть</button></span>`);
      const sc=qs('.fig-scroll',fig); if(sc && !qs('.fx-hint',fig)) sc.insertAdjacentHTML('afterend',`<p class="fx-hint">Наведите на блок (на телефоне — нажмите): <span class="fx-dn">синим</span> — к чему он ведёт, <span class="fx-up">оранжевым</span> — откуда.</p>`);
      qs('.fx-gbtn',fig).addEventListener('click',()=>{ if(svg._tm&&svg._tm.length&&svg.classList.contains('fx-playing')) gStop(svg); else gPlay(svg,RM()?60:760,true); });
      svg.addEventListener('pointerover',e=>{ if(e.pointerType!=='mouse'||svg._pin||svg.classList.contains('fx-hide')) return; const g=e.target.closest('.gn-w'); gTrace(svg,g?g.dataset.n:null); });
      svg.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'&&!svg._pin) gTrace(svg,null); });
      svg.addEventListener('click',e=>{ if(svg.classList.contains('fx-hide')) return; const g=e.target.closest('.gn-w');
        if(!g){ svg._pin=null; gTrace(svg,null); return; }
        if(g.querySelector('[data-kd]')) return; // препарат: переход к карточке
        const id=g.dataset.n; if(svg._pin===id){ svg._pin=null; gTrace(svg,null); } else { svg._pin=id; gTrace(svg,id); } });
      svg.addEventListener('focusin',e=>{ const g=e.target.closest('.gn-w'); if(g&&!svg._pin) gTrace(svg,g.dataset.n); });
      svg.addEventListener('focusout',()=>{ if(!svg._pin) gTrace(svg,null); });
      if(!RM() && io){ const r=fig.getBoundingClientRect(); if(r.top>innerHeight*0.55){ watch(fig,()=>gPlay(svg,Math.max(70,Math.min(130,900/(G.max+1))),false)); } }
    });
  }

  /* ---------- прогресс чтения ---------- */

function highlight(fig, sites, act, badge=true){
  const svg=$('svg',fig), layer=$('.hl',svg); layer.innerHTML='';
  $$('.site.on',svg).forEach(e=>e.classList.remove('on'));
  const sym={stim:'+',block:'⊣',mod:'~'}[act];
  sites.forEach(s=>$$(`.site[data-site="${s}"]`,svg).forEach(el=>{
    el.classList.add('on'); const d=el.dataset, x=+d.cx, y=+d.cy; let bx,by;
    if(d.w){ const w=+d.w,h=+d.h; layer.insertAdjacentHTML('beforeend',`<rect class="ring ${act}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="10"/>`); bx=x+w/2-14; by=y-h/2; }
    else { const r=+d.r; layer.insertAdjacentHTML('beforeend',`<circle class="ring ${act}" cx="${x}" cy="${y}" r="${r}"/>`); bx=x+r*.72; by=y-r*.72; }
    if(badge) layer.insertAdjacentHTML('beforeend',`<circle class="badge-c ${act}" cx="${bx}" cy="${by}" r="10"/><text class="badge-t" x="${bx}" y="${by+4.2}" text-anchor="middle">${sym}</text>`);
  }));
}
function siteLabel(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s?plain(s.l):k; }
function siteInfo(b,k){ const s=(b.sites||{})[k] || (b.targets||[]).find(t=>t.k===k); return s; }
function activateChip(fig,b,i){

  <div class="fig-scroll"><svg viewBox="0 0 760 330" role="img" aria-label="Кривая концентрации при повторном введении" style="min-width:560px"><g class="plot"></g></svg></div>
  <div class="ctrl">
    <label for="${id}-th">Период полувыведения T½ <b class="o-th"></b><input id="${id}-th" type="range" min="1" max="24" step="1" value="6" data-v="th"></label>
    <label for="${id}-tau">Интервал введения τ <b class="o-tau"></b><input id="${id}-tau" type="range" min="2" max="24" step="1" value="8" data-v="tau"></label>
    <label for="${id}-f">Биодоступность F (внутрь) <b class="o-f"></b><input id="${id}-f" type="range" min="0.2" max="1" step="0.05" value="0.8" data-v="F"></label>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)">Путь и схема<div class="seg"><button type="button" data-route="iv" aria-pressed="true">в/в болюс</button><button type="button" data-route="po" aria-pressed="false">внутрь</button><button type="button" data-load="1" aria-pressed="false">нагрузочная доза</button></div></div>
  </div>
  <div class="ro"></div>
  <p class="fig-cap" style="padding-top:12px">Однокамерная модель, кинетика первого порядка. Концентрация выражена в долях C₀ = D / Vd после одной в/в дозы. Константа всасывания при приёме внутрь принята 1,2 ч⁻¹.</p></section>`;
}
function pkDraw(fig){
  const st=fig._pk; const {th,tau,F,route,load}=st;
  const k=Math.LN2/th, ka=1.2, R=1/(1-Math.exp(-k*tau));
  const Tmax=Math.min(144,Math.max(48,Math.ceil(Math.max(6*th,5*tau)/tau)*tau));

let kSpy=null;
