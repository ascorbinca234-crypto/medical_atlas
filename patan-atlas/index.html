<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2140">
<meta name="description" content="Атлас патологической анатомии по занятиям кафедры ПСПбГМУ: теория, микро- и макропрепараты из перечня с описанием, причинами и исходами, электронограммы, тесты. Норма и занятие 1 — без подписки.">
<title>Атлас патологической анатомии — Medical Atlas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap');
/* Дизайн-токены — как в атласе патофизиологии Medical Atlas.
   Цвет кодирует роль: синий — метод/механизм, красный — повреждение/морфология,
   зелёный — исход/компенсация, фиолетовый — значение/клиника. */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#EDEFF5; --ink:#1A1F33; --ink-2:#4B5268; --ink-3:#737A92; --line:#DCE0EA;
  --nav:#1C2140; --nav-2:#262C56; --nav-3:#323A70; --nav-ink:#E8EAF6; --nav-ink-2:#A3A9CA;
  --accent:#3E49C2; --accent-ink:#FFFFFF; --accent-soft:#E9EBFB; --on-tone:#FFFFFF; --mark:#FFE68A;
  --etio:#2563EB; --etio-bg:#EAF1FE; --etio-ink:#1D4CBD; --etio-line:#BFD3FB;
  --alt:#D9322B; --alt-bg:#FDEEEC; --alt-ink:#AF241C; --alt-line:#F3BFB9;
  --san:#16834A; --san-bg:#E7F5EC; --san-ink:#11663A; --san-line:#B3DDC2;
  --clin:#7A3FE0; --clin-bg:#F2ECFD; --clin-ink:#612EC0; --clin-line:#D6C6F7;
  --he-pink:#F3C6D6; --he-violet:#6D4C9A;
  --f-display:'Literata', Georgia, 'Times New Roman', serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --nav-w:296px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#161A2B; --surface-2:#1E2337; --ink:#E6E8F2; --ink-2:#AEB3C7; --ink-3:#848AA2; --line:#2B3148;
    --nav:#0A0D18; --nav-2:#181D33; --nav-3:#252B4A; --nav-ink:#E6E8F5; --nav-ink-2:#9298B8;
    --accent:#8E97F7; --accent-ink:#0F1220; --accent-soft:#1F2550; --on-tone:#0F1220; --mark:#5C4B10;
    --etio:#6AA8FF; --etio-bg:#13243F; --etio-ink:#9CC5FF; --etio-line:#25446F;
    --alt:#FF7A70; --alt-bg:#361717; --alt-ink:#FFA9A2; --alt-line:#6A2723;
    --san:#4FD58B; --san-bg:#0F2D1E; --san-ink:#8DE8B3; --san-line:#1E5638;
    --clin:#B394FF; --clin-bg:#241A42; --clin-ink:#CDB8FF; --clin-line:#463377;
    --he-pink:#4A2533; --he-violet:#B49AE0;
    color-scheme:dark;
  }
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
button,input{ font:inherit; color:inherit; background:none; border:0; }
button{ cursor:pointer; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
img{ display:block; max-width:100%; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ---------- каркас ---------- */
.pa-shell{ display:flex; min-height:100vh; }
.pa-nav{ position:fixed; inset:0 auto 0 0; width:var(--nav-w); background:var(--nav); color:var(--nav-ink); display:flex; flex-direction:column; z-index:40; transition:transform .2s; }
.pa-main{ flex:1; min-width:0; margin-left:var(--nav-w); }
.pa-scrim{ display:none; }
@media (max-width:1023px){
  .pa-nav{ transform:translateX(-102%); width:min(320px, 88vw); }
  .pa-shell.nav-open .pa-nav{ transform:none; box-shadow:0 0 40px rgba(0,0,0,.25); }
  .pa-shell.nav-open .pa-scrim{ display:block; position:fixed; inset:0; background:rgba(10,13,24,.45); z-index:35; }
  .pa-main{ margin-left:0; }
}
.pa-gutter{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
@media (min-width:1024px){ .pa-gutter{ padding-left:40px; padding-right:40px; } }
.pa-wrap{ max-width:1040px; margin:0 auto; }

/* ---------- навигация ---------- */
.nav-head{ padding:22px 20px 14px; }
.nav-eyebrow{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--nav-ink-2); }
.nav-title{ font-family:var(--f-display); font-size:22px; font-weight:700; line-height:1.2; margin-top:4px; }
.nav-search{ margin:4px 16px 10px; position:relative; }
.nav-search input{ width:100%; background:var(--nav-2); color:var(--nav-ink); border:1px solid var(--nav-3); border-radius:10px; padding:9px 12px 9px 34px; font-size:14px; }
.nav-search input::placeholder{ color:var(--nav-ink-2); }
.nav-search input:focus{ outline:none; border-color:var(--accent); }
.nav-search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--nav-ink-2); }
.nav-scroll{ flex:1; overflow:auto; padding:4px 10px 24px; scrollbar-width:thin; }
.nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:10px; font-size:14px; color:var(--nav-ink); transition:background .12s; }
.nav-item:hover{ background:var(--nav-2); }
.nav-item.is-active{ background:var(--nav-3); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
.nav-item .ic{ width:18px; height:18px; flex:none; color:var(--nav-ink-2); }
.nav-item .lbl{ flex:1; min-width:0; line-height:1.3; }
.nav-item .badge{ font-size:11px; padding:1px 7px; border-radius:99px; background:var(--nav-3); color:var(--nav-ink-2); font-variant-numeric:tabular-nums; }
.nav-sec{ display:flex; align-items:center; justify-content:space-between; margin:16px 10px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; color:var(--nav-ink-2); }
.nav-dot{ width:9px; height:9px; border-radius:50%; flex:none; border:1.5px solid var(--nav-ink-2); }
.nav-dot.seen{ border-color:var(--accent); background:transparent; }
.nav-dot.done{ border-color:var(--san); background:var(--san); }
.nav-empty{ padding:10px; color:var(--nav-ink-2); font-size:13px; }
.nav-foot{ padding:12px 20px 18px; border-top:1px solid var(--nav-2); font-size:12px; color:var(--nav-ink-2); }
.nav-foot a{ color:var(--nav-ink); text-decoration:underline; text-underline-offset:2px; }
mark{ background:rgba(255,230,138,.35); color:inherit; border-radius:3px; padding:0 1px; }

/* ---------- верхняя панель ---------- */
.pa-topbar{ position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.topbar-in{ display:flex; align-items:center; gap:10px; height:57px; }
.crumbs{ flex:1; min-width:0; font-size:13.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crumbs b{ color:var(--ink); font-weight:600; }
.icon-btn{ width:38px; height:38px; display:inline-grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); }
.icon-btn:hover{ background:var(--surface-2); }
.burger{ display:none; }
@media (max-width:1023px){ .burger{ display:inline-grid; } }
.pa-seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }
.pa-seg button{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:8px; font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
.pa-seg button:hover{ color:var(--ink); }
.pa-seg button.is-on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(15,18,32,.14); }
.pa-btn{ display:inline-flex; align-items:center; gap:.5rem; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:.5rem .85rem; font-size:14px; font-weight:500; line-height:1.2; transition:background .15s, border-color .15s; white-space:nowrap; }
.pa-btn:hover{ background:var(--surface-2); }
.pa-btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pa-btn-primary:hover{ background:var(--accent); filter:brightness(1.07); }
.pa-btn.is-done{ background:var(--san-bg); color:var(--san-ink); border-color:var(--san-line); }
.hide-sm{ }
@media (max-width:640px){ .hide-sm{ display:none !important; } .topbar-in{ gap:6px; } .pa-seg button{ padding:6px 8px; } }

/* ---------- типографика ---------- */
.eyebrow{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; line-height:1.3; color:var(--accent); }
.h1{ overflow-wrap:break-word; hyphens:auto; font-family:var(--f-display); font-weight:700; font-size:clamp(28px, 4vw, 38px); line-height:1.15; letter-spacing:-.01em; text-wrap:balance; }
.h2{ font-family:var(--f-display); font-weight:700; font-size:24px; line-height:1.2; }
.h3{ font-size:16px; font-weight:600; line-height:1.35; }
.muted{ color:var(--ink-2); } .faint{ color:var(--ink-3); }
.lead{ font-size:16.5px; color:var(--ink-2); margin-top:12px; max-width:70ch; }
.mono{ font-family:var(--f-mono); font-size:12px; }
b, strong{ font-weight:600; }

/* ---------- карточки ---------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; }
.pad{ padding:20px 22px; }
@media (max-width:640px){ .pad{ padding:16px; } }
.def{ background:var(--accent-soft); border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
.def .def-main{ font-family:var(--f-display); font-size:18.5px; line-height:1.5; font-weight:500; }
.def .def-note{ margin-top:12px; color:var(--ink-2); font-size:14.5px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:12.5px; padding:3px 10px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
.tone-etio{ background:var(--etio-bg); color:var(--etio-ink); border-color:var(--etio-line); }
.tone-alt{ background:var(--alt-bg); color:var(--alt-ink); border-color:var(--alt-line); }
.tone-san{ background:var(--san-bg); color:var(--san-ink); border-color:var(--san-line); }
.tone-clin{ background:var(--clin-bg); color:var(--clin-ink); border-color:var(--clin-line); }
.block{ margin-top:14px; overflow:hidden; }
.block-h{ display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--line); }
.block-h .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
.dot-etio{ background:var(--etio); } .dot-alt{ background:var(--alt); } .dot-san{ background:var(--san); } .dot-clin{ background:var(--clin); }
.block-b{ padding:14px 22px 18px; }
@media (max-width:640px){ .block-h,.block-b{ padding-left:16px; padding-right:16px; } }
.list > li{ position:relative; padding-left:16px; margin-top:9px; }
.list > li:first-child{ margin-top:0; }
.list > li::before{ content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--ink-3); }
.legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--ink-3); margin-top:12px; }
.legend span{ display:inline-flex; align-items:center; gap:6px; }

/* таблицы */
.tbl-wrap{ overflow-x:auto; margin-top:14px; }
table.pa-table{ width:100%; border-collapse:collapse; }
.pa-table caption{ text-align:left; padding:14px 16px 10px; font-weight:600; }
.pa-table th,.pa-table td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13.5px; line-height:1.45; text-align:left; }
.pa-table thead th{ background:var(--surface-2); font-size:12.5px; color:var(--ink-2); font-weight:600; }
.pa-table tbody th{ font-weight:600; }
.pa-table tbody tr:last-child th,.pa-table tbody tr:last-child td{ border-bottom:none; }

/* вкладки-якоря темы */
.anchor-tabs{ position:sticky; top:57px; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); margin-top:18px; }
.anchor-tabs .in{ display:flex; gap:22px; overflow-x:auto; scrollbar-width:none; }
.anchor-tabs .in::-webkit-scrollbar{ display:none; }
.atab{ display:inline-flex; align-items:center; gap:7px; padding:12px 2px 11px; border-bottom:2px solid transparent; color:var(--ink-2); font-size:14px; font-weight:500; white-space:nowrap; }
.atab:hover{ color:var(--ink); }
.atab.is-active{ color:var(--ink); border-bottom-color:var(--accent); }
.atab .cnt{ font-size:11px; padding:1px 6px; border-radius:99px; background:var(--surface-2); color:var(--ink-3); font-variant-numeric:tabular-nums; }
.section{ scroll-margin-top:118px; margin-top:34px; }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.section-head .note{ font-size:13px; color:var(--ink-3); max-width:52ch; }

/* ---------- микропрепараты ---------- */
.mp{ overflow:hidden; margin-top:16px; scroll-margin-top:118px; }
.mp-side{ display:grid; grid-template-columns:minmax(0, 300px) minmax(0,1fr); gap:0; }
@media (max-width:760px){ .mp-side{ grid-template-columns:1fr; } }
.mp-photo{ position:relative; background:var(--surface-2); border-right:1px solid var(--line); min-height:220px; }
@media (max-width:760px){ .mp-photo{ border-right:0; border-bottom:1px solid var(--line); } }
.mp-photo img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.ph{ position:absolute; inset:12px; border:1.5px dashed var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:14px; color:var(--ink-3); font-size:12.5px; }
.ph .ph-ring{ width:68px; height:68px; border-radius:50%; background:radial-gradient(circle at 35% 35%, var(--he-pink) 0 30%, transparent 31%), radial-gradient(circle at 62% 58%, var(--he-violet) 0 12%, transparent 13%), radial-gradient(circle at 40% 66%, var(--he-violet) 0 8%, transparent 9%), var(--surface); border:1px solid var(--line); opacity:.9; }
.ph .ph-file{ font-family:var(--f-mono); font-size:11px; color:var(--ink-2); word-break:break-all; background:var(--surface); border:1px solid var(--line); padding:3px 7px; border-radius:6px; }
.mp-body{ padding:18px 22px 20px; min-width:0; }
@media (max-width:640px){ .mp-body{ padding:16px; } }
.mp-num{ font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); letter-spacing:.02em; }
.mp-name{ font-size:17px; font-weight:600; line-height:1.35; margin-top:4px; }
.mp-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.mp-h{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; color:var(--ink-3); margin-top:16px; margin-bottom:6px; }
.mp-see{ font-size:14.5px; }
.mp-diff{ margin-top:14px; font-size:13.5px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border-left:3px solid var(--clin); }
.mp-diff b{ color:var(--clin-ink); }
.reveal{ margin-top:14px; }
.is-hidden{ display:none !important; }
.blurred{ filter:blur(6px); user-select:none; pointer-events:none; }

/* ---------- тест ---------- */
.quiz-q{ margin-top:12px; padding:18px 22px; }
@media (max-width:640px){ .quiz-q{ padding:16px; } }
.quiz-q .qn{ font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); }
.quiz-q .qt{ font-weight:600; font-size:15.5px; margin-top:4px; }
.opts{ display:grid; gap:8px; margin-top:12px; }
.opt{ text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:14.5px; line-height:1.4; display:flex; gap:10px; align-items:flex-start; }
.opt:hover:not([disabled]){ border-color:var(--accent); background:var(--accent-soft); }
.opt .k{ font-family:var(--f-mono); font-size:12px; color:var(--ink-3); padding-top:2px; }
.opt[disabled]{ cursor:default; }
.opt.right{ background:var(--san-bg); border-color:var(--san); color:var(--san-ink); }
.opt.wrong{ background:var(--alt-bg); border-color:var(--alt); color:var(--alt-ink); }
.expl{ margin-top:10px; font-size:13.5px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border-left:3px solid var(--accent); }
.quiz-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 18px; margin-top:12px; }
.progress{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; flex:1; min-width:120px; }
.progress > span{ display:block; height:100%; background:var(--accent); border-radius:inherit; transition:width .25s; }

/* ---------- обзор ---------- */
.stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); margin-top:22px; overflow:hidden; }
@media (max-width:640px){ .stats{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.stat{ padding:16px 18px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat .v{ font-family:var(--f-display); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
.stat .l{ font-size:12.5px; color:var(--ink-3); }
.topic-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:12px; }
@media (max-width:760px){ .topic-grid{ grid-template-columns:1fr; } }
.tcard{ display:block; padding:16px 18px; transition:border-color .15s; }
.tcard:hover{ border-color:var(--accent); }
.tcard .tt{ display:flex; gap:10px; align-items:flex-start; }
.tcard .tn{ font-family:var(--f-mono); font-size:12px; color:var(--ink-3); padding-top:3px; min-width:20px; }
.tcard .ti{ font-weight:600; line-height:1.3; }
.tcard .ts{ font-size:13px; color:var(--ink-3); margin-top:4px; }
.tcard .tm{ display:flex; gap:12px; font-size:12px; color:var(--ink-3); margin-top:10px; flex-wrap:wrap; }
.status{ margin-left:auto; flex:none; font-size:11.5px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--ink-3); }
.status.done{ background:var(--san-bg); color:var(--san-ink); border-color:var(--san-line); }
.status.seen{ background:var(--accent-soft); color:var(--accent); border-color:var(--line); }
.cta{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.footer{ margin:48px 0 40px; font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:16px; }
.pager{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:34px; }
.pager a{ padding:14px 16px; }
.pager .dir{ font-size:12px; color:var(--ink-3); }
.pager .nm{ font-weight:600; margin-top:2px; }
.pager .next{ text-align:right; }

/* диагностикум */
.diag-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; margin-top:12px; }
.dl-item{ display:flex; gap:12px; padding:12px; align-items:flex-start; text-align:left; }
.dl-item:hover{ border-color:var(--accent); }
.dl-thumb{ width:64px; height:64px; border-radius:10px; flex:none; background:var(--surface-2); border:1px dashed var(--line); overflow:hidden; position:relative; }
.dl-thumb img{ width:100%; height:100%; object-fit:cover; }
.dl-item .n{ font-family:var(--f-mono); font-size:11px; color:var(--ink-3); }
.dl-item .t{ font-size:13.5px; font-weight:600; line-height:1.3; margin-top:2px; }
.dl-item .s{ font-size:12px; color:var(--ink-3); margin-top:3px; }
.trainer{ margin-top:14px; overflow:hidden; }
.trainer-prompt{ padding:20px 22px; }
.trainer-photo{ background:var(--surface-2); border-bottom:1px solid var(--line); }
.trainer-photo img{ max-height:420px; width:100%; object-fit:contain; }
.filters{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.filters button{ font-size:13px; padding:5px 11px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); }
.filters button.is-on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

/* лайтбокс */

ярами — мезангий.","<b>Проксимальные канальцы</b> — более эозинофильные (много митохондрий), с щёточной каёмкой, просвет неровный.","<b>Дистальные канальцы</b> — светлее, поверхность эпителия ровная, просвет шире.","Корковое вещество — клубочки и извитые канальцы; мозговое — прямые канальцы, петли Генле, собирательные трубочки."]},{"h":"Печень","tone":"etio","li":["<b>Классическая долька</b>: в центре — <b>центральная вена</b>, по периферии — <b>портальные тракты</b> (триада: междольковые желчный проток, артерия и вена).","<b>Гепатоциты</b> — крупные полигональные клетки с центрально расположенным ядром, образуют балки; между балками — синусоиды с купферовскими клетками.","Соединительной ткани в норме мало — только в портальных трактах (её появление между дольками — признак склероза)."]},{"h":"Сердце","tone":"etio","li":["<b>Эндокард</b> — эндотелий на базальной мембране + рыхлая соединительная ткань.","<b>Миокард</b> — кардиомиоциты: поперечная исчерченность, одно-два центрально расположенных ядра, вставочные диски.","<b>Эпикард</b> — жировая ткань с сосудами и нервами, покрыт серозной оболочкой (мезотелий + рыхлая соединительная ткань)."]},{"h":"Лёгкое","tone":"etio","li":["<b>Бронхи</b>: однослойный многорядный реснитчатый эпителий (кроме терминальных бронхиол и альвеол), подслизистые белково-слизистые железы, гладкие миоциты (во всех бронхах), хрящ (кроме мелких и респираторных бронхиол).","<b>Альвеолы</b>: выстилка из альвеолоцитов I и II типа на базальной мембране, рядом — капилляры межальвеолярных перегородок; в просвете могут быть альвеолярные макрофаги."]},{"h":"Сосуды","tone":"etio","li":["<b>Артерии и вены</b> — 3 оболочки: <b>интима</b> (эндотелий + рыхлая соединительная ткань, гладкие миоциты), <b>медиа</b> (гладкие миоциты + эластические волокна), <b>адвентиция</b> (рыхлая соединительная ткань).","Артерии мышечного типа: хорошо видна внутренняя эластическая мембрана (выявляется фукселином), толстая медиа; вены — тонкая медиа, широкий спавшийся просвет.","<b>Капилляры</b> — эндотелий на базальной мембране и перициты."]},{"h":"Как узнать орган на малом увеличении","tone":"etio","li":["<b>Селезёнка</b>: лимфоидные фолликулы (белая пульпа) с эксцентрично лежащей центральной артерией среди красной пульпы, полной эритроцитов.","<b>Лимфатический узел</b>: капсула → субкапсулярный синус → корковое вещество с фолликулами (светлые центры размножения) → паракортикальная зона → мозговые тяжи и синусы.","<b>Головной мозг</b>: волокнистый фон (нейропиль), нейроны (пирамидные в коре, с ядрышком), глиальные ядра, тонкостенные сосуды.","<b>Желудок</b>: слизистая с ямками и плотно лежащими железами, мышечная пластинка, подслизистая; <b>толстая кишка</b> — прямые параллельные крипты с множеством бокаловидных клеток.","<b>Кожа</b>: многослойный плоский ороговевающий эпителий с сосочками, дерма из коллагена, придатки (волосяные фолликулы, сальные и потовые железы).","<b>Щитовидная железа</b>: фолликулы, выстланные кубическим эпителием и заполненные розовым коллоидом.","<b>Тимус</b>: дольки с тёмным корковым и светлым мозговым веществом, тельца Гассаля в мозговом."]},{"h":"Окраски: что каким цветом","tone":"clin","li":["Гематоксилин — <b>базофилия</b>: ядра, рибосомы (цитоплазма плазмоцитов), слизь (бледно), соли кальция — тёмно-фиолетовые.","Эозин — <b>оксифилия (эозинофилия)</b>: цитоплазма, коллаген, эритроциты, фибрин, фибриноид, гиалин, амилоид (бледно-розовый).","Специальные окраски нужны, чтобы доказать природу вещества: жир — судан III, гликоген — кармин Беста/ШИК, амилоид — конго красный, железо — реакция Перлса, кальций — метод Косса, коллаген — ван Гизон."]}],"micro":[],"macro":[],"em":[],"quiz":[{"q":"Каким признаком проксимальный каналец почки отличается от дистального?","o":["Эозинофильный эпителий со щёточной каёмкой","Светлый эпителий с ровной поверхностью","Наличие подоцитов","Наличие мезангия"],"a":0,"ex":"Много митохондрий даёт эозинофилию, щёточная каёмка — признак проксимального отдела."},{"q":"Что находится в портальном тракте печени?","o":["Междольковые желчный проток, артерия и вена","Центральная вена","Синусоиды и купферовские клетки","Пространство Диссе"],"a":0,"ex":"Центральная вена — в центре дольки, портальные тракты — на периферии."},{"q":"Клетками в строгом смысле среди форменных элементов крови являются:","o":["Лейкоциты","Эритроциты","Тромбоциты","Все форменные элементы"],"a":0,"ex":"Эритроциты и тромбоциты не имеют ядра."},{"q":"Внутреннюю эластическую мембрану артерии лучше всего выявляет окраска:","o":["Фукселином","Суданом III","Конго красным","По Перлсу"],"a":0,"ex":"Фукселин (по Харту, Вейгерту) окрашивает эластические волокна в тёмно-фиолетовый цвет."},{"q":"Мезангий находится:","o":["Между капиллярами почечного клубочка","В стенке проксимального канальца","В портальном тракте печени","В межальвеолярной перегородке"],"a":0,"ex":"Мезангий — опорная ткань клубочка; в патологии в нём откладываются амилоид и иммунные комплексы."}],"key":["<b>Г-Э</b>: ядра — сине-фиолетовые (гематоксилин, основной краситель), цитоплазма, коллаген, эритроциты — розовые/красные (эозин, кислый краситель).","<b>Почка</b>: клубочки (капиллярный клубок + капсула Шумлянского–Боумена) среди канальцев; проксимальные — широкий эпителий со щёточной каёмкой, узкий просвет; дистальные — низкий эпителий, широкий просвет.","<b>Печень</b>: балки гепатоцитов радиально сходятся к центральной вене; на периферии дольки — портальные тракты (триада: артерия, вена, жёлчный проток).","<b>Миокард</b>: ветвящиеся кардиомиоциты с <b>центральным</b> ядром и вставочными дисками; скелетная мышца — ядра по периферии волокна.","<b>Лёгкое</b>: тонкостенные альвеолы, перегородки с капиллярами; бронх — мерцательный эпителий, хрящ, железы.","<b>Артерия</b> мышечного типа: толстая медия, выраженная внутренняя эластическая мембрана; <b>вена</b> — тонкая стенка, широкий просвет, нет чёткой мембраны."],"schemes":[{"type":"tree","title":"Определяем орган по ключевым структурам","groups":[{"t":"Почка","tone":"etio","items":["Клубочки + капсула","Проксимальные канальцы: щёточная каёмка","Дистальные: широкий просвет"]},{"t":"Печень","tone":"alt","items":["Балки гепатоцитов","Центральная вена","Портальные триады по периферии дольки"]},{"t":"Сердце","tone":"clin","items":["Ветвящиеся волокна","Центральное ядро","Вставочные диски"]},{"t":"Лёгкое","tone":"san","items":["Альвеолы, тонкие перегородки","Бронхи с хрящом","Сосуды малого круга"]}]},{"type":"compare","title":"Артерия, вена, капилляр","cols":[{"t":"Артерия мышечного типа","tone":"alt"},{"t":"Вена","tone":"etio"},{"t":"Капилляр","tone":"san"}],"rows":[["Стенка","Толстая, просвет округлый","Тонкая, просвет широкий, часто спавшийся","Один слой эндотелия + базальная мембрана"],["Эластика","Выраженная внутренняя эластическая мембрана (волнистая)","Мембрана не выражена","Нет"],["Средняя оболочка","Много циркулярных гладкомышечных клеток","Тонкая, преобладает адвентиция","Перициты"]]}],"locked":false,"_counts":{"kaf":0,"extra":0,"macro":0,"em":0,"schemes":2,"quiz":5},"_cover":null},{"id":"necrosis","lesson":1,"title":"Некроз. Апоптоз","sub":"Признаки, морфогенез и формы некроза, исходы; апоптоз; посмертные изменения","tags":["паранекроз","некробиоз","аутолиз","кариопикноз","кариорексис","кариолизис","коагуляционный","казеозный","ценкеровский","колликвационный","гангрена","секвестр","пролежень","апоптоз","тельца Каунсильмена","каспазы","демаркация","маляция","мумификация","гетеролиз"],"def":"<b>Некроз</b> — гибель клеток и тканей в живом организме, сопровождающаяся необратимым прекращением их жизнедеятельности. Развивается через стадии: <b>паранекроз</b> (обратимые изменения) → <b>некробиоз</b> (необратимые дистрофические изменения) → <b>смерть клетки</b> → <b>аутолиз</b> (разложение под действием гидролитических ферментов погибших клеток и макрофагов).","defNote":"<b>Апоптоз</b> — генетически запрограммированная, энергозависимая гибель отдельных клеток без воспалительной реакции.","blocks":[{"h":"Признаки некроза","tone":"alt","li":["<b>Макроскопические</b>: бесструктурность, тусклость, изменение цвета (серо-жёлтый, грязно-серый, красный, чёрный), изменение консистенции (плотная сухая — <b>мумификация</b>, дряблая кашицеобразная — <b>маляция</b>), особая форма (при инфаркте), изменение запаха (при гнилостном расплавлении).","<b>Ядро</b> — главный признак гибели клетки («пока есть ядро — клетка жива»): <b>кариопикноз → кариорексис → кариолизис</b>.","<b>Цитоплазма</b>: <b>плазмокоагуляция</b> (ярко-розовые глыбки) → <b>плазморексис</b> → <b>плазмолиз</b>.","<b>Межуточное вещество</b>: расщепление ретикулярных, коллагеновых и эластических волокон протеазами; пропитывание фибрином — фибриноидный некроз.","Погибшая ткань превращается в <b>тканевой детрит</b>; вокруг — <b>демаркационное воспаление</b>, граница — демаркационная линия."]},{"h":"Классификация","tone":"etio","li":["<b>По причине</b>: травматический, токсический, трофоневротический (пролежни, незаживающие язвы при нарушении иннервации), аллергический (феномен Артюса, фибриноидный некроз при ревматических болезнях), сосудистый (инфаркт).","<b>По механизму</b>: <b>прямой</b> (травма, токсины — непосредственное действие) и <b>непрямой</b> (опосредованный сосудистой, нервной, иммунной системами).","<b>Клинико-морфологические формы</b>: коагуляционный (сухой), колликвационный (влажный), гангрена, секвестр, инфаркт."]},{"h":"Клинико-морфологические формы некроза","tone":"alt","li":["<b>Коагуляционный (сухой)</b> — ткани, богатые белком и бедные жидкостью: инфаркты миокарда, почек, селезёнки; <b>казеозный (творожистый)</b> — туберкулёз, сифилис, лепра, лимфогранулематоз (крошащиеся желтовато-белые массы); <b>восковидный (ценкеровский)</b> — прямые мышцы живота и приводящие мышцы бедра при брюшном и сыпном тифе; <b>фибриноидный</b> — при аллергических и аутоиммунных болезнях; <b>жировой (стеатонекроз)</b> — ферментативный (панкреонекроз: бляшки стеаринового некроза) и неферментативный (травма молочной железы, клетчатки).","<b>Колликвационный (влажный)</b> — ткани, бедные белком и богатые жидкостью, с высокой активностью гидролаз: <b>головной мозг</b> (очаг серого размягчения — ишемический инфаркт мозга); вторичная колликвация — при присоединении гнойной инфекции.","<b>Гангрена</b> — некроз тканей, соприкасающихся с внешней средой; ткань чёрная из-за сульфида железа. <b>Сухая</b> (мумификация) — конечности при атеросклерозе и облитерирующем эндартериите, отморожениях, ожогах, болезни Рейно; чёткая демаркация. <b>Влажная</b> — при присоединении гнилостной инфекции и отёке: кишка, лёгкое, конечности при венозном застое; <b>нома</b> (водяной рак — мягкие ткани щеки у ослабленных детей). <b>Газовая</b> (анаэробная) — клостридии, крепитация. <b>Пролежень</b> — участки поверхностных тканей над костными выступами (трофоневротический).","<b>Секвестр</b> — участок мёртвой ткани, не подвергающийся аутолизу и свободно расположенный среди живой ткани (кость при остеомиелите), поддерживает нагноение.","<b>Инфаркт</b> — сосудистый (ишемический) некроз (см. тему «Ишемия и инфаркт»)."]},{"h":"Исходы и значение","tone":"san","li":["<b>Демаркационное воспаление</b> на границе с живой тканью: полнокровие, лейкоциты, макрофаги, лизис и рассасывание.","<b>Благоприятные</b>: организация (замещение соединительной тканью → рубец), инкапсуляция, петрификация, оссификация, образование кисты (в мозге — на месте колликвационного некроза), мутиляция (отторжение — самоампутация при сухой гангрене).","<b>Неблагоприятные</b>: гнойное расплавление (септическое) с возможным сепсисом.","Значение определяется локализацией и объёмом: некроз жизненно важных органов (миокард, мозг) часто смертелен; казеоз — источник прогрессирования туберкулёза."]},{"h":"Апоптоз","tone":"clin","li":["<b>Где в норме</b>: эмбриогенез, физиологическая инволюция, смена клеточных популяций (эпителий кишки, эндометрий), удаление аутореактивных лимфоцитов в тимусе.","<b>Где в патологии</b>: вирусный гепатит (<b>тельца Каунсильмена</b> — ацидофильные тельца), атрофия, опухоли, действие цитотоксических Т-лимфоцитов, облучение, химиотерапия.","<b>Морфология</b>: сморщивание клетки, конденсация хроматина в виде полумесяцев под ядерной мембраной, фрагментация ядра, образование <b>апоптотических телец</b> (фрагменты цитоплазмы с органеллами и хроматином в мембране), фагоцитоз соседними клетками и макрофагами без воспаления.","<b>Механизмы</b>: внешний путь — рецепторы смерти (Fas, рецептор TNF) → каспаза-8; внутренний (митохондриальный) — выход цитохрома c, регуляция белками семейства Bcl-2 (Bcl-2 — антиапоптотический, Bax — проапоптотический) → каспаза-9; исполнительные каспазы (каспаза-3) — межнуклеосомная фрагментация ДНК («лесенка» при электрофорезе)."]},{"h":"Смерть, посмертный аутолиз и посмертные изменения","tone":"clin","li":["<b>Аутолиз</b> — разложение мёртвого субстрата ферментами самой клетки; <b>гетеролиз</b> — ферментами лизосом лейкоцитов и макрофагов.","<b>Клиническая смерть</b> — обратимый этап (5–6 мин при нормотермии); <b>биологическая</b> — необратимые изменения, прежде всего в коре головного мозга.","<b>Посмертные изменения</b>: охлаждение, трупное окоченение, трупное высыхание (пятна Лярше), перераспределение крови, трупные пятна (гипостаз → стаз → имбибиция), трупное свёртывание крови, аутолиз (раньше всего — железы, желудок, поджелудочная железа), гниение."]},{"h":"Патогенез некроза: что убивает клетку","tone":"etio","li":["<b>Дефицит АТФ</b> (гипоксия): отказ Na⁺/K⁺-АТФазы → натрий и вода в клетку → набухание, расширение ЭПС, отделение рибосом; анаэробный гликолиз → лактат → ацидоз → конденсация хроматина.","<b>Перегрузка кальцием</b>: активация фосфолипаз, протеаз, эндонуклеаз, АТФаз → разрушение мембран, цитоскелета и ДНК.","<b>Свободные радикалы</b> (особенно при реперфузии): перекисное окисление липидов мембран, повреждение белков и ДНК.","<b>Повреждение мембран</b> (лизосомальных, плазматической, митохондриальной): выход ферментов лизосом → аутолиз; открытие митохондриальной поры → необратимая утрата АТФ.","<b>Точка необратимости</b> — тяжёлое повреждение митохондрий (аморфные кальциевые депозиты в матриксе) и разрывы мембран."]},{"h":"Апоптоз: механизмы","tone":"clin","li":["<b>Внешний (рецепторный) путь</b>: Fas-лиганд/TNF связываются с «рецепторами смерти» → активация каспазы-8.","<b>Внутренний (митохондриальный) путь</b>: повреждение ДНК, дефицит факторов роста → p53, белки Bax/Bak увеличивают проницаемость митохондрий → выход цитохрома c → апоптосома → каспаза-9. Bcl-2 тормозит этот путь.","Оба пути сходятся на <b>эффекторных каспазах</b> (каспаза-3): фрагментация ДНК, разрушение цитоскелета, образование апоптотических телец с «меткой» фосфатидилсерина для фагоцитоза.","Значение: эмбриогенез, обновление тканей, гибель лимфоцитов в тимусе, атрофия; нарушение апоптоза — опухоли (мутация p53, гиперэкспрессия Bcl-2), аутоиммунные болезни."]}],"tables":[{"cap":"Некроз и апоптоз — сравнение","head":["Признак","Некроз","Апоптоз"],"rows":[["Распространённость","Группа клеток, участок ткани","Единичные клетки"],["Размер клетки","Набухание","Сморщивание"],["Ядро","Пикноз → рексис → лизис","Конденсация хроматина у мембраны, фрагментация"],["Мембрана","Разрушается","Сохранена (апоптотические тельца)"],["Энергия (АТФ)","Не требует","Требует"],["Воспаление","Есть (демаркация)","Нет"],["ДНК","Беспорядочная деградация («смазанные» фрагменты)","Межнуклеосомная фрагментация («лесенка»)"]]}],"micro":[{"id":"necrotic-nephrosis","name":"Коагуляционный некроз эпителия извитых канальцев почки","organ":"Почка","stain":"Гематоксилин и эозин","see":"Эпителий извитых канальцев набухший, клетки без ядер (кариолизис), цитоплазма гомогенная, местами распадается; в просветах канальцев — эозинофильные белковые массы и слущенный эпителий. <b>Поражены только канальцы — клубочки сохранны.</b> Строма отёчна.","look":["Канальцы «без ядер» — главный признак","Клубочки и петли Генле относительно сохранны","Отёк стромы, разрывы базальных мембран"],"diff":"Аутолиз — нет демаркационной реакции, равномерно по всему срезу; некроз прижизненный — с реакцией окружающих тканей.","kaf":[1],"cause":"Ткань богата белком и бедна жидкостью; действие экзо- и эндогенных повреждающих факторов — отравление сулемой и другими нефротоксическими ядами, шок, сепсис.","out":"Гнойное расплавление, склероз, гиалиноз, обызвествление; клинически — острая почечная недостаточность.","draw":{"stain":"he","base":"kidney","fx":[{"t":"tubNecrosis"}],"lb":[["necrosis","Эпителий извитых канальцев без ядер (кариолизис), цитоплазма гомогенная"],["glomerulus","Клубочек сохранён"],["tubule","Дистальный каналец с ядрами — некроз избирателен"]]}},{"id":"caseous-pneumonia","kaf":[1],"name":"Казеозная пневмония","organ":"Лёгкое","stain":"Гематоксилин и эозин","see":"Лёгочная ткань безвоздушна: альвеолы и межальвеолярные перегородки замещены обширными гомогенными эозинофильными бесструктурными очагами казеозного некроза с ядерной пылью; по периферии — экссудат и узкий вал эпителиоидных клеток, лимфоцитов, единичных гигантских клеток.","look":["Сливные безвоздушные розовые очаги творожистого некроза","Казеоз — разновидность коагуляционного некроза («творог»)","Слабая клеточная реакция по краю — признак тяжёлого течения"],"cause":"Туберкулёз (преимущественно у ослабленных, при иммунодефиците): обширная воспалительная реакция по типу казеозного распада.","out":"Смерть от интоксикации; формирование гигантской полости или множества каверн с массивным бактериовыделением — фиброзно-кавернозный туберкулёз; редко — цирроз лёгкого.","diff":"Крупозная пневмония — альвеолы заполнены фибрином и нейтрофилами, но перегородки сохранны, некроза ткани нет.","draw":{"stain":"he","base":"lung","fx":[{"t":"exudateAlv","cells":4,"p":0.7},{"t":"necrosis","x":250,"y":165,"r":120,"col":"#f2b3cb","dust":340,"op":0.95}],"lb":[["necrosis","Казеозный некроз: бесструктурные эозинофильные массы с ядерной пылью"],["exudate","Альвеолы с серозно-фибринозным экссудатом по периферии"]]}},{"id":"caseous-node","name":"Казеозный некроз лимфати ого мозга (очаг серого размягчения)","organ":"Головной мозг","stain":"Гематоксилин и эозин","see":"Участок мозговой ткани разрежен, бледный, с мелкоячеистой структурой: нейроны и глия погибли, ткань расплавлена. В очаге — зернистые шары (макрофаги-липофаги с пенистой цитоплазмой, нагруженные липидами миелина). По периферии — пролиферация астроцитов, полнокровные сосуды. В исходе — киста с глиальной стенкой.","look":["Разжиженная сетчатая ткань","Зернистые шары (липофаги)","Глиальная реакция по краю"],"kaf":[],"draw":{"stain":"he","base":"brain","v":{"neurons":4},"fx":[{"t":"necrosis","x":250,"y":160,"r":105,"col":"#f9e9f0","dust":60,"op":0.92},{"t":"infiltrate","box":[170,90,330,230],"n":26,"kind":["macro"],"d":22}],"lb":[["necrosis","Очаг размягчения: разрежённая бесструктурная ткань, кашицеобразный детрит"],["infiltrate","Зернистые шары — макрофаги, нагруженные липидами"],["neuron","Сохранная ткань мозга"]]},"diff":"С отёком мозга: при отёке структура ткани сохранена, есть только расширенные периваскулярные пространства; в очаге размягчения ткань разрушена, видны зернистые шары."},{"id":"councilman","name":"Апоптоз гепатоцитов: тельца Каунсильмена при вирусном гепатите","organ":"Печень","stain":"Гематоксилин и эозин","see":"Среди гепатоцитов с гидропической (баллонной) дистрофией — единичные сморщенные клетки с гомогенной ярко-эозинофильной цитоплазмой и пикнотичным или фрагментированным ядром; округлые ацидофильные тельца (тельца Каунсильмена), часть — без ядра, лежащие в синусоидах или фагоцитированные. Воспалительная инфильтрация портальных трактов и долек лимфоцитами.","look":["Единичные (а не группы!) округлые эозинофильные тельца","Отсутствие воспалительной реакции вокруг самого тельца","Фон — баллонная дистрофия, лимфоцитарная инфильтрация"],"kaf":[],"draw":{"stain":"he","base":"liver","fx":[{"t":"councilman","n":7,"infl":30}],"lb":[["apoptotic","Тельце Каунсильмена: сжатый эозинофильный гепатоцит с пикнотичным ядром"],["cv","Центральная вена"],["infiltrate вид некроза.","defNote":"Форма инфаркта определяется типом ветвления артерий органа: магистральный тип → правильная (клиновидная) форма, рассыпной → неправильная.","blocks":[{"h":"Формы инфаркта","tone":"alt","li":["<b>По форме</b>: <b>клиновидный (конический)</b> — в органах с магистральным типом ветвления артерий и слабыми коллатералями (почки, селезёнка, лёгкие): основание обращено к капсуле, вершина — к воротам; <b>неправильной формы</b> — при рассыпном/смешанном типе (сердце, мозг, кишечник).","<b>По цвету</b>: <b>белый (ишемический)</b> — селезёнка, головной мозг; <b>белый с геморрагическим венчиком</b> — почки, миокард (венчик — зона демаркации: спазм сменяется паралитическим расширением сосудов и диапедезом); <b>красный (геморрагический)</b> — лёгкие (на фоне венозного застоя и при двойном кровоснабжении), кишечник, головной мозг (при тромбозе венозных синусов), сетчатка.","<b>По консистенции</b>: сухой (коагуляционный — сердце, почки, селезёнка) и влажный (колликвационный — мозг).","<b>Инфаркт миокарда</b> по локализации: передней, задней (нижней), боковой стенки, перегородки; по отношению к слоям: субэндокардиальный, интрамуральный, субэпикардиальный, трансмуральный."]},{"h":"Инфаркты органов","tone":"alt","li":["<b>Головной мозг</b> — белый (реже красный), влажный (колликвационный), неправильной формы; причины — атеросклероз, гипертоническая болезнь, тромбоэмболия; исход — киста.","<b>Селезёнка</b> — белый, сухой, правильной (треугольной) формы: желтоватый тусклый бесструктурный очаг, основанием обращён к капсуле, выступает над поверхностью разреза.","<b>Миокард</b> — белый с геморрагическим венчиком, неправильной формы.","<b>Почка</b> — белый или белый с геморрагическим венчиком, правильной формы: треугольник основанием к капсуле, окружён тёмно-красным венчиком.","<b>Лёгкое</b> — геморрагический, правильной формы: тёмно-красный безвоздушный плотный очаг основанием к плевре, на плевре — фибринозные наложения. Механизм: при венозном застое и закрытии ветви лёгочной артерии кровь из бронхиальных артерий по анастомозам под давлением поступает в зону некроза, капилляры рвутся и ткань пропитывается эритроцитами.","<b>Кишка</b> — геморрагический, влажный, неправильной формы: отёчные утолщённые красно-чёрные петли, серозная оболочка тусклая, с фибрином. Цвет отражает стадию: <b>белая</b> — ишемия, <b>красная</b> — инфаркт, <b>чёрная</b> — гангрена."]},{"h":"Морфогенез и демаркация","tone":"etio","li":["Через ~6–12 ч в миокарде появляется зона некроза (кариолизис, гомогенизация и эозинофилия волокон), к 24 ч формируется <b>зона демаркационного воспаления</b>: полнокровные сосуды, кровоизлияния, лейкоцитарный вал.","Со 2–3 суток — макрофаги, рассасывание некротических масс; с конца 1-й недели — грануляционная ткань по периферии; к 6–8 неделям — рубец (постинфарктный крупноочаговый кардиосклероз)."]},{"h":"Исходы и значение","tone":"san","li":["<b>Благоприятные</b>: организация и образование рубца; инкапсуляция; петрификация; гемосидероз (при геморрагическом инфаркте); на месте инфаркта мозга — <b>киста</b>.","<b>Неблагоприятные</b>: <b>септическое расплавление</b> (при тромбобактериальной эмболии — абсцессы), миомаляция и разрыв сердца (гемотампонада).","Значение: инфаркт миокарда — основная форма ИБС; инфаркт мозга (ишемический инсульт) — инвалидизация и смерть; инфаркт лёгкого → инфаркт-пневмония, плеврит; инфаркт селезёнки → перисплениты; инфаркт кишки → гангрена, перитонит."]},{"h":"Почему инфаркт бывает красным","tone":"etio","li":["<b>Лёгкое</b>: двойное кровоснабжение (лёгочная и бронхиальные артерии) + <b>венозный застой</b> в малом круге. При закупорке ветви лёгочной артерии кровь из бронхиальных артерий пропитывает некротизированную ткань.","<b>Кишка</b>: обилие анастомозов и рыхлая ткань; при тромбозе брыжеечных артерий или вен — геморрагическое пропитывание стенки → гангрена кишки.","<b>Головной мозг</b>: красный (геморрагический) инфаркт при эмболии, когда кровоток восстанавливается в повреждённой зоне (реперфузия)."]}],"micro":[{"id":"kidney-infarct","name":"Анемический (ишемический) инфаркт почки","organ":"Почка","stain":"Гематоксилин и эозин","see":"Зона некроза — безъядерные клубочки и канальцы (видны их контуры), местами цитоплазма лизирована — бесструктурные розовые массы; ядра в состоянии кариопикноза, кариорексиса, кариолизиса. По периферии — демаркационное воспаление: расширенные полнокровные сосуды, кровоизлияния, скопления полиморфноядерных лейкоцитов. В сохранной ткани — дистрофия эпителия канальцев.","look":["Тени структур без ядер (коагуляционный некроз)","Три зоны: некроз — демаркация (полнокровие + лейкоциты) — живая ткань","Клиновидная форма участка (если виден целиком)"],"kaf":[1],"cause":"Закупорка артерии почки тромбом или эмболом (тромбы левого сердца, атеросклероз аорты), длительный спазм.","out":"Рубец (втяжение на поверхности почки), гнойное расплавление (при инфицированном эмболе), образование кисты.","draw":{"stain":"he","base":"kidney","v":{"many":1},"fx":[{"t":"necrosis","x":150,"y":150,"r":125,"ghost":1},{"t":"demarc","hem":1}],"lb":[["necrosis","Зона некроза: «тени» канальцев и клубочков без ядер"],["demarc","Демаркационная зона: полнокровие, кровоизлияния, лейкоциты"],[[440,285],"Сохранная ткань почки"]]},"diff":"С некротическим нефрозом: инфаркт — клиновидная зона, где погибли <b>и клубочки, и канальцы, и строма</b>; при нефрозе некроз только эпителия канальцев, клубочки сохранны."},{"id":"myocardial-infarct","name":"Инфаркт миокарда в некротической стадии","organ":"Сердце","stain":"Гематоксилин и эозин","see":"Очаг безъядерных кардиомиоцитов с глыбчатым распадом цитоплазмы (плазморексис) без поперечной исчерченности; по периферии — зона демаркационного воспаления с интенсивной инфильтрацией полиморфноядерными лейкоцитами, расширенными полнокровными сосудами, кровоизлияниями; в сохранном миокарде — дистрофия кардиомиоцитов.","look":["Безъядерные гомогенные кардиомиоциты","Лейкоцитарный вал (1–3 сутки) или грануляции (с конца 1-й недели) — определи давность","Отсутствие поперечной исчерченности"],"kaf":[1],"cause":"Тромбоз, эмболия, спазм коронарных артерий на фоне атеросклероза.","out":"Организация с образованием рубца; миомаляция и разрыв сердца, острая аневризма, кардиогенный шок, фибрилляция желудочков, смерть.","draw":{"stain":"he","base":"heart","fx":[{"t":"necrosis","x":190,"y":160,"r":115,"col":"#ffb8d0","dust":120},{"t":"demarc"}],"lb":[["necrosis","Некроз кардиомиоцитов: гомогенизация, кариолизис"],["demarc","Лейкоцитарный демаркационный вал"],[[450,290],"Сохранный миокард"]]},"diff":"С жировой дистрофией и ишемической стадией: в некротической стадии — кариолизис и лейкоцитарный вал; в ишемическую стадию (первые часы) на Г-Э изменения почти не видны."},{"id":"mi-organization","kaf":[1,4],"name":"Инфаркт миокарда в стадии организации","organ":"Сердце","stain":"Гематоксилин и эозин","see":"Поля безъядерных кардиомиоцитов, интенсивно инфильтрированные лейкоцитами и макрофагами. По периферии — грануляционная ткань: тонкостенные расширенные полнокровные сосуды, клетки фибробластического ряда, тонкие соединительнотканные волокна, единичные лейкоциты.","look":["Безъядерные кардиомиоциты в центре + макрофаги","Грануляционная ткань по периферии — признак давности (с конца 1-й недели)","Отличие от некротической стадии: вместо лейкоцитарного вала — грануляции"],"cause":"Тромбоз, эмболия, спазм коронарных артерий (атеросклероз).","out":"Рубец (постинфарктный кардиосклероз), хроническая аневризма сердца, аритмии и нарушения проводимости, снижение сократительной способности миокарда, смерть.","draw":{"stain":"he","base":"heart","fx":[{"t":"rect","box":[0,70,300,250],"col":"st"},{"t":"granTissue","box":[0,70,300,250],"n":150},{"t":"pigment","where":"box","box":[20,90,280,230],"n":4,"col":"#a86a28","name":"siderophage"}],"lb":[["granulation","Грануляционная ткань замещает некроз"],["siderophage","Сидерофаги"],[[420,160],"Сохранные кардиомиоциты"]]},"diff":"С межуточным миокардитом: при организации инфаркта —     return '<figure class="mp-photo" data-file="' + esc(item.file) + '"><div class="ph"><div class="ph-ring" aria-hidden="true"></div><div>' + (kind === "em" ? "Место под электронограмму" : "Место под фото макропрепарата") + '</div><div class="ph-file">' + esc(item.file) + '</div></div></figure>';
  }
  function macroCard(x, exam) {
    var body = '<div class="mp-h">Описание</div><p class="mp-see">' + x.see + '</p>' + causeOut(x);
    var head = '<h3 class="mp-name">' + esc(x.name) + '</h3><div class="mp-meta">' + kafChip(x) + '</div>';
    var inner = exam
      ? '<div class="js-q"><h3 class="mp-name">Что за макропрепарат?</h3><p class="mp-see" style="margin-top:8px">' + x.see + '</p></div><div class="js-ans is-hidden">' + head + causeOut(x) + '</div><button class="pa-btn pa-btn-primary reveal" data-reveal>Показать ответ</button>'
      : head + body;
    return '<article class="card mp mp-side" id="mac-' + esc(x.id) + '">' + photoBox(x, "macro") + '<div class="mp-body"><div class="mp-num">Макропрепарат ' + esc(x.num.replace("М ", "")) + '</div>' + inner + '</div></article>';
  }
  function emCard(e, exam) {
    var body = '<div class="mp-h">Что видно</div><p class="mp-see">' + e.see + '</p><div class="mp-h">На что смотреть</div><ul class="list">' + e.look.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul>';
    var inner = exam
      ? '<div class="js-q"><h3 class="mp-name">Что на электронограмме?</h3><p class="mp-see" style="margin-top:8px">' + e.see + '</p></div><div class="js-ans is-hidden"><h3 class="mp-name">' + esc(e.name) + '</h3>' + body + '</div><button class="pa-btn pa-btn-primary reveal" data-reveal>Показать ответ</button>'
      : '<h3 class="mp-name">' + esc(e.name) + '</h3>' + body;
    return '<article class="card mp mp-side" id="em-' + esc(e.id) + '">' + photoBox(e, "em") + '<div class="mp-body"><div class="mp-num">' + esc(e.num) + '</div>' + inner + '</div></article>';
  }

  /* ---------- тест ---------- */
  function renderQuiz(t) {
    var box = $("#quizBox"); if (!box) return;
    var run = quizRun[t.id] || (quizRun[t.id] = { attempt: (S.quiz[t.id] && S.quiz[t.id].attempts) || 0, answers: {} });
    var r = rng(t.id + ":" + run.attempt);
    var order = shuffle(t.quiz.map(function (_, i) { return i; }), r);
    var html = "";
    order.forEach(function (qi, n) {
      var q = t.quiz[qi], opts = shuffle(q.o.map(function (_, i) { return i; }), r), ans = run.answers[qi];
      html += '<div class="card quiz-q" data-q="' + qi + '"><div class="qn">Вопрос ' + (n + 1) + ' из ' + t.quiz.length + '</div><div class="qt">' + esc(q.q) + '</div><div class="opts">' +
        opts.map(function (oi, k) {
          var cls = ans == null ? "" : oi === q.a ? " right" : oi === ans ? " wrong" : "";
          return '<button class="opt' + cls + '" data-o="' + oi + '"' + (ans != null ? " disabled" : "") + '><span class="k">' + "АБВГДЕ"[k] + '</span><span>' + esc(q.o[oi]) + '</span></button>';
        }).join("") + '</div>' +
        (ans != null ? '<div class="expl"><b>' + (ans === q.a ? "Верно." : "Неверно.") + '</b> ' + esc(q.ex) + '</div>' : "") + '</div>';
    });
    var answered = Object.keys(run.answers).length, right = Object.keys(run.answers).filter(function (k) { return run.answers[k] === t.quiz[k].a; }).length;
    html += '<div class="card quiz-bar"><div class="progress" aria-hidden="true"><span style="width:' + Math.round(100 * answered / t.quiz.length) + '%"></span></div><div><b>' + right + '</b> верно · отвечено ' + answered + ' из ' + t.quiz.length + '</div>' +
      (answered === t.quiz.length ? '<button class="pa-btn pa-btn-primary" id="quizAgain">Пройти заново</button>' : "") + '</div>';
    box.innerHTML = html;
    $$(".opt", box).forEach(function (b) {
      b.onclick = function () {
        var qEl = b.closest(".quiz-q"), qi = +qEl.getAttribute("data-q"), oi = +b.getAttribute("data-o");
        if (run.answers[qi] != null) return;
        run.answers[qi] = oi; card(oi === t.quiz[qi].a);
        var a = Object.keys(run.answers).length;
        if (a === t.quiz.length) {
          var rr = Object.keys(run.answers).filter(function (k) { return run.answers[k] === t.quiz[k].a; }).length;
          var prevQ = S.quiz[t.id] || { best: 0, attempts: 0 };
          S.quiz[t.id] = { best: Math.max(prevQ.best, rr), last: rr, attempts: (prevQ.attempts || 0) + 1 };
          if (rr === t.quiz.length && !S.done[t.id]) { S.done[t.id] = true; toast("Тест без ошибок — тема отмечена изученной"); }
          save(); renderNav(t.id);
        }
        var y = window.scrollY; renderQuiz(t); window.scrollTo(0, y);
      };
    });
    var again = $("#quizAgain", box);
    if (again) again.onclick = function () { quizRun[t.id] = { attempt: (S.quiz[t.id] && S.quiz[t.id].attempts) || run.attempt + 1, answers: {} }; renderQuiz(t); box.scrollIntoView({ block: "start" }); };
  }

  /* ---------- диагностикум ---------- */
  var diag = { tab: "train", sec: "all", kaf: true, cur: null, picked: null };
  function inLesson(m) {
    if (diag.sec === "all") return true;
    var hit = m.kaf.some(function (n) { return "l" + n === diag.sec; });
    return diag.kaf ? hit : hit || byId[m.topic].sec === diag.sec;
  }
  function pool() { return ALL_MICRO.filter(function (m) { return inLesson(m) && (!diag.kaf || m.kaf.length); }); }
  function nextItem() {
    var p = pool(); if (!p.length) return null;
    var m = p[Math.floor(Math.random() * p.length)];
    var same = ALL_MICRO.filter(function (x) { return x !== m && byId[x.topic].sec === byId[m.topic].sec && x.name !== m.name; });
    var other = ALL_MICRO.filter(function (x) { return x !== m && same.indexOf(x) < 0; });
    var wrong = shuffle(same).slice(0, 3); if (wrong.length < 3) wrong = wrong.concat(shuffle(other).slice(0, 3 - wrong.length));
    return { m: m, opts: shuffle([m].concat(wrong)) };
  }
  function renderDiag() {
    crumbs("Диагностикум");
    var html = '<div class="pa-gutter"><div class="pa-wrap" style="padding-top:26px"><div class="eyebrow">Все микропрепараты курса</div><h1 class="h1" style="margin-top:8px">Диагностикум</h1>' +
      '<p class="lead">Тренажёр показывает рисунок-схему препарата в цветах окраски (или фото, когда оно добавлено) — выберите правильный диагноз. Описание можно открыть как подсказку.</p>' +
      '<div style="margin-top:18px" class="pa-seg" role="tablist"><button data-tab="train" class="' + (diag.tab === "train" ? "is-on" : "") + '">Тренажёр</button><button data-tab="list" class="' + (diag.tab === "list" ? "is-on" : "") + '">Список</button></div>' +
      '<div class="filters">' + [{ id: "all", title: "Все занятия" }].concat(SECTIONS.filter(function (s) { return ALL_MICRO.some(function (m) { return byId[m.topic].sec === s.id; }); }).map(function (s) { return { id: s.id, title: "Занятие " + s.n, full: s.title }; })).map(function (s) { return '<button data-sec="' + s.id + '" title="' + esc(s.full || "") + '" class="' + (diag.sec === s.id ? "is-on" : "") + '">' + esc(s.title) + '</button>'; }).join("") + '</div>' +
      '<label class="kaf-toggle"><input type="checkbox" id="kafOnly"' + (diag.kaf ? " checked" : "") + '> Только перечень кафедры (' + pool().length + ')</label>' +
      '<div id="diagBody"></div>' + footer() + '</div></div>';
    view.innerHTML = html;
    $$("[data-tab]").forEach(function (b) { b.onclick = function () { diag.tab = b.getAttribute("data-tab"); renderDiag(); }; });
    $$("[data-sec]").forEach(function (b) { b.onclick = function () { diag.sec = b.getAttribute("data-sec"); diag.cur = null; diag.picked = null; renderDiag(); }; });
    var ko = $("#kafOnly"); if (ko) ko.onchange = function () { diag.kaf = ko.checked; diag.cur = null; diag.picked = null; renderDiag(); };
    if (diag.tab === "list") renderDiagList(); else renderTrainer();
    hydrate(view);
  }
  function renderDiagList() {
    var p = pool();
    $("#diagBody").innerHTML = '<div class="diag-list">' + p.map(function (m) {
      return '<a class="card dl-item" href="#' + m.topic + '--mp-' + m.id + '"><div class="dl-thumb">' + thumb(m, "dl-img") + '</div><div style="min-width:0"><div class="n">' + esc(m.num) + ' · ' + esc(m.stain) + (m.kaf.length ? "" : " · доп.") + '</div><div class="t">' + esc(m.name) + '</div><div class="s mono">' + esc(m.file.replace("img/micro/", "")) + '</div></div></a>';
    }).join("") + '</div>';
  }
  function renderTrainer() {
    if (!diag.cur) { diag.cur = nextItem(); diag.picked = null; }
    var c = diag.cur, body = $("#diagBody"); if (!c) { body.innerHTML = ""; return; }
    var m = c.m, t = byId[m.topic], done = diag.picked != null;
    var dr = drawing(m);
    body.innerHTML = '<div class="card trainer"><div class="trainer-photo" id="trPhoto">' + (dr && dr.src ? '<img alt="Схема препарата" src="' + dr.src + '">' : "") + '</div><div class="trainer-prompt">' +
      '<div class="mp-num">Счёт: ' + S.diag.right + ' из ' + S.diag.total + ' · окраска: ' + esc(m.stain) + '</div>' +
      (dr && dr.src && !done ? '<details class="tr-hint"><summary>Подсказка: описание препарата</summary><p class="mp-see" id="trSee">' + m.see + '</p></details>' : '<div class="mp-h" id="trLabel">Описание препарата</div><p class="mp-see" id="trSee">' + m.see + '</p>') +
      '<div class="mp-h">Ваш диагноз</div><div class="opts">' + c.opts.map(function (o, k) {
        var cls = !done ? "" : o === m ? " right" : o === diag.picked ? " wrong" : "";
        return '<button class="opt' + cls + '" data-k="' + k + '"' + (done ? " disabled" : "") + '><span class="k">' + "АБВГ"[k] + '</span><span>' + esc(o.name) + '</span></button>';
      }).join("") + '</div>' +
      (done ? '<div class="expl"><b>' + (diag.picked === m ? "Верно." : "Неверно.") + '</b> ' + esc(m.name) + ' — окраска: ' + esc(m.stain) + '. Тема: <a href="#' + t.id + '--mp-' + m.id + '" style="text-decoration:underline">' + esc(t.title) + '</a>.</div><div style="margin-top:12px"><button class="pa-btn pa-btn-primary" id="trNext">Следующий препарат</button></div>' : "") +
    '</div></div>';
    var img = new Image();
    img.onload = function () { var ph = $("#trPhoto"); if (!ph) return; ph.innerHTML = ""; ph.appendChild(img); img.onclick = function () { lightbox(m.file); }; };
    img.src = m.file;
    $$(".opt", body).forEach(function (b) {
      b.onclick = function () { if (diag.picked != null) return; diag.picked = c.opts[+b.getAttribute("data-k")]; var ok = diag.picked === m; S.diag.total++; if (ok) S.diag.right++; save(); card(ok); renderTrainer(); };
    });
    var nx = $("#trNext"); if (nx) nx.onclick = function () { diag.cur = null; renderTrainer(); };
  }

  /* ---------- окраски и алгоритм ---------- */
  var STAINS = [
    ["Гематоксилин и эозин (Г-Э)", "Обзорная окраска", "Ядра — сине-фиолетовые (гематоксилин), цитоплазма и волокна — розовые (эозин); соли кальция — тёмно-фиолетовые", null],
    ["Судан III", "Нейтральные жиры (замороженные срезы)", "Оранжево-красный", "судан iii"],
    ["Шарлах / судан IV", "Жиры", "Красный", "шарлах"],
    ["Осмиевая кислота", "Жиры", "Чёрный", "осми"],
    ["Нильский голубой", "Нейтральные жиры / жирные кислоты", "Красный / синий", "нильск"],
    ["Кармин Беста", "Гликоген (спиртовая фиксация)", "Красный", "беста"],
    ["ШИК-реакция (PAS)", "Гликоген, гликопротеиды, слизь, базальные мембраны, гиалин, фибриноид", "Малиново-красный", "шик"],
    ["Толуидиновый синий, тионин", "Гликозаминогликаны (мукоидное набухание), тучные клетки", "Метахромазия: сиренево-красный на синем фоне", "толуидин|тионин"],
    ["Конго красный", "Амилоид", "Кирпично-красный; в поляризованном свете — яблочно-зелёное свечение", "конго"],
    ["Метиловый (генциановый) фиолетовый", "Амилоид", "Красный на сине-фиолетовом фоне (метахромазия)", "фиолет"],
    ["Тиофлавин Т", "Амилоид", "Флуоресценция", "тиофлав"],
    ["Реакция Перлса (берлинская лазурь)", "Гемосидерин (трёхвалентное железо)", "Синий", "перлс"],
    ["Метод Косса", "Соли кальция", "Чёрный", "косса"],
    ["Пикрофуксин по ван Гизону", "Соединительная ткань", "Коллаген — красный; мышцы, цитоплазма, фибриноид — жёлтые", "гизон"],
    ["Фукселин (по Харту, Вейгерту), орсеин", "Эластические волокна", "Тёмно-фиолетовый / коричневый", "фукселин|орсеин"],
    ["Окраска по Цилю–Нильсену", "Кислотоустойчивые бактерии (микобактерии туберкулёза, лепры)", "Красные палочки на синем фоне", "цил"],
    ["Муцикармин, альциановый синий", "Слизь (муцины)", "Красный / голубой", "альциан|муцикармин"],
    ["Метиловый зелёный – пиронин (Браше)", "РНК (плазмоциты), ДНК", "Цитоплазма плазмоцитов — малиновая, ядра — зелёные", "пиронин"],
    ["Фонтана–Массон (серебрение), ДОФА-реакция", "Меланин", "Чёрный", "фонтана"],
    ["Шуенинов, MSB", "Фибрин", "Фибрин — красный/фиолетовый", "шуенинов|msb"],
    ["Трёхцветная окраска по Маллори", "Соединительная ткань, гиалин, фибрин", "Коллаген и гиалин — синие, мышцы и фибрин — красные", "маллори"]
  ];
  function renderMethod() {
    crumbs("Окраски и алгоритм");
    var usage = {};
    ALL_MICRO.forEach(function (m) { (usage[m.stain] = usage[m.stain] || []).push(m); });
    var html = '<div class="pa-gutter"><div class="pa-wrap" style="padding-top:26px"><div class="eyebrow">Справочник</div><h1 class="h1" style="margin-top:8px">Окраски и алгоритм описания</h1>' +
      '<div class="card block" style="margin-top:22px"><div class="block-h"><span class="dot dot-etio"></span><h3 class="h3">Алгоритм описания микропрепарата</h3></div><div class="block-b"><ul class="list">' +
      '<li><b>Орган/ткань</b> — по каким структурам узнаём (клубочки и канальцы, балки и центральные вены, альвеолы, кардиомиоциты).</li>' +
      '<li><b>Окраска</b> — и что она выявляет (Г-Э — обзорная; специальная — на конкретное вещество).</li>' +
      '<li><b>Изменения</b> — где (паренхима, строма, сосуды), какие клетки или вещество, распределение (очаговое/диффузное, центр/периферия), реакция окружающих тканей.</li>' +
      '<li><b>Диагноз</b> — название процесса + орган (+ возможная причина и исход).</li>' +
      '<li><b>Не перепутай</b> — один-два признака, отличающих от похожего препарата.</li>' +
      '</ul></div></div>' +
      '<div class="card tbl-wrap"><table class="pa-table"><caption>Основные окраски</caption><thead><tr><th>Окраска</th><th>Что выявляет</th><th>Цвет</th><th>Препараты атласа</th></tr></thead><tbody>' +
      STAINS.map(function (s) {
        var re = s[3] ? new RegExp(s[3], "i") : null;
        var hits = re ? ALL_MICRO.filter(function (m) { return re.test(m.stain); }) : [];
        return '<tr><th>' + esc(s[0]) + '</th><td>' + esc(s[1]) + '</td><td>' + esc(s[2]) + '</td><td>' + (!re ? "Большинство препаратов" : hits.length ? hits.map(function (m) { return '<a href="#' + m.topic + '--mp-' + m.id + '" style="text-decoration:underline">' + esc(m.num) + '</a>'; }).join(", ") : "—") + '</td></tr>';
      }).join("") + '</tbody></table></div>' + footer() + '</div></div>';
    view.innerHTML = html;
  }

  report();
  render();
})();

</script>
