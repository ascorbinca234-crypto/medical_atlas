`,Wm={id:"disease",section:"nozo",icon:"ScrollText",title:"Болезнь и этиология",short:"Норма, болезнь, причины и условия, терминальные состояния",tags:["здоровье","норма","патологическая реакция","патологический процесс","патологическое состояние","монокаузализм","кондиционализм","факторы риска","клиническая смерть","агония"],definition:"Болезнь — нарушение нормальной жизнедеятельности организма при действии повреждающих факторов, в котором повреждение сочетается с защитно-приспособительными реакциями и которое проявляется снижением адаптационных возможностей и трудоспособности.",defNote:"Этиология — учение о причинах и условиях возникновения болезней. Причина — фактор, без которого болезнь не возникает и который определяет её специфику. Условия — факторы, которые сами болезнь не вызывают, но способствуют или препятствуют действию причины.",classification:[{axis:"Основные понятия нозологии",items:["Патологическая реакция — кратковременная необычная (неадекватная) реакция на воздействие: ортостатическое падение АД, крапивница после клубники.","Патологический процесс — сочетание местных и общих реакций на повреждение, развивающееся во времени: воспаление, лихорадка, гипоксия.","Типовой патологический процесс — сложившийся в эволюции, стереотипный независимо от причины, вида животного и локализации.","Патологическое состояние — медленно развивающийся процесс или стойкое последствие болезни: рубец, культя, анкилоз, приобретённый порок сердца.","Болезнь — сочетание реакций, процессов и состояний со снижением адаптации."]},{axis:"Периоды болезни",items:["Латентный (для инфекций — инкубационный): от действия причины до первых симптомов.","Продромальный: первые неспецифические проявления (слабость, недомогание, субфебрилитет).","Разгара (выраженных проявлений): развёрнутая специфическая картина.","Исхода: полное или неполное выздоровление, рецидив, переход в хроническую форму, осложнение, смерть."]},{axis:"Направления учения об этиологии",items:["Монокаузализм (Р. Кох, Л. Пастер) — болезнь определяется одной причиной; не объясняет носительство и разную восприимчивость.","Кондиционализм (М. Ферворн) — болезнь — результат совокупности равнозначных условий; отрицает главенство причины.","Конституционализм — решающая роль наследственности и конституции.","Современный взгляд: причина необходима и определяет специфику; условия определяют вероятность, тяжесть и течение болезни."]}],etiology:["Физические: механические, термические, электрические, радиационные, барометрические факторы.","Химические: экзогенные яды, лекарства (ятрогении), эндогенные токсины.","Биологические: вирусы, бактерии, грибы, простейшие, гельминты.","Психогенные и социальные: психотравма, условия труда и быта.","Генетические: мутации и наследственная предрасположенность.","Факторы риска — условия, статистически повышающие вероятность болезни (курение, гиподинамия, ожирение), но не являющиеся её причиной."],signs:[{s:"Здоровье по уставу ВОЗ",m:"Состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней и физических дефектов."},{s:"Норма",m:"Среднестатистическая (в пределах M ± 2σ), идеальная, индивидуальная, функциональная (адаптивная) — оптимум для данного организма и условий."},{s:"Предболезнь",m:"Состояние сниженной адаптации без явной болезни; действие причины уже началось, но защитные механизмы справляются."},{s:"Ремиссия и рецидив",m:"Ремиссия — временное ослабление или исчезновение проявлений; рецидив — возврат болезни после кажущегося выздоровления."}],flows:[{title:"Терминальные состояния (умирание)",steps:[{k:"trigger",t:"Тяжёлое повреждение",d:"Массивная кровопотеря, шок, асфиксия, тяжёлая травма, остановка сердца."},{k:"primary",l:"Преагония",t:"Угнетение ЦНС и прогрессирующая гипотензия",d:"Спутанность или потеря сознания, падение АД, тахикардия сменяется брадикардией, учащённое поверхностное дыхание. Длительность — от минут до часов."},{k:"secondary",l:"Терминальная пауза",t:"Временная остановка дыхания",d:"От нескольких секунд до 3–4 минут; брадикардия, исчезновение роговичного рефлекса. Бывает не всегда."},{k:"secondary",l:"Агония",t:"Последняя вспышка жизнедеятельности",d:"Растормаживание продолговатого мозга при выключении коры: агональное дыхание (гаспинг), кратковременный подъём АД, иногда проблеск сознания."},{k:"main",l:"Клиническая смерть",t:"Остановка дыхания и кровообращения — обратимый этап",d:"При нормотермии длится около 5–6 минут — столько выдерживают нейроны коры. Это окно для реанимации."},{k:"outcome",l:"Биологическая смерть",t:"Необратимые изменения",d:"Гибель прежде всего коры, затем подкорковых структур и других органов. Достоверные признаки: трупные пятна, трупное окоченение, «кошачий глаз»."}]},{title:"Как развивается болезнь: причина и условия",steps:[{k:"trigger",t:"Действие причины",d:"Например, Mycobacterium tuberculosis — без неё туберкулёза нет, и она определяет специфику болезни."},{k:"primary",l:"Условия",t:"Способствующие и препятствующие факторы",d:"Иммунодефицит (ВИЧ), голодание, сахарный диабет, плохие жилищные условия повышают вероятность болезни; хорошее питание и иммунитет — снижают."},{k:"main",t:"Взаимодействие причины с реактивностью организма",d:"Исход контакта определяет не только причина, но и состояние организма: большинство инфицированных остаются здоровыми носителями."},{k:"secondary",l:"Повреждение и защита",t:"Борьба патологического и защитного",d:"Одновременно развиваются повреждение и саногенетические реакции."},{k:"outcome",t:"Исход",d:"Предболезнь без перехода в болезнь, болезнь с выздоровлением, хронизация или смерть."}]}],sanogenesis:["Реанимация эффективна в период клинической смерти; гипотермия удлиняет его за счёт снижения обмена нейронов.","При медленном умирании (длительная агония) клиническая смерть короче: запасы энергии в нейронах истощены заранее.","Выздоровление обеспечивают защитные, компенсаторные и восстановительные реакции (см. тему «Общий патогенез»)."],circles:[{kind:"vicious",title:"Умирание: гипоксия мозга и жизненно важные центры",nodes:["Гипоксия мозга","Угнетение дыхательного и сосудодвигательного центров","Гиповентиляция и падение АД","Углубление гипоксии мозга"],brk:"ИВЛ, восстановление кровообращения (компрессии грудной клетки, дефибрилляция, вазопрессоры), оксигенация."},{kind:"vicious",title:"Хронизация болезни",nodes:["Неполное выздоровление","Остаточный дефект и сниженная резистентность","Повторное действие причины или условий","Обострение и новый дефект"],brk:"Устранение причины и неблагоприятных условий, реабилитация, вторичная профилактика."}],traps:[{q:"Чем патологическая реакция отличается от патологического процесса и состояния?",a:"Реакция кратковременна (секунды–часы) и неадекватна раздражителю. Процесс развивается во времени и включает местные и общие изменения (воспаление). Состояние стабильно или медленно меняется — это последствие или исход (рубец, анкилоз). Одно может переходить в другое: процесс (воспаление) → состояние (рубец)."},{q:"Чем причина отличается от условия и фактора риска?",a:"Причина обязательна и определяет специфику. Условие без причины болезнь не вызывает, но меняет вероятность и течение. Фактор риска — статистическая связь, установленная эпидемиологически; это не обязательно условие в строгом смысле."},{q:"Какова критика монокаузализма и кондиционализма?",a:"Монокаузализм не объясняет, почему при контакте с одной и той же причиной заболевают не все. Кондиционализм уравнивает причину с условиями и делает этиотропное лечение бессмысленным, хотя антибиотик, устраняющий причину, излечивает инфекцию."},{q:"Сколько длится клиническая смерть и что её удлиняет?",a:"Около 5–6 минут при нормотермии. Удлиняют гипотермия (утопление в холодной воде) и внезапность умирания; укорачивают длительная агония, исходная гипоксия, гипертермия, старость."},{q:"Какие органы погибают первыми при умирании и почему?",a:"Кора больших полушарий: высокая потребность в O₂ при минимальных запасах гликогена и креатинфосфата. Затем подкорка, ствол; печень, почки и мышцы живут дольше — поэтому возможна трансплантация органов после смерти мозга."},{q:"Что такое ятрогения?",a:"Болезнь или осложнение, вызванные действиями медицинского работника: побочное действие лекарств, осложнения процедур, а также психогенные ятрогении, когда неосторожное слово врача формирует у пациента патологические переживания."}],quiz:[{q:"Отнесите к категориям: крапивница после клубники; воспаление лёгких; рубец после ожога; повышение АД при волнении у гипертоника.",a:"Крапивница — патологическая реакция; воспаление — патологический процесс; рубец — патологическое состояние; повышение АД при волнении у гипертоника — патологическая реакция на фоне болезни (гипертонической)."},{q:"Почему из сотни людей, вдохнувших микобактерии туберкулёза, заболевают единицы?",a:"Причина необходима, но недостаточна: значимы условия (иммунитет, питание, сопутствующие болезни, генетика, доза возбудителя) и реактивность организма."},{q:"Ребёнок извлечён из ледяной воды через 20 минут, сердечная деятельность восстановлена без грубого неврологического дефицита. Как это возможно?",a:"Гипотермия снизила потребность нейронов в O₂ и замедлила накопление повреждения, удлинив период клинической смерти."},{q:"У пациента при длительной агонии реанимация оказалась неэффективной уже через 2–3 минуты остановки сердца. Почему?",a:"При медленном умирании запасы энергии и устойчивость нейронов исчерпываются ещё до остановки кровообращения, поэтому период клинической смерти короче."}],tables:[{title:"Нозологические понятия",head:["Понятие","Длительность","Суть","Примеры"],rows:[["Патологическая реакция","секунды–часы","необычный ответ на раздражитель","обморок при виде крови, крапивница"],["Патологический процесс","часы–недели","комплекс местных и общих изменений","воспаление, лихорадка, тромбоз"],["Патологическое состояние","месяцы–годы","стойкое отклонение, последствие","рубец, анкилоз, культя, косолапость"],["Болезнь","различная","сочетание реакций, процессов, состояний со снижением адаптации","пневмония, гипертоническая болезнь"]]},{title:"Терминальные состояния",head:["Стадия","Сознание","Дыхание","Кровообращение"],rows:[["Преагония","спутанность, сопор","учащённое, поверхностное","АД ↓, тахикардия → брадикардия"],["Терминальная пауза","отсутствует","остановка на секунды–минуты","брадикардия, эпизоды асистолии"],["Агония","отсутствует (возможен проблеск)","агональное (гаспинг)","кратковременный подъём АД"],["Клиническая смерть","отсутствует","отсутствует","нет; обратимо ~5–6 мин"],["Биологическая смерть","—","—","необратимые изменения"]]}]},Gm={id:"pathogenesis",section:"nozo",icon:"Workflow",title:"Общий патогенез",short:"Звенья, главное звено, порочные круги, саногенез",tags:["главное звено","пусковое звено","причинно-следственные связи","порочный круг","саногенез","Павленко","Крыжановский","ГПУВ","местное и общее","патогенетическая терапия"],definition:"Патогенез — учение о механизмах возникновения, развития и исхода болезней, патологических процессов и состояний. Патогенез конкретной болезни — совокупность взаимосвязанных механизмов (звеньев), разворачивающихся после действия причины.",defNote:"Главное (ведущее) звено — изменение, которое необходимо для развития всех последующих и устранение которого ликвидирует болезнь или её основные проявления. Порочный круг — замкнутая цепь, в которой следствие усиливает причину (положительная обратная связь).",classification:[{axis:"Звенья патогенеза",items:["Пусковое (инициальное) — первичное повреждение, вызванное причиной.","Главное (ведущее) — определяет все последующие изменения и специфику болезни.","Второстепенные — вытекают из главного; их устранение облегчает состояние, но не прерывает болезнь."]},{axis:"Уровни повреждения",items:["Молекулярный, клеточный, тканевой, органный, системный, организменный."]},{axis:"Пути распространения повреждения",items:["Контактный (по продолжению), гематогенный, лимфогенный, по нервным стволам (столбнячный токсин, вирус бешенства), по ликвору, интраканаликулярный."]},{axis:"Саногенетические механизмы (по С.М. Павленко)",items:["Первичные — существуют и в здоровом организме: барьеры, фагоцитоз, детоксикация.","Вторичные — возникают при болезни: защитные (воспаление, кашель, рвота), компенсаторные (гипертрофия второй почки), восстановительные (регенерация), адаптационные (перестройка обмена).","Срочные и долговременные."]}],etiology:["Патогенез запускает причина, но дальше процесс может идти самостоятельно, уже без неё (автономизация): ожоговая болезнь продолжается после прекращения действия тепла.","Специфические механизмы определяются причиной, неспецифические — стереотипны (стресс, воспаление, лихорадка).","Местное и общее: Р. Вирхов считал болезнь суммой поражений клеток (целлюлярная патология); отечественная школа нервизма (И.П. Павлов, А.Д. Сперанский) подчёркивала роль целостной регуляции. Современный взгляд — единство местного и общего."],signs:[{s:"Этиотропная терапия",m:"Направлена на причину: антибиотик при пневмонии, удаление инородного тела."},{s:"Патогенетическая терапия",m:"Направлена на главное звено: инсулин при СД 1 типа, восполнение ОЦК при кровопотере."},{s:"Саногенетическая терапия",m:"Поддерживает механизмы выздоровления: иммуностимуляция, стимуляция регенерации."},{s:"Симптоматическая терапия",m:"Устраняет отдельные проявления: анальгетик, жаропонижающее."}],flows:[{title:"Причинно-следственная цепь на примере острой кровопотери",steps:[{k:"trigger",t:"Повреждение крупного сосуда",d:"Причина — механическая травма; пусковое звено — нарушение целостности сосуда."},{k:"primary",l:"Пусковое звено",t:"Потеря крови",d:"Уменьшается объём циркулирующей крови."},{k:"main",t:"Гиповолемия",d:"Из неё выводятся все дальнейшие изменения. Восполнение ОЦК разрывает цепь даже при том, что сосуд уже повреждён."},{k:"secondary",l:"Гемодинамика",t:"↓ венозного возврата и сердечного выброса, ↓ АД",d:"Гипоперфузия органов."},{k:"secondary",l:"Обмен",t:"Циркуляторная гипоксия, лактат-ацидоз",d:"Повреждение клеток, нарушение функций органов."},{k:"comp",l:"Саногенез",t:"Барорефлекс, централизация, аутогемодилюция, РААС, АДГ, эритропоэз",d:"Срочные механизмы поддерживают перфузию мозга и сердца, долговременные восстанавливают объём и состав крови."},{k:"outcome",t:"Исход",d:"Компенсация или геморрагический шок с полиорганной недостаточностью."}]},{title:"Генератор патологически усиленного возбуждения (Г.Н. Крыжановский)",steps:[{k:"trigger",t:"Повреждение или длительная стимуляция нейронов",d:"Травма, ишемия, токсины, деафферентация."},{k:"primary",l:"Первичное звено",t:"Недостаточность торможения",d:"↓ ГАМК- и глицинергического торможения, ↑ возбуждающих влияний (глутамат)."},{k:"main",t:"Образование генератора",d:"Агрегат гиперактивных взаимосвязанных нейронов, способный к самоподдерживающейся активности без внешней стимуляции."},{k:"secondary",l:"Вовлечение",t:"Формирование патологической системы",d:"Генератор становится патологической детерминантой и подчиняет другие структуры ЦНС."},{k:"outcome",t:"Клинические формы",d:"Эпилептические приступы, невралгия тройничного нерва, фантомные боли, нейропатическая боль; по сходному принципу рассматривают навязчивые состояния."}]}],sanogenesis:["Первичные барьеры: кожа, слизистые, лизоцим, кислое содержимое желудка, нормальная микрофлора.","Защитные реакции: воспаление, кашель, чихание, рвота, диарея, лихорадка.","Компенсаторные: гипертрофия органа, викарная функция парного органа, перераспределение кровотока.","Восстановительные: регенерация (полная — реституция, неполная — субституция рубцом).","Адаптационные: перестройка обмена и функций под новые условия (высотная акклиматизация)."],circles:[{kind:"vicious",title:"Кровопотеря и сердце",nodes:["↓ АД","↓ коронарного кровотока","↓ сократимости миокарда","↓ сердечного выброса"],brk:"Устранить главное звено — гиповолемию: восполнение ОЦК, остановка кровотечения."},{kind:"vicious",title:"Генератор возбуждения",nodes:["Ослабление торможения","Гиперактивные нейроны","Самоподдерживающийся генератор","Вовлечение новых нейронов"],brk:"Противосудорожные препараты (усиление ГАМК-торможения, блок Na⁺-каналов), устранение источника, хирургия очага."},{kind:"sanogenic",title:"Барорефлекс",nodes:["↓ АД","↓ импульсации барорецепторов","↑ симпатической активности","↑ ЧСС, ОПСС, АД"],brk:"Пример отрицательной обратной связи. Порочный круг — та же петля, но с положительной обратной связью."}],traps:[{q:"Чем пусковое звено отличается от главного?",a:"Пусковое — самое первое повреждение. Главное — то, от которого зависят все остальные и устранение которого прерывает болезнь. При кровопотере пусковое — повреждение сосуда, главное — гиповолемия. При СД 1 типа главное — дефицит инсулина."},{q:"Положительная обратная связь — всегда патология?",a:"Нет. Физиологические примеры: роды (окситоцин), овуляторный пик ЛГ, свёртывание крови, потенциал действия (Na⁺-каналы). Патологичной её делает выход из-под контроля и вред для организма."},{q:"Приведите примеры этиотропной, патогенетической и симптоматической терапии при одной болезни.",a:"Пневмония: антибиотик — этиотропная; кислород и коррекция гипоксемии, инфузии — патогенетическая; жаропонижающее и противокашлевое — симптоматическая."},{q:"Как соотносятся специфическое и неспецифическое в патогенезе?",a:"Специфические механизмы определяются свойствами причины (действие токсина на конкретную мишень). Неспецифические одинаковы при разных причинах: стресс, воспаление, лихорадка, гипоксия — это и есть типовые патологические процессы."},{q:"Что такое первичные и вторичные саногенетические механизмы?",a:"Первичные работают и в норме (барьеры, фагоцитоз, детоксикация), вторичные включаются при болезни (воспаление, компенсаторная гипертрофия, регенерация)."},{q:"Чем генератор патологически усиленного возбуждения отличается от обычного очага возбуждения?",a:"Генератор поддерживает свою активность сам, без внешней стимуляции, и навязывает её другим структурам, формируя патологическую систему."}],quiz:[{q:"Назовите главное звено патогенеза: СД 1 типа; тиреотоксикоз при болезни Грейвса; гемолитическая болезнь новорождённого.",a:"Дефицит инсулина; избыток тиреоидных гормонов, вызванный стимулирующими антителами к рецептору ТТГ; антитела матери против резус-антигена эритроцитов плода (иммунный гемолиз)."},{q:"Пациенту с острой кровопотерей перелили эритроцитную массу и плазму, хотя кровотечение уже остановлено хирургически. Какая это терапия?",a:"Патогенетическая — она устраняет главное звено (гиповолемию и анемию), а остановка кровотечения устранила пусковое звено."},{q:"После ампутации ноги у пациента мучительные боли в «отсутствующей» стопе. Механизм с позиций общей патологии?",a:"Формирование генератора патологически усиленного возбуждения в деафферентированных структурах (задние рога, таламус) и корковая реорганизация; генератор становится патологической детерминантой болевой системы."},{q:"Почему ожоговая болезнь прогрессирует, хотя действие высокой температуры давно прекратилось?",a:"Патогенез автономизировался: плазморрагия, интоксикация продуктами распада, инфекция, нарушения микроциркуляции поддерживают друг друга независимо от исходной причины."}],tables:[{title:"Виды терапии",head:["Вид","На что направлена","Пример"],rows:[["Этиотропная","на причину","антибиотик, антидот, удаление инородного тела"],["Патогенетическая","на главное и ключевые звенья","инсулин при СД 1, восполнение ОЦК, тромболизис"],["Саногенетическая","на механизмы выздоровления","стимуляция регенерации, иммунокоррекция"],["Симптоматическая","на отдельные проявления","анальгетики, жаропонижающие, противокашлевые"],["Заместительная","на восполнение недостающего","гормоны при гипофункции желёз, ферменты"]]}]},jm=`
